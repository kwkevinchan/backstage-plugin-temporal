<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 456" width="860" height="456" role="img" aria-label="Talking to a running workflow. On the left, the Client or the plugin sends a Signal, Update, Query, Cancel or Terminate to the running order-1001 Run 1. Signal, Update, Cancel and Terminate are recorded in the Event History; a Query is not. On the right, Run 1 continues as new into Run 2 and starts the Child Workflow notify-1001. Search Attributes and Memo are attached to the execution. Inputs, outputs and message arguments pass through the Data Converter, an optional Codec and External Storage, which keeps large payloads in S3, before they reach the Event History."><style>
:root{--bg:#f6f8fa;--surface:#ffffff;--ink:#1f2933;--muted:#52606d;--line:#9aa5b1;--acc:#0b6e7f;--acc-soft:#dcf1f4;--ours:#b0440d;--ours-soft:#fbe9dd;--fail:#b42318;--fail-soft:#fde8e6;--q:#e9edf1}
@media (prefers-color-scheme:dark){:root{--bg:#10151a;--surface:#1d2630;--ink:#e6ecf1;--muted:#a3b0bd;--line:#566574;--acc:#5cc6d4;--acc-soft:#12343b;--ours:#f2965d;--ours-soft:#3f2616;--fail:#f28b82;--fail-soft:#40201e;--q:#26313c}}
text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.bg{fill:var(--bg)}
.box{fill:var(--surface);stroke:var(--ink);stroke-width:1.5}
.acc{fill:var(--acc-soft);stroke:var(--acc);stroke-width:1.6}
.ours{fill:var(--ours-soft);stroke:var(--ours);stroke-width:1.5;stroke-dasharray:6 4}
.dash{stroke-dasharray:5 4}
.q{fill:var(--q);stroke:var(--line);stroke-width:1.2}
.bfail{fill:var(--fail-soft);stroke:var(--fail);stroke-width:1.5}
.bok{fill:var(--acc-soft);stroke:var(--acc);stroke-width:1.5}
.bwait{fill:none;stroke:var(--muted);stroke-width:1.3;stroke-dasharray:5 4}
.grid{stroke:var(--line);stroke-width:1}
.ln{stroke:var(--ink);stroke-width:1.7;fill:none}
.la{stroke:var(--acc);stroke-width:2;fill:none}
.lo{stroke:var(--ours);stroke-width:1.8;fill:none;stroke-dasharray:6 4}
.lm{stroke:var(--muted);stroke-width:1.7;fill:none;stroke-dasharray:4 4}
.mn{fill:var(--ink)}.ma{fill:var(--acc)}.mo{fill:var(--ours)}.mm{fill:var(--muted)}
.h{fill:var(--ink);font-size:15px;font-weight:700}
.t{fill:var(--ink);font-size:13.5px;font-weight:600}
.s{fill:var(--muted);font-size:12.5px}
.sa{fill:var(--acc);font-size:12.5px;font-weight:600}
.so{fill:var(--ours);font-size:12.5px;font-weight:600}
.sf{fill:var(--fail);font-size:12.5px;font-weight:600}
.c{text-anchor:middle}
.badge{fill:var(--acc);stroke:none}.bn{fill:var(--bg);font-size:12px;font-weight:700;text-anchor:middle}
</style><defs>
<marker id="mn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mn"/></marker>
<marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ma"/></marker>
<marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mo"/></marker>
<marker id="mm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mm"/></marker>
</defs><rect class="bg" x="0" y="0" width="860" height="456"/><path d="M14 17 L54 17" class="la" marker-end="url(#ma)"/><text x="62" y="21" class="s">recorded in the Event History</text><path d="M330 17 L370 17" class="lm" marker-end="url(#mm)"/><text x="378" y="21" class="s">not recorded</text><rect x="14" y="50" width="186" height="240" rx="6" class="ours"/><text x="28" y="74" class="h">Client or plugin button</text><text x="28" y="100" class="t">Signal…</text><text x="28" y="116" class="s">fire and forget</text><text x="28" y="138" class="t">Update…</text><text x="28" y="154" class="s">waits for the result</text><text x="28" y="176" class="t">Query…</text><text x="28" y="192" class="s">reads state only</text><text x="28" y="214" class="t">Cancel</text><text x="28" y="230" class="s">asks it to wind down</text><text x="28" y="252" class="t">Terminate</text><text x="28" y="268" class="s">stops it now; needs a reason</text><rect x="250" y="50" width="310" height="240" rx="8" class="acc"/><text x="264" y="74" class="h">order-1001 · Run 1 (running)</text><text x="264" y="94" class="s">State: approvedBy, current step</text><rect x="264" y="106" width="282" height="28" rx="4" class="box"/><text x="274" y="125" class="s">signal handler: changes state</text><rect x="264" y="142" width="282" height="28" rx="4" class="box"/><text x="274" y="161" class="s">update handler + validator: a result</text><rect x="264" y="178" width="282" height="28" rx="4" class="box"/><text x="274" y="197" class="s">query handler: read-only</text><text x="264" y="238" class="s">Cancel: the code can catch it and clean up</text><text x="264" y="264" class="s">Terminate: the server ends it; no code runs</text><path d="M200 100 L262 120" class="la" marker-end="url(#ma)"/><path d="M200 138 L262 152" class="la" marker-end="url(#ma)"/><path d="M200 178 L262 190" class="lm" marker-end="url(#mm)"/><path d="M262 196 L200 186" class="lm" marker-end="url(#mm)"/><path d="M200 214 L262 232" class="la" marker-end="url(#ma)"/><path d="M200 252 L262 260" class="la" marker-end="url(#ma)"/><text x="500" y="42" class="s">Continue-As-New (carries state)</text><path d="M560 96 L598 96" class="ln" marker-end="url(#mn)"/><rect x="598" y="50" width="248" height="96" rx="6" class="box"/><text x="612" y="74" class="t">order-1001 · Run 2</text><text x="612" y="94" class="s">Same Workflow ID, new Run ID,</text><text x="612" y="111" class="s">new empty history.</text><text x="612" y="128" class="s">The plugin shows Run 2 of 2.</text><path d="M560 218 L598 218" class="ln" marker-end="url(#mn)"/><rect x="598" y="172" width="248" height="118" rx="6" class="box"/><text x="612" y="196" class="t">Child Workflow</text><text x="612" y="216" class="s">Started by Run 1 as notify-1001:</text><text x="612" y="233" class="s">its own ID and history; the</text><text x="612" y="250" class="s">parent can wait for it. The</text><text x="612" y="267" class="s">plugin's box links to its page.</text><text x="24" y="322" class="s">attached to the execution</text><rect x="14" y="332" width="206" height="100" rx="6" class="box"/><text x="28" y="354" class="t">Search Attributes</text><text x="28" y="374" class="s">e.g. BackstageEntityRef:</text><text x="28" y="390" class="s">searchable. The plugin finds</text><text x="28" y="406" class="s">a component's workflows by it.</text><text x="28" y="422" class="s">Memo: notes, not searchable.</text><path d="M150 330 L266 292" class="ln" marker-end="url(#mn)"/><path d="M320 290 L320 354" class="la" marker-end="url(#ma)"/><text x="330" y="326" class="sa">inputs, outputs, message arguments</text><rect x="250" y="356" width="140" height="78" rx="6" class="box"/><text x="262" y="378" class="t">Data Converter</text><text x="262" y="398" class="s">value to Payload</text><text x="262" y="414" class="s">and back</text><path d="M390 395 L402 395" class="ln" marker-end="url(#mn)"/><rect x="402" y="356" width="140" height="78" rx="6" class="box dash"/><text x="414" y="378" class="t">Codec (optional)</text><text x="414" y="398" class="s">encrypt, compress</text><text x="414" y="414" class="s">the whole Payload</text><path d="M542 395 L554 395" class="ln" marker-end="url(#mn)"/><rect x="554" y="356" width="140" height="78" rx="6" class="box"/><text x="566" y="378" class="t">External Storage</text><text x="566" y="398" class="s">large Payloads go to</text><text x="566" y="414" class="s">S3; the history keeps</text><text x="566" y="430" class="s">a reference</text><path d="M694 395 L706 395" class="ln" marker-end="url(#mn)"/><rect x="706" y="356" width="140" height="78" rx="6" class="acc"/><text x="718" y="378" class="t">Event History</text><text x="718" y="398" class="s">Payloads, or the</text><text x="718" y="414" class="s">references to them</text></svg>
