<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 610" width="1280" height="610" role="img" aria-label="The packages in three layers: frontend packages in the Backstage app, backend packages in the Backstage backend, and two libraries, temporal-common and temporal-node, imported by both. The workflow kit belongs to the workers, outside Backstage."><style>
:root{--bg:#f6f8fa;--surface:#ffffff;--band:#e9edf1;--ink:#1f2933;--muted:#52606d;--line:#9aa5b1;--read:#0b6e7f;--read-soft:#dcf1f4;--act:#b0440d;--act-soft:#fbe9dd;--own:#6a3fb8;--own-soft:#ece6f9}
@media (prefers-color-scheme:dark){:root{--bg:#10151a;--surface:#1d2630;--band:#18202a;--ink:#e6ecf1;--muted:#a3b0bd;--line:#566574;--read:#5cc6d4;--read-soft:#12343b;--act:#f2965d;--act-soft:#3f2616;--own:#b9a0f6;--own-soft:#2b2146}}
text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.bg{fill:var(--bg)}.band{fill:var(--band)}.frame{fill:none;stroke:var(--ink);stroke-width:1.6}
.bx-n{fill:var(--surface);stroke:var(--ink);stroke-width:1.6}.bx-r{fill:var(--read-soft);stroke:var(--read);stroke-width:1.6}
.bx-a{fill:var(--act-soft);stroke:var(--act);stroke-width:1.6}.bx-o{fill:var(--own-soft);stroke:var(--own);stroke-width:1.6}
.chip{fill:var(--bg);stroke:var(--line);stroke-width:1.2}.wrap{fill:none;stroke:var(--act);stroke-width:1.6;stroke-dasharray:7 5}
.ar{stroke:var(--read);stroke-width:2.2;fill:none}.aa{stroke:var(--act);stroke-width:2.2;fill:none}.an{stroke:var(--ink);stroke-width:1.8;fill:none}.ao{stroke:var(--own);stroke-width:2.2;fill:none}
.ret{stroke-dasharray:7 5}.life{stroke:var(--line);stroke-width:1.4;stroke-dasharray:3 6}.loop{fill:none;stroke:var(--muted);stroke-width:1.3;stroke-dasharray:5 5}
.mf-r{fill:var(--read)}.mf-a{fill:var(--act)}.mf-n{fill:var(--ink)}.mf-o{fill:var(--own)}.dot-r{fill:var(--read)}.dot-a{fill:var(--act)}
.g1{fill:var(--ink);font-size:15.5px;font-weight:700}.g2{fill:var(--muted);font-size:12.5px}
.h-r{fill:var(--read);font-size:17px;font-weight:700}.h-a{fill:var(--act);font-size:17px;font-weight:700}
.tb{fill:var(--ink);font-size:14px;font-weight:700}.t{fill:var(--ink);font-size:13px;font-weight:500}
.tm{fill:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.tmb{fill:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;font-weight:600}
.ts{fill:var(--muted);font-size:12px}.lab{fill:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
.lr{fill:var(--read);font-size:12.5px;font-weight:600}.la{fill:var(--act);font-size:12.5px;font-weight:600}
.mid{text-anchor:middle}.end{text-anchor:end}.ml{fill:var(--ink);font-size:12.5px}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mf-r"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mf-a"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mf-n"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mf-o"/></marker></defs><rect class="bg" x="0" y="0" width="1280" height="610"/><rect x="24" y="20" width="1032" height="150" rx="10" class="band"/><rect x="24" y="190" width="1032" height="230" rx="10" class="band"/><rect x="24" y="440" width="1032" height="150" rx="10" class="band"/><text x="40" y="48" class="g1">Backstage app</text><text x="40" y="68" class="g2">frontend packages</text><text x="40" y="218" class="g1">Backstage backend</text><text x="40" y="238" class="g2">backend packages</text><text x="40" y="468" class="g1">Libraries</text><text x="40" y="488" class="g2">imported by both</text><rect x="190" y="40" width="205" height="110" rx="8" class="bx-r"/><text x="202" y="60" class="tmb" style="font-size:11.5px">temporal</text><text x="202" y="80" class="ts">Entity tab, Workflows page,</text><text x="202" y="96" class="ts">details; blueprints in /alpha</text><rect x="403" y="40" width="205" height="110" rx="8" class="bx-a"/><text x="415" y="60" class="tmb" style="font-size:11.5px">temporal-module-</text><text x="415" y="76" class="tmb" style="font-size:11.5px">control</text><text x="415" y="96" class="ts">Buttons and dialogs of</text><text x="415" y="112" class="ts">the operations</text><rect x="616" y="40" width="205" height="110" rx="8" class="bx-o"/><text x="628" y="60" class="tmb" style="font-size:11.5px">temporal-module-</text><text x="628" y="76" class="tmb" style="font-size:11.5px">zigflow</text><text x="628" y="96" class="ts">Definition tab for YAML</text><text x="628" y="112" class="ts">workflows (optional)</text><rect x="829" y="40" width="205" height="110" rx="8" class="bx-o"/><text x="841" y="60" class="tmb" style="font-size:11.5px">scaffolder-module-</text><text x="841" y="76" class="tmb" style="font-size:11.5px">temporal</text><text x="841" y="96" class="ts">TemporalWorkflowPicker</text><text x="841" y="112" class="ts">form field (optional)</text><rect x="190" y="212" width="205" height="130" rx="8" class="bx-r"/><text x="202" y="232" class="tmb" style="font-size:11.5px">temporal-backend</text><text x="202" y="252" class="ts">REST API /api/temporal:</text><text x="202" y="268" class="ts">read workflows, queries,</text><text x="202" y="284" class="ts">access checks (read-only)</text><rect x="403" y="212" width="205" height="130" rx="8" class="bx-a"/><text x="415" y="232" class="tmb" style="font-size:11.5px">temporal-backend-</text><text x="415" y="248" class="tmb" style="font-size:11.5px">module-control</text><text x="415" y="268" class="ts">Start, signal, update, cancel,</text><text x="415" y="284" class="ts">terminate, rerun, schedules,</text><text x="415" y="300" class="ts">custom actions</text><rect x="616" y="212" width="205" height="130" rx="8" class="bx-o"/><text x="628" y="232" class="tmb" style="font-size:11.5px">temporal-backend-</text><text x="628" y="248" class="tmb" style="font-size:11.5px">module-zigflow</text><text x="628" y="268" class="ts">Reads the YAML definition</text><text x="628" y="284" class="ts">files (optional)</text><rect x="829" y="212" width="205" height="60" rx="8" class="bx-o"/><text x="841" y="232" class="tmb" style="font-size:11.5px">catalog-backend-</text><text x="841" y="248" class="tmb" style="font-size:11.5px">module-temporal</text><text x="841" y="268" class="ts">TemporalWorkflow kind</text><rect x="829" y="282" width="205" height="60" rx="8" class="bx-o"/><text x="841" y="302" class="tmb" style="font-size:11.5px">scaffolder-backend-</text><text x="841" y="318" class="tmb" style="font-size:11.5px">module-temporal</text><text x="841" y="338" class="ts">Scaffolder actions</text><text x="190" y="372" class="ts">No backend module imports temporal-backend. The control module uses temporal-node;</text><text x="190" y="390" class="ts">the scaffolder module calls the plugin's HTTP routes as the user.</text><rect x="190" y="462" width="420" height="110" rx="8" class="bx-n"/><text x="202" y="482" class="tmb" style="font-size:11.5px">temporal-common</text><text x="202" y="502" class="ts">Types, permissions, API paths, annotation constants,</text><text x="202" y="518" class="ts">and the schema of the TemporalWorkflow kind</text><rect x="622" y="462" width="412" height="110" rx="8" class="bx-n"/><text x="634" y="482" class="tmb" style="font-size:11.5px">temporal-node</text><text x="634" y="502" class="ts">temporalServiceRef (shared client), temporalExtensionPoint;</text><text x="634" y="518" class="ts">in /alpha: temporalAccessServiceRef,</text><text x="634" y="534" class="ts">temporalControlExtensionPoint</text><rect x="1080" y="20" width="180" height="570" rx="10" class="band"/><text x="1096" y="48" class="g1">Your workers</text><text x="1096" y="68" class="g2">and Temporal</text><rect x="1094" y="100" width="152" height="160" rx="8" class="bx-n"/><text x="1106" y="120" class="tmb" style="font-size:11.5px">temporal-workflow-kit</text><text x="1106" y="140" class="ts">Experimental, private,</text><text x="1106" y="156" class="ts">not published. Loop and</text><text x="1106" y="172" class="ts">LLM markers of AI</text><text x="1106" y="188" class="ts">workflows (off by default)</text><rect x="1094" y="330" width="152" height="90" rx="8" class="bx-n"/><text x="1106" y="350" class="tmb" style="font-size:11.5px">Temporal Server</text><text x="1106" y="370" class="ts">gRPC; read by</text><text x="1106" y="386" class="ts">temporal-node</text><rect x="1094" y="450" width="152" height="90" rx="8" class="bx-n"/><text x="1106" y="470" class="tmb" style="font-size:11.5px">S3</text><text x="1106" y="490" class="ts">External Storage,</text><text x="1106" y="506" class="ts">read by temporal-backend</text></svg>
