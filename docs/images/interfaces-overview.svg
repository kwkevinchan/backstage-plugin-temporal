<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 660" width="1280" height="660" role="img" aria-label="Where the interfaces of the plugin are. In the Backstage app, your app and plugins use the npm entry points of temporal-frontend (1) and its extensions: blueprints, props and temporalApiRef (2). The browser, other backend plugins and the Scaffolder module call the HTTP API under /api/temporal (3). In the Backstage backend, your modules use the extension points and service refs (4), your permission policy the permissions and conditions (5), the catalog gets the TemporalWorkflow kind, and the plugin reads that kind and the annotations of entities (6), and app-config holds the temporal keys (7). The backend reaches Temporal with @temporalio/client and writes search attributes, the identity and audit events (8). Workers run your workflow code."><style>
:root{--bg:#f6f8fa;--surface:#ffffff;--band:#e9edf1;--ink:#1f2933;--muted:#52606d;--line:#9aa5b1;--read:#0b6e7f;--read-soft:#dcf1f4;--act:#b0440d;--act-soft:#fbe9dd;--own:#6a3fb8;--own-soft:#ece6f9}
@media (prefers-color-scheme:dark){:root{--bg:#10151a;--surface:#1d2630;--band:#18202a;--ink:#e6ecf1;--muted:#a3b0bd;--line:#566574;--read:#5cc6d4;--read-soft:#12343b;--act:#f2965d;--act-soft:#3f2616;--own:#b9a0f6;--own-soft:#2b2146}}
text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.bg{fill:var(--bg)}.band{fill:var(--band)}
.bx-n{fill:var(--surface);stroke:var(--ink);stroke-width:1.6}.bx-r{fill:var(--read-soft);stroke:var(--read);stroke-width:1.6}
.bx-a{fill:var(--act-soft);stroke:var(--act);stroke-width:1.6}.bx-o{fill:var(--own-soft);stroke:var(--own);stroke-width:1.6}
.chip{fill:var(--bg);stroke:var(--line);stroke-width:1.2}.wrap{fill:none;stroke:var(--act);stroke-width:1.6;stroke-dasharray:7 5}
.ar{stroke:var(--read);stroke-width:2.2;fill:none}.aa{stroke:var(--act);stroke-width:2.2;fill:none}.an{stroke:var(--ink);stroke-width:1.8;fill:none}.ao{stroke:var(--own);stroke-width:2.2;fill:none}
.ret{stroke-dasharray:7 5}
.mf-r{fill:var(--read)}.mf-a{fill:var(--act)}.mf-n{fill:var(--ink)}.mf-o{fill:var(--own)}
.num{fill:var(--ink)}.numt{fill:var(--bg);font-size:12.5px;font-weight:700}
.g1{fill:var(--ink);font-size:15.5px;font-weight:700}.g2{fill:var(--muted);font-size:12.5px}
.tb{fill:var(--ink);font-size:14px;font-weight:700}.t{fill:var(--ink);font-size:13px;font-weight:500}
.tm{fill:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.tms{fill:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;font-weight:600}
.tmb{fill:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;font-weight:600}
.ts{fill:var(--muted);font-size:12px}.lab{fill:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
.lr{fill:var(--read);font-size:12.5px;font-weight:600}.la{fill:var(--act);font-size:12.5px;font-weight:600}.lo{fill:var(--own);font-size:12.5px;font-weight:600}
.mid{text-anchor:middle}.end{text-anchor:end}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mf-r"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mf-a"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mf-n"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mf-o"/></marker></defs><rect class="bg" x="0" y="0" width="1280" height="660"/><rect x="24" y="20" width="620" height="270" rx="10" class="band"/><text x="40" y="48" class="g1">Backstage app</text><text x="40" y="68" class="g2">frontend packages</text><rect x="664" y="20" width="592" height="270" rx="10" class="band"/><text x="680" y="48" class="g1">Other clients</text><text x="680" y="68" class="g2">outside the plugin</text><rect x="24" y="320" width="920" height="320" rx="10" class="band"/><text x="40" y="348" class="g1">Backstage backend</text><text x="40" y="368" class="g2">backend packages</text><rect x="964" y="320" width="292" height="170" rx="10" class="band"/><text x="980" y="348" class="g1">Temporal</text><text x="980" y="368" class="g2">server</text><rect x="964" y="510" width="292" height="130" rx="10" class="band"/><text x="980" y="538" class="g1">Your workers</text><text x="980" y="558" class="g2">outside Backstage</text><rect x="44" y="80" width="260" height="190" rx="8" class="bx-n"/><text x="56" y="101" class="tb">Your app and plugins</text><text x="56" y="121" class="tm">App.tsx, EntityPage.tsx</text><text x="56" y="138" class="tm">createApp({ features })</text><text x="56" y="155" class="ts">your buttons, tabs, controls</text><text x="56" y="172" class="ts">your plugins that read workflows</text><rect x="364" y="80" width="260" height="190" rx="8" class="bx-r"/><text x="376" y="101" class="tmb">temporal-frontend</text><text x="376" y="121" class="tm">./alpha: plugin, 5 blueprints</text><text x="376" y="138" class="tm">.: components, props,</text><text x="376" y="155" class="tm">   temporalApiRef</text><text x="376" y="172" class="tm">./common: definitions (copy)</text><text x="376" y="189" class="tm">TemporalClient</text><path d="M304,140 L362,140" class="ar" marker-end="url(#ar)"/><circle cx="333" cy="122" r="11" class="num"/><text x="333" y="126.5" class="numt mid">1</text><path d="M304,220 L362,220" class="ar" marker-end="url(#ar)"/><circle cx="333" cy="202" r="11" class="num"/><text x="333" y="206.5" class="numt mid">2</text><rect x="684" y="80" width="272" height="80" rx="8" class="bx-n"/><text x="696" y="101" class="tb">Another backend plugin</text><text x="696" y="121" class="ts">service token or the user’s</text><rect x="684" y="180" width="272" height="90" rx="8" class="bx-n"/><text x="696" y="201" class="tms">scaffolder-backend-module-temporal</text><text x="696" y="221" class="tm">temporal:workflow:*</text><text x="696" y="238" class="ts">as the user of the template</text><rect x="364" y="380" width="300" height="240" rx="8" class="bx-a"/><text x="376" y="401" class="tmb">temporal-backend</text><text x="376" y="421" class="tm">routes under /api/temporal</text><text x="376" y="438" class="tm">TemporalAccessService</text><text x="376" y="455" class="tm">WorkflowQueries, WorkflowCommands</text><text x="376" y="472" class="tm">TemporalService</text><text x="376" y="489" class="tm">catalogModuleTemporalWorkflowKind</text><text x="376" y="506" class="ts"></text><text x="376" y="523" class="ts">writes: search attributes,</text><text x="376" y="540" class="ts">identity, audit events</text><path d="M494,270 L494,378" class="ao" marker-end="url(#ao)"/><circle cx="494" cy="318" r="11" class="num"/><text x="494" y="322.5" class="numt mid">3</text><text x="478" y="322" class="lo end">HTTP API  /api/temporal</text><path d="M956,120 L972,120 L972,300 L640,300 L640,378" class="ao" marker-end="url(#ao)"/><path d="M956,225 L972,225" class="ao"/><rect x="44" y="380" width="260" height="110" rx="8" class="bx-n"/><text x="56" y="401" class="tb">Your backend modules</text><text x="56" y="421" class="tm">pluginId: 'temporal'</text><text x="56" y="438" class="ts">extension points, service refs</text><text x="56" y="455" class="tm">./alpha, ./node</text><path d="M304,435 L362,435" class="aa" marker-end="url(#aa)"/><circle cx="333" cy="417" r="11" class="num"/><text x="333" y="421.5" class="numt mid">4</text><rect x="44" y="510" width="260" height="110" rx="8" class="bx-n"/><text x="56" y="531" class="tb">Your permission policy</text><text x="56" y="551" class="ts">permissions and conditions</text><text x="56" y="568" class="tm">./common, ./alpha</text><path d="M304,565 L362,565" class="aa" marker-end="url(#aa)"/><circle cx="333" cy="547" r="11" class="num"/><text x="333" y="551.5" class="numt mid">5</text><rect x="704" y="380" width="220" height="84" rx="8" class="bx-n"/><text x="716" y="401" class="tb">Catalog</text><text x="716" y="421" class="tm">kind: TemporalWorkflow</text><text x="716" y="438" class="tm">temporal.io/* annotations</text><path d="M666,420 L702,420" class="aa" marker-end="url(#aa)"/><circle cx="684" cy="402" r="11" class="num"/><text x="684" y="406.5" class="numt mid">6</text><rect x="704" y="536" width="220" height="84" rx="8" class="bx-n"/><text x="716" y="557" class="tmb">app-config.yaml</text><text x="716" y="577" class="tm">temporal.*  (config.d.ts)</text><text x="716" y="594" class="ts">some keys reach the browser</text><path d="M702,578 L666,578" class="aa" marker-end="url(#aa)"/><circle cx="684" cy="560" r="11" class="num"/><text x="684" y="564.5" class="numt mid">7</text><path d="M666,500 L944,500 L944,430 L982,430" class="ao" marker-end="url(#ao)"/><text x="700" y="492" class="lo">@temporalio/client</text><circle cx="870" cy="500" r="11" class="num"/><text x="870" y="504.5" class="numt mid">8</text><rect x="984" y="380" width="252" height="90" rx="8" class="bx-o"/><text x="996" y="401" class="tb">Temporal server</text><text x="996" y="421" class="ts">workflows, history, schedules</text><rect x="984" y="570" width="252" height="56" rx="8" class="bx-n"/><text x="996" y="591" class="tb">Workers</text><text x="996" y="611" class="ts">your workflow code</text><path d="M1110,568 L1110,472" class="an" marker-end="url(#an)"/></svg>
