<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1580" width="1280" height="1580" role="img" aria-label="Time runs downward in four phases. The user runs a template, whose step starts a workflow through the plugin as that user. A second step waits until the workflow sets a search attribute. An update is sent through the plugin and delivered to the workflow, which then completes. Every plugin call passes the permission checks."><style>
:root{--bg:#f6f8fa;--surface:#ffffff;--band:#e9edf1;--ink:#1f2933;--muted:#52606d;--line:#9aa5b1;--read:#0b6e7f;--read-soft:#dcf1f4;--act:#b0440d;--act-soft:#fbe9dd;--own:#6a3fb8;--own-soft:#ece6f9}
@media (prefers-color-scheme:dark){:root{--bg:#10151a;--surface:#1d2630;--band:#18202a;--ink:#e6ecf1;--muted:#a3b0bd;--line:#566574;--read:#5cc6d4;--read-soft:#12343b;--act:#f2965d;--act-soft:#3f2616;--own:#b9a0f6;--own-soft:#2b2146}}
text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.bg{fill:var(--bg)}.band{fill:var(--band)}.frame{fill:none;stroke:var(--ink);stroke-width:1.6}
.bx-n{fill:var(--surface);stroke:var(--ink);stroke-width:1.6}.bx-r{fill:var(--read-soft);stroke:var(--read);stroke-width:1.6}
.bx-a{fill:var(--act-soft);stroke:var(--act);stroke-width:1.6}.bx-o{fill:var(--own-soft);stroke:var(--own);stroke-width:1.6}
.chip{fill:var(--bg);stroke:var(--line);stroke-width:1.2}.wrap{fill:none;stroke:var(--act);stroke-width:1.6;stroke-dasharray:7 5}
.ar{stroke:var(--read);stroke-width:2.2;fill:none}.aa{stroke:var(--act);stroke-width:2.2;fill:none}.an{stroke:var(--ink);stroke-width:1.8;fill:none}.ao{stroke:var(--own);stroke-width:2.2;fill:none}
.ret{stroke-dasharray:7 5}.life{stroke:var(--line);stroke-width:1.4;stroke-dasharray:3 6}.loop{fill:none;stroke:var(--muted);stroke-width:1.3;stroke-dasharray:5 5}
.mf-r{fill:var(--read)}.mf-a{fill:var(--act)}.mf-n{fill:var(--ink)}.mf-o{fill:var(--own)}.dot-r{fill:var(--read)}.dot-a{fill:var(--act)}
.g1{fill:var(--ink);font-size:15.5px;font-weight:700}.g2{fill:var(--muted);font-size:12.5px}
.h-r{fill:var(--read);font-size:17px;font-weight:700}.h-a{fill:var(--act);font-size:17px;font-weight:700}
.tb{fill:var(--ink);font-size:14px;font-weight:700}.t{fill:var(--ink);font-size:13px;font-weight:500}
.tm{fill:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.tmb{fill:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;font-weight:600}
.ts{fill:var(--muted);font-size:12px}.lab{fill:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
.lr{fill:var(--read);font-size:12.5px;font-weight:600}.la{fill:var(--act);font-size:12.5px;font-weight:600}
.mid{text-anchor:middle}.end{text-anchor:end}.ml{fill:var(--ink);font-size:12.5px}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mf-r"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mf-a"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mf-n"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mf-o"/></marker></defs><rect class="bg" x="0" y="0" width="1280" height="1580"/><rect x="24" y="150" width="1232" height="430" rx="10" class="band"/><rect x="24" y="610" width="1232" height="280" rx="10" class="band"/><rect x="24" y="920" width="1232" height="400" rx="10" class="band"/><rect x="24" y="1350" width="1232" height="200" rx="10" class="band"/><text x="40" y="184" class="g1">Start</text><text x="40" y="204" class="g2">The user runs the template</text><text x="40" y="644" class="g1">Wait</text><text x="40" y="664" class="g2">The template is still running</text><text x="40" y="954" class="g1">Decision</text><text x="40" y="974" class="g2">Someone sends an update</text><text x="40" y="1384" class="g1">Finish</text><text x="40" y="1404" class="g2">The workflow completes by itself</text><line x1="290" y1="118" x2="290" y2="1550" class="life"/><line x1="500" y1="118" x2="500" y2="1550" class="life"/><line x1="730" y1="118" x2="730" y2="1550" class="life"/><line x1="960" y1="118" x2="960" y2="1550" class="life"/><line x1="1160" y1="118" x2="1160" y2="1550" class="life"/><rect x="205" y="60" width="170" height="58" rx="8" class="bx-n"/><text x="290" y="84" class="tb mid">Browser</text><text x="290" y="104" class="ts mid">Create page, details page</text><rect x="415" y="60" width="170" height="58" rx="8" class="bx-n"/><text x="500" y="84" class="tb mid">Scaffolder backend</text><text x="500" y="104" class="ts mid">runs the template steps</text><rect x="645" y="60" width="170" height="58" rx="8" class="bx-n"/><text x="730" y="84" class="tb mid">Temporal plugin backend</text><text x="730" y="104" class="ts mid">the layers of figure 1</text><rect x="875" y="60" width="170" height="58" rx="8" class="bx-n"/><text x="960" y="84" class="tb mid">Temporal Server</text><text x="960" y="104" class="ts mid">keeps the workflow state</text><rect x="1075" y="60" width="170" height="58" rx="8" class="bx-o"/><text x="1160" y="84" class="tb mid">Worker</text><text x="1160" y="104" class="ts mid">your workflow code</text><line x1="290" y1="200" x2="500" y2="200" class="an" marker-end="url(#an)"/><text x="302" y="191" class="ml">Submit the template</text><text x="302" y="218" class="ts">form: service, environment</text><rect x="400" y="240" width="200" height="26" rx="13" class="chip"/><text x="500" y="257" class="lab" style="text-anchor:middle">temporal:workflow:start</text><line x1="500" y1="300" x2="730" y2="300" class="aa" marker-end="url(#aa)"/><text x="512" y="291" class="lab">POST /entities/…/workflows</text><text x="512" y="318" class="la">as the user who ran the template</text><rect x="620" y="334" width="220" height="110" rx="8" class="bx-a"/><text x="634" y="357" class="t">start permission on the entity</text><text x="634" y="377" class="t">the entity's workflow type</text><text x="634" y="394" class="t">and task queue only</text><text x="634" y="414" class="t">audit event: workflow-start</text><text x="634" y="434" class="t">sets entityRef, initiator</text><line x1="730" y1="470" x2="960" y2="470" class="aa" marker-end="url(#aa)"/><text x="742" y="461" class="lab">startWorkflowExecution</text><line x1="730" y1="520" x2="500" y2="520" class="aa ret" marker-end="url(#aa)"/><text x="512" y="511" class="ml">201 with the workflowId</text><line x1="960" y1="520" x2="1160" y2="520" class="an" marker-end="url(#an)"/><text x="972" y="511" class="ml">task on the task queue</text><rect x="1075" y="534" width="170" height="46" rx="8" class="bx-o"/><text x="1160" y="554" class="t mid">starts running</text><text x="1160" y="571" class="ts mid">your workflow code</text><rect x="400" y="636" width="200" height="26" rx="13" class="chip"/><text x="500" y="653" class="lab" style="text-anchor:middle">temporal:workflow:wait</text><rect x="1075" y="634" width="170" height="66" rx="8" class="bx-o"/><text x="1160" y="657" class="t mid" style="font-size:12px">Reaches a decision point</text><text x="1160" y="676" class="ts mid">sets a search attribute</text><text x="1160" y="692" class="ts mid" style="font-size:11px">(for example ApprovalPending)</text><line x1="1160" y1="724" x2="960" y2="724" class="ao" marker-end="url(#ao)"/><text x="972" y="715" class="lab">attribute = true</text><rect x="420" y="750" width="620" height="90" rx="10" class="loop"/><rect x="436" y="740" width="262" height="20" rx="0" class="band"/><text x="444" y="755" class="ts">repeat until the attribute is true</text><line x1="500" y1="800" x2="730" y2="800" class="ar" marker-end="url(#ar)"/><text x="512" y="791" class="lab">GET …/workflows/:workflowId</text><text x="512" y="818" class="lr">every intervalSeconds (default 5)</text><line x1="730" y1="800" x2="960" y2="800" class="ar" marker-end="url(#ar)"/><text x="742" y="791" class="lab">describeWorkflowExecution</text><line x1="500" y1="868" x2="290" y2="868" class="an ret" marker-end="url(#an)"/><text x="302" y="859" class="ml">Template done, with a link to the workflow</text><line x1="290" y1="980" x2="730" y2="980" class="aa" marker-end="url(#aa)"/><text x="302" y="971" class="lab">POST …/workflows/:workflowId/update</text><text x="302" y="998" class="ts">Update… dialog (or another template step)</text><rect x="615" y="1010" width="230" height="110" rx="8" class="bx-a"/><text x="629" y="1033" class="t">the same access gate (figure 1)</text><text x="629" y="1053" class="t">update permission</text><text x="629" y="1073" class="t">name allowed by allowedUpdates</text><text x="629" y="1093" class="t">audit event: workflow-update</text><text x="629" y="1111" class="t">run must be running</text><line x1="730" y1="1150" x2="960" y2="1150" class="ao" marker-end="url(#ao)"/><text x="742" y="1141" class="lab">updateWorkflowExecution</text><text x="742" y="1168" class="ts">with the user's identity</text><line x1="960" y1="1150" x2="1160" y2="1150" class="an" marker-end="url(#an)"/><text x="972" y="1141" class="ml">hand to the workflow</text><rect x="1075" y="1164" width="170" height="62" rx="8" class="bx-o"/><text x="1160" y="1188" class="t mid">validator checks it</text><text x="1160" y="1208" class="ts mid" style="font-size:11.5px">handler records the decision</text><line x1="1160" y1="1252" x2="290" y2="1252" class="an ret" marker-end="url(#an)"/><text x="302" y="1243" class="ml">Result shown in the dialog</text><text x="742" y="1243" class="ml">the update result, or the validator error</text><rect x="1075" y="1372" width="170" height="70" rx="8" class="bx-o"/><text x="1160" y="1396" class="t mid">Continues and completes</text><text x="1160" y="1416" class="ts mid">attribute set back to false</text><line x1="1160" y1="1470" x2="960" y2="1470" class="ao" marker-end="url(#ao)"/><text x="972" y="1461" class="ml">Completed</text><line x1="290" y1="1520" x2="730" y2="1520" class="ar" marker-end="url(#ar)"/><text x="302" y="1511" class="ml">Page reloads</text><text x="512" y="1511" class="ts">the read path of figure 1</text><line x1="730" y1="1520" x2="960" y2="1520" class="ar" marker-end="url(#ar)"/></svg>
