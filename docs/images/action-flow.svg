<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" width="1280" height="700" role="img" aria-label="One custom action in nine steps. In the browser: (1) the button of TemporalControlActionBlueprint, with your params label, confirm, body, permission (disables the button) and filter (shows it); (2) TemporalApi.runWorkflowAction(); (3) POST /api/temporal/namespaces/:namespace/workflows/:workflowId/runs/:runId/actions/:actionId. In the backend: (4) the route exists only when temporal.control.enabled is true, else 404; (5) loadWorkflow() checks the namespace and the read level on the entity; (6) authorizeOn() checks the action’s permission, else 403; (7) the action’s filter, else 409; (8) the auditor records workflow-action; (9) action.handle() runs with the entity, workflow, credentials and Temporal client and calls Temporal. Its value comes back as { result } and the button shows it. Your code runs at steps 1, 7 and 9."><style>
:root{--bg:#f6f8fa;--surface:#ffffff;--band:#e9edf1;--ink:#1f2933;--muted:#52606d;--line:#9aa5b1;--read:#0b6e7f;--read-soft:#dcf1f4;--act:#b0440d;--act-soft:#fbe9dd;--own:#6a3fb8;--own-soft:#ece6f9}
@media (prefers-color-scheme:dark){:root{--bg:#10151a;--surface:#1d2630;--band:#18202a;--ink:#e6ecf1;--muted:#a3b0bd;--line:#566574;--read:#5cc6d4;--read-soft:#12343b;--act:#f2965d;--act-soft:#3f2616;--own:#b9a0f6;--own-soft:#2b2146}}
text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.bg{fill:var(--bg)}.band{fill:var(--band)}
.bx-n{fill:var(--surface);stroke:var(--ink);stroke-width:1.6}.bx-r{fill:var(--read-soft);stroke:var(--read);stroke-width:1.6}
.bx-a{fill:var(--act-soft);stroke:var(--act);stroke-width:1.6}.bx-o{fill:var(--own-soft);stroke:var(--own);stroke-width:1.6}
.chip{fill:var(--bg);stroke:var(--line);stroke-width:1.2}.wrap{fill:none;stroke:var(--act);stroke-width:1.6;stroke-dasharray:7 5}
.ar{stroke:var(--read);stroke-width:2.2;fill:none}.aa{stroke:var(--act);stroke-width:2.2;fill:none}.an{stroke:var(--ink);stroke-width:1.8;fill:none}.ao{stroke:var(--own);stroke-width:2.2;fill:none}
.ret{stroke-dasharray:7 5}
.mf-r{fill:var(--read)}.mf-a{fill:var(--act)}.mf-n{fill:var(--ink)}.mf-o{fill:var(--own)}
.num{fill:var(--ink)}.numt{fill:var(--bg);font-size:12.5px;font-weight:700}
.g1{fill:var(--ink);font-size:15.5px;font-weight:700}.g2{fill:var(--muted);font-size:12.5px}
.tb{fill:var(--ink);font-size:14px;font-weight:700}.t{fill:var(--ink);font-size:13px;font-weight:500}
.tm{fill:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.tmb{fill:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;font-weight:600}
.ts{fill:var(--muted);font-size:12px}.lab{fill:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
.lr{fill:var(--read);font-size:12.5px;font-weight:600}.la{fill:var(--act);font-size:12.5px;font-weight:600}.lo{fill:var(--own);font-size:12.5px;font-weight:600}
.mid{text-anchor:middle}.end{text-anchor:end}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mf-r"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mf-a"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mf-n"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mf-o"/></marker></defs><rect class="bg" x="0" y="0" width="1280" height="700"/><rect x="24" y="20" width="360" height="660" rx="10" class="band"/><text x="40" y="48" class="g1">Browser</text><text x="40" y="68" class="g2">temporal-frontend</text><rect x="404" y="20" width="560" height="660" rx="10" class="band"/><text x="420" y="48" class="g1">Backstage backend</text><text x="420" y="68" class="g2">temporal-backend, controlRoutes.ts</text><rect x="984" y="20" width="272" height="660" rx="10" class="band"/><text x="1000" y="48" class="g1">Temporal</text><text x="1000" y="68" class="g2">server and worker</text><rect x="44" y="80" width="320" height="110" rx="8" class="bx-r"/><text x="56" y="101" class="tmb">TemporalControlActionBlueprint</text><text x="56" y="121" class="tm">label, confirm, body(workflow)</text><text x="56" y="138" class="tm">permission  → button disabled</text><text x="56" y="155" class="tm">filter      → button shown</text><circle cx="44" cy="80" r="11" class="num"/><text x="44" y="84.5" class="numt mid">1</text><rect x="270" y="162" width="86" height="20" rx="10" class="bx-a"/><text x="313" y="176" class="la mid">your code</text><path d="M204,190 L204,218" class="ar" marker-end="url(#ar)"/><rect x="44" y="220" width="320" height="70" rx="8" class="bx-r"/><text x="56" y="241" class="tmb">TemporalApi.runWorkflowAction()</text><text x="56" y="261" class="tm">(ref, actionId, body, { entityRef })</text><circle cx="44" cy="220" r="11" class="num"/><text x="44" y="224.5" class="numt mid">2</text><path d="M364,262 L422,262" class="ao" marker-end="url(#ao)"/><text x="424" y="140" class="lab">POST /api/temporal/namespaces/:namespace/workflows/</text><text x="424" y="158" class="lab">     :workflowId/runs/:runId/actions/:actionId?entityRef=…</text><circle cx="394" cy="244" r="11" class="num"/><text x="394" y="248.5" class="numt mid">3</text><rect x="424" y="220" width="520" height="60" rx="8" class="bx-a"/><text x="436" y="241" class="tmb">temporal.control.enabled</text><text x="436" y="261" class="ts">route exists only when true</text><circle cx="424" cy="220" r="11" class="num"/><text x="424" y="224.5" class="numt mid">4</text><text x="930" y="242" class="lab end">404</text><path d="M684,280 L684,294" class="an" marker-end="url(#an)"/><rect x="424" y="296" width="520" height="60" rx="8" class="bx-a"/><text x="436" y="317" class="tmb">loadWorkflow()</text><text x="436" y="337" class="ts">namespace, read level on the entity</text><circle cx="424" cy="296" r="11" class="num"/><text x="424" y="300.5" class="numt mid">5</text><text x="930" y="318" class="lab end">400 / 403 / 404</text><path d="M684,356 L684,370" class="an" marker-end="url(#an)"/><rect x="424" y="372" width="520" height="60" rx="8" class="bx-a"/><text x="436" y="393" class="tmb">authorizeOn(action.permission)</text><text x="436" y="413" class="ts">the action’s permission on the entity</text><circle cx="424" cy="372" r="11" class="num"/><text x="424" y="376.5" class="numt mid">6</text><text x="930" y="394" class="lab end">403</text><path d="M684,432 L684,446" class="an" marker-end="url(#an)"/><rect x="424" y="448" width="520" height="60" rx="8" class="bx-a"/><text x="436" y="469" class="tmb">action.filter(workflow)</text><text x="436" y="489" class="ts">optional</text><circle cx="424" cy="448" r="11" class="num"/><text x="424" y="452.5" class="numt mid">7</text><text x="930" y="470" class="lab end">409</text><path d="M684,508 L684,522" class="an" marker-end="url(#an)"/><rect x="424" y="524" width="520" height="60" rx="8" class="bx-a"/><text x="436" y="545" class="tmb">auditor  workflow-action</text><text x="436" y="565" class="ts">success or failure is recorded</text><circle cx="424" cy="524" r="11" class="num"/><text x="424" y="528.5" class="numt mid">8</text><rect x="850" y="482" width="86" height="20" rx="10" class="bx-a"/><text x="893" y="496" class="la mid">your code</text><path d="M684,580 L684,598" class="an" marker-end="url(#an)"/><rect x="424" y="600" width="520" height="66" rx="8" class="bx-a"/><text x="436" y="621" class="tmb">action.handle(ref, body, context)</text><text x="436" y="641" class="tm">{ entity?, workflow, credentials, client }</text><circle cx="424" cy="600" r="11" class="num"/><text x="424" y="604.5" class="numt mid">9</text><rect x="850" y="644" width="86" height="20" rx="10" class="bx-a"/><text x="893" y="658" class="la mid">your code</text><path d="M944,630 L1002,630" class="ao" marker-end="url(#ao)"/><rect x="1004" y="590" width="232" height="76" rx="8" class="bx-o"/><text x="1016" y="611" class="tmb">client.workflow</text><text x="1016" y="631" class="tm">getHandle(…)</text><text x="1016" y="648" class="tm">.executeUpdate(…)</text><path d="M424,640 C300,640 280,420 204,292" class="ao ret" marker-end="url(#ao)"/><text x="110" y="470" class="lo">{ result } → the button</text><text x="110" y="490" class="ts">shows the result</text></svg>
