<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 730" width="1280" height="730" role="img" aria-label="Where frontend extensions appear. On the right, the pages of the entity tab and of the Workflows page: above a workflow list the list actions (Start workflow, then yours), on each schedule the schedule actions, on the details page of a run the actions in the action bar (Signal, Cancel and the other operations, then yours, before Query and Refresh) and the sections as tabs after Steps, Timeline, Events and Details. On the left, the new frontend system: the five blueprints attach to the inputs actions, sections, listActions and scheduleActions of api:temporal/workflow-extensions, which is not exported; the legacy system: the props workflowActions, workflowSections, workflowListActions and scheduleActions of EntityTemporalContent and TemporalPage, and createTemporalControlActionDef. Both meet at the same places, props first, one entry per id. Components get TemporalWorkflowExtensionProps or useTemporalWorkflow() and call the backend with temporalApiRef (api:temporal, TemporalClient)."><style>
:root{--bg:#f6f8fa;--surface:#ffffff;--band:#e9edf1;--ink:#1f2933;--muted:#52606d;--line:#9aa5b1;--read:#0b6e7f;--read-soft:#dcf1f4;--act:#b0440d;--act-soft:#fbe9dd;--own:#6a3fb8;--own-soft:#ece6f9}
@media (prefers-color-scheme:dark){:root{--bg:#10151a;--surface:#1d2630;--band:#18202a;--ink:#e6ecf1;--muted:#a3b0bd;--line:#566574;--read:#5cc6d4;--read-soft:#12343b;--act:#f2965d;--act-soft:#3f2616;--own:#b9a0f6;--own-soft:#2b2146}}
text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.bg{fill:var(--bg)}.band{fill:var(--band)}
.bx-n{fill:var(--surface);stroke:var(--ink);stroke-width:1.6}.bx-r{fill:var(--read-soft);stroke:var(--read);stroke-width:1.6}
.bx-a{fill:var(--act-soft);stroke:var(--act);stroke-width:1.6}.bx-o{fill:var(--own-soft);stroke:var(--own);stroke-width:1.6}
.chip{fill:var(--bg);stroke:var(--line);stroke-width:1.2}.wrap{fill:none;stroke:var(--act);stroke-width:1.6;stroke-dasharray:7 5}
.ar{stroke:var(--read);stroke-width:2.2;fill:none}.aa{stroke:var(--act);stroke-width:2.2;fill:none}.an{stroke:var(--ink);stroke-width:1.8;fill:none}.ao{stroke:var(--own);stroke-width:2.2;fill:none}
.ret{stroke-dasharray:7 5}
.mf-r{fill:var(--read)}.mf-a{fill:var(--act)}.mf-n{fill:var(--ink)}.mf-o{fill:var(--own)}
.num{fill:var(--ink)}.numt{fill:var(--bg);font-size:12.5px;font-weight:700}
.g1{fill:var(--ink);font-size:15.5px;font-weight:700}.g2{fill:var(--muted);font-size:12.5px}
.tb{fill:var(--ink);font-size:14px;font-weight:700}.t{fill:var(--ink);font-size:13px;font-weight:500}
.tm{fill:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.tmb{fill:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;font-weight:600}
.ts{fill:var(--muted);font-size:12px}.lab{fill:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
.lr{fill:var(--read);font-size:12.5px;font-weight:600}.la{fill:var(--act);font-size:12.5px;font-weight:600}.lo{fill:var(--own);font-size:12.5px;font-weight:600}
.mid{text-anchor:middle}.end{text-anchor:end}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mf-r"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mf-a"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mf-n"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mf-o"/></marker></defs><rect class="bg" x="0" y="0" width="1280" height="730"/><rect x="24" y="20" width="420" height="420" rx="10" class="band"/><text x="40" y="48" class="g1">New frontend system</text><text x="40" y="68" class="g2">@…/temporal-frontend/alpha</text><rect x="24" y="460" width="420" height="250" rx="10" class="band"/><text x="40" y="488" class="g1">Legacy frontend system</text><text x="40" y="508" class="g2">@…/temporal-frontend</text><rect x="480" y="20" width="776" height="690" rx="10" class="band"/><text x="496" y="48" class="g1">The pages</text><text x="496" y="68" class="g2">entity tab (entity-content:temporal) and Workflows page (page:temporal)</text><rect x="40" y="80" width="300" height="28" rx="5" class="chip"/><text x="48" y="98" class="tm">TemporalWorkflowActionBlueprint</text><rect x="40" y="116" width="300" height="28" rx="5" class="chip"/><text x="48" y="134" class="tm">TemporalControlActionBlueprint</text><rect x="40" y="152" width="300" height="28" rx="5" class="chip"/><text x="48" y="170" class="tm">TemporalWorkflowSectionBlueprint</text><rect x="40" y="188" width="300" height="28" rx="5" class="chip"/><text x="48" y="206" class="tm">TemporalWorkflowListActionBlueprint</text><rect x="40" y="224" width="300" height="28" rx="5" class="chip"/><text x="48" y="242" class="tm">TemporalScheduleActionBlueprint</text><rect x="40" y="270" width="388" height="150" rx="8" class="bx-r"/><text x="52" y="291" class="tmb">api:temporal/workflow-extensions</text><text x="52" y="311" class="ts">collects the blueprints (not exported)</text><text x="52" y="328" class="tm">inputs: actions, sections,</text><text x="52" y="345" class="tm">        listActions, scheduleActions</text><text x="52" y="362" class="ts">plugin extensions use it too:</text><text x="52" y="379" class="tm">temporal-workflow-action:temporal/controls …</text><path d="M340,94 C380,94 400,200 400,268" class="ar" marker-end="url(#ar)"/><path d="M340,130 C380,130 400,200 400,268" class="ar" marker-end="url(#ar)"/><path d="M340,166 C380,166 400,200 400,268" class="ar" marker-end="url(#ar)"/><path d="M340,202 C380,202 400,200 400,268" class="ar" marker-end="url(#ar)"/><path d="M340,238 C380,238 400,200 400,268" class="ar" marker-end="url(#ar)"/><rect x="40" y="520" width="388" height="120" rx="8" class="bx-o"/><text x="52" y="541" class="tmb">EntityTemporalContent, TemporalPage</text><text x="52" y="561" class="tm">workflowActions</text><text x="52" y="578" class="tm">workflowSections</text><text x="52" y="595" class="tm">workflowListActions, scheduleActions</text><text x="52" y="612" class="tm">createTemporalControlActionDef()</text><text x="40" y="664" class="ts">props first, then extensions; one entry per id</text><text x="40" y="684" class="ts">the plugin’s operations come first in both</text><text x="500" y="92" class="lr">teal: input of api:temporal/workflow-extensions (new system)</text><text x="860" y="92" class="lo">purple: prop (legacy system)</text><rect x="500" y="104" width="736" height="206" rx="8" class="bx-n"/><text x="512" y="125" class="tb">Workflow list</text><rect x="760" y="112" width="250" height="30" rx="6" class="wrap"/><rect x="768" y="116" width="120" height="22" rx="5" class="chip"/><text x="776" y="131" class="ts">Start workflow</text><rect x="894" y="116" width="108" height="22" rx="5" class="chip"/><text x="902" y="131" class="ts">yours</text><text x="1022" y="124" class="lr">listActions</text><text x="1022" y="140" class="lo">workflowListActions</text><rect x="516" y="156" width="704" height="16" rx="3" class="chip"/><rect x="516" y="178" width="704" height="16" rx="3" class="chip"/><rect x="516" y="200" width="704" height="16" rx="3" class="chip"/><text x="516" y="240" class="tb">Schedules</text><rect x="516" y="250" width="494" height="22" rx="3" class="chip"/><rect x="516" y="278" width="494" height="22" rx="3" class="chip"/><rect x="860" y="248" width="150" height="54" rx="6" class="wrap"/><text x="1022" y="270" class="lr">scheduleActions</text><text x="1022" y="286" class="lo">scheduleActions</text><rect x="500" y="326" width="736" height="374" rx="8" class="bx-n"/><text x="512" y="347" class="tb">Details page of a run</text><text x="516" y="372" class="tm">workflowId · Run ID</text><rect x="680" y="354" width="250" height="30" rx="6" class="wrap"/><rect x="688" y="358" width="120" height="22" rx="5" class="chip"/><text x="696" y="373" class="ts">Signal… Cancel…</text><rect x="814" y="358" width="108" height="22" rx="5" class="chip"/><text x="822" y="373" class="ts">yours</text><rect x="938" y="358" width="140" height="22" rx="5" class="chip"/><text x="946" y="373" class="ts">Query…  Refresh</text><text x="1090" y="366" class="lr">actions</text><text x="1090" y="382" class="lo">workflowActions</text><rect x="516" y="396" width="704" height="120" rx="4" class="chip"/><text x="868" y="462" class="ts mid">step graph</text><rect x="516" y="534" width="70" height="24" rx="5" class="chip"/><text x="524" y="550" class="ts">Steps</text><rect x="592" y="534" width="84" height="24" rx="5" class="chip"/><text x="600" y="550" class="ts">Timeline</text><rect x="682" y="534" width="74" height="24" rx="5" class="chip"/><text x="690" y="550" class="ts">Events</text><rect x="762" y="534" width="74" height="24" rx="5" class="chip"/><text x="770" y="550" class="ts">Details</text><rect x="844" y="530" width="180" height="32" rx="6" class="wrap"/><rect x="852" y="534" width="164" height="24" rx="5" class="chip"/><text x="860" y="550" class="ts">your tabs</text><text x="1034" y="544" class="lr">sections</text><text x="1034" y="560" class="lo">workflowSections</text><rect x="516" y="584" width="704" height="100" rx="8" class="bx-r"/><text x="528" y="605" class="tmb">TemporalWorkflowExtensionProps</text><text x="528" y="625" class="tm">{ workflow, entity?, reload(), workflowHref(ref) }  or  useTemporalWorkflow()</text><text x="528" y="642" class="ts">your components call the backend with</text><text x="528" y="659" class="tm">useApi(temporalApiRef) → api:temporal (TemporalClient) → /api/temporal</text><path d="M428,345 L478,345" class="ar" marker-end="url(#ar)"/><path d="M428,580 L478,580" class="ao" marker-end="url(#ao)"/></svg>
