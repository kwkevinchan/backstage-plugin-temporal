<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="The catalog holds a fixed number of entities: a component with Temporal annotations and TemporalWorkflow entities, one per Workflow Type. Temporal holds the workflow executions and their runs, and their number keeps growing. On each request the backend matches executions to entities; nothing is stored."><style>
:root{--bg:#f6f8fa;--surface:#ffffff;--ink:#1f2933;--muted:#52606d;--line:#9aa5b1;--acc:#0b6e7f;--acc-soft:#dcf1f4;--ours:#b0440d;--ours-soft:#fbe9dd;--fail:#b42318;--fail-soft:#fde8e6;--q:#e9edf1}
@media (prefers-color-scheme:dark){:root{--bg:#10151a;--surface:#1d2630;--ink:#e6ecf1;--muted:#a3b0bd;--line:#566574;--acc:#5cc6d4;--acc-soft:#12343b;--ours:#f2965d;--ours-soft:#3f2616;--fail:#f28b82;--fail-soft:#40201e;--q:#26313c}}
text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.bg{fill:var(--bg)}
.box{fill:var(--surface);stroke:var(--ink);stroke-width:1.5}
.acc{fill:var(--acc-soft);stroke:var(--acc);stroke-width:1.6}
.ours{fill:var(--ours-soft);stroke:var(--ours);stroke-width:1.5;stroke-dasharray:6 4}
.dash{stroke-dasharray:5 4}
.q{fill:var(--q);stroke:var(--line);stroke-width:1.2}
.bfail{fill:var(--fail-soft);stroke:var(--fail);stroke-width:1.5}
.bok{fill:var(--acc-soft);stroke:var(--acc);stroke-width:1.5}
.bwait{fill:none;stroke:var(--muted);stroke-width:1.3;stroke-dasharray:5 4}
.grid{stroke:var(--line);stroke-width:1}
.ln{stroke:var(--ink);stroke-width:1.7;fill:none}
.la{stroke:var(--acc);stroke-width:2;fill:none}
.lo{stroke:var(--ours);stroke-width:1.8;fill:none;stroke-dasharray:6 4}
.lm{stroke:var(--muted);stroke-width:1.7;fill:none;stroke-dasharray:4 4}
.mn{fill:var(--ink)}.ma{fill:var(--acc)}.mo{fill:var(--ours)}.mm{fill:var(--muted)}
.h{fill:var(--ink);font-size:15px;font-weight:700}
.t{fill:var(--ink);font-size:13.5px;font-weight:600}
.s{fill:var(--muted);font-size:12.5px}
.sa{fill:var(--acc);font-size:12.5px;font-weight:600}
.so{fill:var(--ours);font-size:12.5px;font-weight:600}
.sf{fill:var(--fail);font-size:12.5px;font-weight:600}
.c{text-anchor:middle}
.badge{fill:var(--acc);stroke:none}.bn{fill:var(--bg);font-size:12px;font-weight:700;text-anchor:middle}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mn"/></marker></defs><rect class="bg" width="800" height="400" rx="10"/><rect class="acc" x="20" y="20" width="306" height="360" rx="10"/><text class="h" x="36" y="48">Backstage catalog</text><text class="sa" x="36" y="68">fixed: one entity per workflow type</text><rect class="box" x="36" y="88" width="274" height="80" rx="8"/><text class="t" x="50" y="112">Component: shop-web</text><text class="s" x="50" y="134">annotations: task queue, types</text><text class="s" x="50" y="154">dependsOn: order-workflow</text><rect class="box" x="36" y="196" width="274" height="60" rx="8"/><text class="t" x="50" y="220">TemporalWorkflow: order-workflow</text><text class="s" x="50" y="242">owner: orders-team</text><rect class="box" x="36" y="284" width="274" height="60" rx="8"/><text class="t" x="50" y="308">TemporalWorkflow: refund-workflow</text><text class="s" x="50" y="330">owner: payments-team</text><path class="ln" d="M173 168V194" marker-end="url(#ah)"/><rect class="ours" x="346" y="150" width="160" height="100" rx="10"/><text class="t c" x="426" y="180">Temporal backend</text><text class="so c" x="426" y="204">matches on each request</text><text class="so c" x="426" y="226">stores nothing</text><path class="ln" d="M344 200H328" marker-end="url(#ah)"/><path class="ln" d="M508 200H522" marker-end="url(#ah)"/><text class="s c" x="426" y="276">1 visibility query</text><text class="s c" x="426" y="296">describe, up to 3 parents</text><rect class="box" x="524" y="20" width="256" height="360" rx="10"/><text class="h" x="540" y="48">Temporal</text><text class="s" x="540" y="68">grows: one execution per order</text><rect class="q" x="540" y="86" width="226" height="30" rx="6"/><text class="s" x="552" y="106">Workflow ID order-1001</text><text class="s" x="752" y="106" text-anchor="end">1 run</text><rect class="q" x="540" y="122" width="226" height="30" rx="6"/><text class="s" x="552" y="142">Workflow ID order-1002</text><text class="s" x="752" y="142" text-anchor="end">2 runs</text><rect class="q" x="540" y="158" width="226" height="30" rx="6"/><text class="s" x="552" y="178">Workflow ID order-1003</text><text class="s" x="752" y="178" text-anchor="end">1 run</text><rect class="q" x="540" y="194" width="226" height="30" rx="6"/><text class="s" x="552" y="214">Workflow ID order-1004</text><text class="s" x="752" y="214" text-anchor="end">1 run</text><rect class="q" x="540" y="230" width="226" height="30" rx="6"/><text class="s" x="552" y="250">Workflow ID order-1005</text><text class="s" x="752" y="250" text-anchor="end">3 runs</text><rect class="q" x="540" y="266" width="226" height="30" rx="6"/><text class="s" x="552" y="286">Workflow ID order-1006</text><text class="s" x="752" y="286" text-anchor="end">1 run</text><rect class="q" x="540" y="302" width="226" height="30" rx="6"/><text class="s" x="552" y="322">Workflow ID order-1007</text><text class="s" x="752" y="322" text-anchor="end">1 run</text><text class="s" x="552" y="356">… thousands more every day</text></svg>
