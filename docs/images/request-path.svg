<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1560" width="1280" height="1560" role="img" aria-label="Two requests, a read and an operation, go down the same layers: browser, routes, access checks, services, repositories, the shared connection and Temporal. Both pass the same access check; the operation also passes an operation permission and is audited."><style>
:root{--bg:#f6f8fa;--surface:#ffffff;--band:#e9edf1;--ink:#1f2933;--muted:#52606d;--line:#9aa5b1;--read:#0b6e7f;--read-soft:#dcf1f4;--act:#b0440d;--act-soft:#fbe9dd;--own:#6a3fb8;--own-soft:#ece6f9}
@media (prefers-color-scheme:dark){:root{--bg:#10151a;--surface:#1d2630;--band:#18202a;--ink:#e6ecf1;--muted:#a3b0bd;--line:#566574;--read:#5cc6d4;--read-soft:#12343b;--act:#f2965d;--act-soft:#3f2616;--own:#b9a0f6;--own-soft:#2b2146}}
text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.bg{fill:var(--bg)}.band{fill:var(--band)}.frame{fill:none;stroke:var(--ink);stroke-width:1.6}
.bx-n{fill:var(--surface);stroke:var(--ink);stroke-width:1.6}.bx-r{fill:var(--read-soft);stroke:var(--read);stroke-width:1.6}
.bx-a{fill:var(--act-soft);stroke:var(--act);stroke-width:1.6}.bx-o{fill:var(--own-soft);stroke:var(--own);stroke-width:1.6}
.chip{fill:var(--bg);stroke:var(--line);stroke-width:1.2}.wrap{fill:none;stroke:var(--act);stroke-width:1.6;stroke-dasharray:7 5}
.ar{stroke:var(--read);stroke-width:2.2;fill:none}.aa{stroke:var(--act);stroke-width:2.2;fill:none}.an{stroke:var(--ink);stroke-width:1.8;fill:none}.ao{stroke:var(--own);stroke-width:2.2;fill:none}
.ret{stroke-dasharray:7 5}.life{stroke:var(--line);stroke-width:1.4;stroke-dasharray:3 6}.loop{fill:none;stroke:var(--muted);stroke-width:1.3;stroke-dasharray:5 5}
.mf-r{fill:var(--read)}.mf-a{fill:var(--act)}.mf-n{fill:var(--ink)}.mf-o{fill:var(--own)}.dot-r{fill:var(--read)}.dot-a{fill:var(--act)}
.g1{fill:var(--ink);font-size:15.5px;font-weight:700}.g2{fill:var(--muted);font-size:12.5px}
.h-r{fill:var(--read);font-size:17px;font-weight:700}.h-a{fill:var(--act);font-size:17px;font-weight:700}
.tb{fill:var(--ink);font-size:14px;font-weight:700}.t{fill:var(--ink);font-size:13px;font-weight:500}
.tm{fill:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.tmb{fill:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;font-weight:600}
.ts{fill:var(--muted);font-size:12px}.lab{fill:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
.lr{fill:var(--read);font-size:12.5px;font-weight:600}.la{fill:var(--act);font-size:12.5px;font-weight:600}
.mid{text-anchor:middle}.end{text-anchor:end}.ml{fill:var(--ink);font-size:12.5px}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mf-r"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mf-a"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mf-n"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mf-o"/></marker></defs><rect class="bg" x="0" y="0" width="1280" height="1560"/><rect x="24" y="70" width="1232" height="130" rx="10" class="band"/><rect x="24" y="290" width="1232" height="110" rx="10" class="band"/><rect x="24" y="470" width="1232" height="290" rx="10" class="band"/><rect x="24" y="810" width="1232" height="230" rx="10" class="band"/><rect x="24" y="1090" width="1232" height="110" rx="10" class="band"/><rect x="24" y="1250" width="1232" height="100" rx="10" class="band"/><rect x="24" y="1420" width="1232" height="120" rx="10" class="band"/><rect x="12" y="262" width="1256" height="1100" rx="14" class="frame"/><text x="40" y="282" class="g2">Backstage backend, under /api/temporal</text><text x="40" y="106" class="g1">Browser</text><text x="40" y="126" class="g2">View (React)</text><text x="40" y="324" class="g1">Routes</text><text x="40" y="344" class="g2">Controller</text><text x="40" y="504" class="g1">Access</text><text x="40" y="524" class="g2">Authorization</text><text x="40" y="844" class="g1">Services</text><text x="40" y="864" class="g2">Use cases</text><text x="40" y="1124" class="g1">Repositories</text><text x="40" y="1144" class="g2">Gateways</text><text x="40" y="1284" class="g1">Shared connection</text><text x="40" y="1304" class="g2">Temporal client</text><text x="40" y="1454" class="g1">External systems</text><circle cx="222" cy="40" r="6" class="dot-r"/><text x="236" y="46" class="h-r">Read: open the details page of a run</text><circle cx="612" cy="40" r="6" class="dot-a"/><text x="626" y="46" class="h-a">Operate: press Cancel on that page</text><rect x="215" y="92" width="330" height="86" rx="8" class="bx-r"/><text x="231" y="118" class="tb">Run details page</text><text x="231" y="139" class="tm">plugins/temporal-frontend</text><text x="231" y="160" class="ts">TemporalClient sends the user's token</text><rect x="605" y="92" width="330" height="86" rx="8" class="bx-a"/><text x="621" y="118" class="tb">Cancel button and confirm dialog</text><text x="621" y="139" class="tm">plugins/temporal-frontend</text><text x="621" y="160" class="ts">Not shown with temporal.control.enabled: false</text><line x1="380" y1="178" x2="380" y2="312" class="ar" marker-end="url(#ar)"/><text x="392" y="240" class="lab">GET …/workflows/:workflowId</text><line x1="770" y1="178" x2="770" y2="312" class="aa" marker-end="url(#aa)"/><text x="782" y="240" class="lab">POST …/workflows/:workflowId/cancel</text><rect x="215" y="312" width="330" height="66" rx="8" class="bx-r"/><text x="231" y="340" class="tmb">routes/router.ts</text><text x="231" y="361" class="ts">Identifies the user, parses the URL</text><rect x="605" y="312" width="330" height="66" rx="8" class="bx-a"/><text x="621" y="340" class="tmb">routes/controlRoutes.ts</text><text x="621" y="361" class="ts">Identifies the user, parses the URL</text><line x1="380" y1="378" x2="380" y2="496" class="ar" marker-end="url(#ar)"/><text x="392" y="440" class="lab">access.loadWorkflow(ref, 'read')</text><line x1="770" y1="378" x2="770" y2="496" class="aa" marker-end="url(#aa)"/><text x="782" y="440" class="lab">the same call, through temporalAccessServiceRef</text><rect x="215" y="496" width="720" height="134" rx="8" class="bx-n"/><text x="231" y="521" class="tmb">TemporalAccessService.loadWorkflow()</text><text x="919" y="521" class="ts" style="text-anchor:end">one implementation, shared by reads and operations</text><rect x="229" y="536" width="156" height="60" rx="6" class="chip"/><text x="307" y="561" class="t mid">Namespace</text><text x="307" y="580" class="ts mid">is in the allowed list</text><line x1="388" y1="566" x2="406" y2="566" class="an" marker-end="url(#an)"/><rect x="409" y="536" width="156" height="60" rx="6" class="chip"/><text x="487" y="561" class="t mid">Read permission</text><text x="487" y="580" class="ts mid">on the entity</text><line x1="568" y1="566" x2="586" y2="566" class="an" marker-end="url(#an)"/><rect x="589" y="536" width="156" height="60" rx="6" class="chip"/><text x="667" y="561" class="t mid">Entity is in the Catalog</text><text x="667" y="580" class="ts mid">and visible to the user</text><line x1="748" y1="566" x2="766" y2="566" class="an" marker-end="url(#an)"/><rect x="769" y="536" width="156" height="60" rx="6" class="chip"/><text x="847" y="561" class="t mid">Workflow belongs</text><text x="847" y="580" class="ts mid">to the entity</text><text x="231" y="616" class="ts">Opened without an entity: the list permission for workflows decides instead of the read permission.</text><text x="1160" y="488" class="ts mid">Backstage core services</text><rect x="1070" y="498" width="180" height="54" rx="8" class="bx-n"/><text x="1160" y="521" class="tb mid">Catalog</text><text x="1160" y="540" class="ts mid">entities and annotations</text><line x1="935" y1="525" x2="1070" y2="525" class="an" marker-end="url(#an)"/><text x="1002" y="516" class="ts mid">read entity</text><rect x="1070" y="566" width="180" height="150" rx="8" class="bx-n"/><text x="1160" y="630" class="tb mid">Permission framework</text><text x="1160" y="650" class="ts mid">your policy decides</text><text x="1160" y="668" class="ts mid">ALLOW / DENY</text><line x1="935" y1="590" x2="1070" y2="590" class="an" marker-end="url(#an)"/><text x="1002" y="581" class="ts mid">read permission?</text><line x1="380" y1="630" x2="380" y2="836" class="ar" marker-end="url(#ar)"/><text x="370" y="720" class="lr" style="text-anchor:end">passed</text><text x="396" y="690" class="ts">A failed check stops here:</text><text x="396" y="709" class="ts">400, 403 or 404</text><line x1="770" y1="630" x2="770" y2="668" class="aa" marker-end="url(#aa)"/><text x="782" y="654" class="la">passed</text><rect x="605" y="668" width="330" height="84" rx="8" class="bx-a"/><text x="621" y="693" class="tb">Second check: the operation</text><text x="621" y="713" class="tm">temporal.workflow.cancel</text><text x="621" y="735" class="ts">then: the run must be running (else 409)</text><line x1="935" y1="700" x2="1070" y2="700" class="aa" marker-end="url(#aa)"/><text x="1002" y="691" class="la" style="text-anchor:middle">cancel permission?</text><line x1="770" y1="752" x2="770" y2="822" class="aa" marker-end="url(#aa)"/><text x="782" y="800" class="la">allowed</text><rect x="215" y="836" width="330" height="72" rx="8" class="bx-r"/><text x="231" y="866" class="tmb">WorkflowQueries.describe()</text><text x="231" y="888" class="ts">Temporal data to the plugin's API types</text><text x="215" y="932" class="ts">Other services</text><rect x="215" y="944" width="110" height="48" rx="6" class="chip"/><text x="270" y="964" class="tm mid" style="font-size:10.5px">EntityWorkflow</text><text x="270" y="980" class="tm mid" style="font-size:10.5px">Sources</text><rect x="335" y="944" width="110" height="48" rx="6" class="chip"/><text x="390" y="964" class="tm mid" style="font-size:10.5px">WorkflowList</text><text x="390" y="980" class="tm mid" style="font-size:10.5px">Queries</text><rect x="455" y="944" width="110" height="48" rx="6" class="chip"/><text x="510" y="964" class="tm mid" style="font-size:10.5px">AiWorkflow</text><text x="510" y="980" class="tm mid" style="font-size:10.5px">Queries</text><rect x="595" y="822" width="350" height="108" rx="10" class="wrap"/><text x="609" y="845" class="la">audited(): opens an audit event,</text><text x="609" y="862" class="la">records success or failure</text><rect x="615" y="872" width="310" height="52" rx="8" class="bx-a"/><text x="631" y="894" class="tmb">WorkflowCommands.cancel()</text><text x="631" y="913" class="ts">Temporal errors become 404, 409, 503</text><rect x="1070" y="840" width="180" height="56" rx="8" class="bx-n"/><text x="1160" y="864" class="tb mid">Auditor</text><text x="1160" y="883" class="ts mid">who, which workflow, result</text><line x1="945" y1="868" x2="1070" y2="868" class="aa" marker-end="url(#aa)"/><text x="1007" y="859" class="la" style="text-anchor:middle">record</text><line x1="330" y1="908" x2="330" y2="1112" class="ar" marker-end="url(#ar)"/><line x1="450" y1="908" x2="450" y2="1112" class="ar" marker-end="url(#ar)"/><rect x="215" y="1112" width="120" height="66" rx="8" class="bx-r"/><text x="275" y="1140" class="tmb mid">PayloadStore</text><text x="275" y="1161" class="ts mid">reads S3</text><rect x="355" y="1112" width="190" height="66" rx="8" class="bx-r"/><text x="450" y="1140" class="tm mid" style="font-weight:600;font-size:11.5px">TemporalReadRepository</text><text x="450" y="1161" class="ts mid">read calls to Temporal</text><line x1="770" y1="924" x2="770" y2="1270" class="aa" marker-end="url(#aa)"/><text x="782" y="1100" class="la">No repository layer for operations:</text><text x="782" y="1118" class="la">it calls Temporal through the connection</text><text x="782" y="1230" class="lab">requestCancelWorkflowExecution</text><line x1="450" y1="1178" x2="450" y2="1270" class="ar" marker-end="url(#ar)"/><text x="460" y="1230" class="lab">describeWorkflowExecution</text><rect x="355" y="1270" width="580" height="62" rx="8" class="bx-n"/><text x="371" y="1296" class="tmb">temporalServiceRef</text><text x="530" y="1296" class="tm">plugins/temporal-backend/src/node</text><text x="371" y="1317" class="ts">One gRPC connection, one client per namespace; settings from app-config</text><line x1="275" y1="1178" x2="275" y2="1442" class="ar" marker-end="url(#ar)"/><text x="285" y="1400" class="lab">GetObject</text><line x1="645" y1="1332" x2="645" y2="1442" class="an" marker-end="url(#an)"/><text x="657" y="1400" class="lab">gRPC (TLS and a bearer token are optional)</text><rect x="215" y="1442" width="120" height="80" rx="8" class="bx-n"/><text x="275" y="1468" class="tb mid">S3</text><text x="275" y="1487" class="ts mid">large payloads</text><text x="275" y="1505" class="ts mid">up to 50 MiB</text><rect x="355" y="1442" width="580" height="80" rx="8" class="bx-n"/><text x="371" y="1472" class="tb">Temporal Server</text><text x="371" y="1495" class="ts">Holds the state and history of every workflow. The plugin has no database; it asks every time.</text></svg>
