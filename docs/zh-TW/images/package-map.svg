<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 610" width="1280" height="610" role="img" aria-label="套件分三層：Backstage app 的前端套件、Backstage 後端的後端套件，以及兩個函式庫：前後端都匯入的 temporal-common，和只有後端用的 temporal-node。workflow kit 屬於 Worker 端，不在 Backstage 內。"><style>
:root{--bg:#f6f8fa;--surface:#ffffff;--band:#e9edf1;--ink:#1f2933;--muted:#52606d;--line:#9aa5b1;--read:#0b6e7f;--read-soft:#dcf1f4;--act:#b0440d;--act-soft:#fbe9dd;--own:#6a3fb8;--own-soft:#ece6f9}
@media (prefers-color-scheme:dark){:root{--bg:#10151a;--surface:#1d2630;--band:#18202a;--ink:#e6ecf1;--muted:#a3b0bd;--line:#566574;--read:#5cc6d4;--read-soft:#12343b;--act:#f2965d;--act-soft:#3f2616;--own:#b9a0f6;--own-soft:#2b2146}}
text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.bg{fill:var(--bg)}.band{fill:var(--band)}.frame{fill:none;stroke:var(--ink);stroke-width:1.6}
.bx-n{fill:var(--surface);stroke:var(--ink);stroke-width:1.6}.bx-r{fill:var(--read-soft);stroke:var(--read);stroke-width:1.6}
.bx-a{fill:var(--act-soft);stroke:var(--act);stroke-width:1.6}.bx-o{fill:var(--own-soft);stroke:var(--own);stroke-width:1.6}
.chip{fill:var(--bg);stroke:var(--line);stroke-width:1.2}.wrap{fill:none;stroke:var(--act);stroke-width:1.6;stroke-dasharray:7 5}
.ar{stroke:var(--read);stroke-width:2.2;fill:none}.aa{stroke:var(--act);stroke-width:2.2;fill:none}.an{stroke:var(--ink);stroke-width:1.8;fill:none}.ao{stroke:var(--own);stroke-width:2.2;fill:none}
.ret{stroke-dasharray:7 5}.life{stroke:var(--line);stroke-width:1.4;stroke-dasharray:3 6}.loop{fill:none;stroke:var(--muted);stroke-width:1.3;stroke-dasharray:5 5}
.mf-r{fill:var(--read)}.mf-a{fill:var(--act)}.mf-n{fill:var(--ink)}.mf-o{fill:var(--own)}.dot-r{fill:var(--read)}.dot-a{fill:var(--act)}
.g1{fill:var(--ink);font-size:15.5px;font-weight:700}.g2{fill:var(--muted);font-size:12.5px}
.h-r{fill:var(--read);font-size:17px;font-weight:700}.h-a{fill:var(--act);font-size:17px;font-weight:700}
.tb{fill:var(--ink);font-size:14px;font-weight:700}.t{fill:var(--ink);font-size:13px;font-weight:500}
.tm{fill:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.tmb{fill:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;font-weight:600}
.ts{fill:var(--muted);font-size:12px}.lab{fill:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
.lr{fill:var(--read);font-size:12.5px;font-weight:600}.la{fill:var(--act);font-size:12.5px;font-weight:600}
.mid{text-anchor:middle}.end{text-anchor:end}.ml{fill:var(--ink);font-size:12.5px}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mf-r"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mf-a"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mf-n"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mf-o"/></marker></defs><rect class="bg" x="0" y="0" width="1280" height="610"/><rect x="24" y="20" width="1032" height="150" rx="10" class="band"/><rect x="24" y="190" width="1032" height="230" rx="10" class="band"/><rect x="24" y="440" width="1032" height="150" rx="10" class="band"/><text x="40" y="48" class="g1">Backstage app</text><text x="40" y="68" class="g2">前端套件</text><text x="40" y="218" class="g1">Backstage 後端</text><text x="40" y="238" class="g2">後端套件</text><text x="40" y="468" class="g1">共用函式庫</text><text x="40" y="488" class="g2">common：前後端都用</text><text x="40" y="506" class="g2">node：只有後端用</text><rect x="190" y="40" width="205" height="110" rx="8" class="bx-r"/><text x="202" y="60" class="tmb" style="font-size:11.5px">temporal</text><text x="202" y="80" class="ts">實體分頁、Workflows 頁、</text><text x="202" y="96" class="ts">詳細頁；/alpha 有 blueprint</text><rect x="403" y="40" width="205" height="110" rx="8" class="bx-a"/><text x="415" y="60" class="tmb" style="font-size:11.5px">temporal-module-</text><text x="415" y="76" class="tmb" style="font-size:11.5px">control</text><text x="415" y="96" class="ts">各種操作的</text><text x="415" y="112" class="ts">按鈕與對話框</text><rect x="616" y="40" width="205" height="110" rx="8" class="bx-o"/><text x="628" y="60" class="tmb" style="font-size:11.5px">temporal-module-</text><text x="628" y="76" class="tmb" style="font-size:11.5px">zigflow</text><text x="628" y="96" class="ts">YAML 流程的</text><text x="628" y="112" class="ts">Definition 分頁（選用）</text><rect x="829" y="40" width="205" height="110" rx="8" class="bx-o"/><text x="841" y="60" class="tmb" style="font-size:11.5px">scaffolder-module-</text><text x="841" y="76" class="tmb" style="font-size:11.5px">temporal</text><text x="841" y="96" class="ts">TemporalWorkflowPicker</text><text x="841" y="112" class="ts">表單欄位（選用）</text><rect x="190" y="212" width="205" height="130" rx="8" class="bx-r"/><text x="202" y="232" class="tmb" style="font-size:11.5px">temporal-backend</text><text x="202" y="252" class="ts">REST API /api/temporal：</text><text x="202" y="268" class="ts">讀取流程、Query、</text><text x="202" y="284" class="ts">權限檢查（唯讀）</text><rect x="403" y="212" width="205" height="130" rx="8" class="bx-a"/><text x="415" y="232" class="tmb" style="font-size:11.5px">temporal-backend-</text><text x="415" y="248" class="tmb" style="font-size:11.5px">module-control</text><text x="415" y="268" class="ts">Start、Signal、Update、Cancel、</text><text x="415" y="284" class="ts">Terminate、Rerun、Schedules、</text><text x="415" y="300" class="ts">自訂操作</text><rect x="616" y="212" width="205" height="130" rx="8" class="bx-o"/><text x="628" y="232" class="tmb" style="font-size:11.5px">temporal-backend-</text><text x="628" y="248" class="tmb" style="font-size:11.5px">module-zigflow</text><text x="628" y="268" class="ts">讀取 YAML 定義檔</text><text x="628" y="284" class="ts">（選用）</text><rect x="829" y="212" width="205" height="60" rx="8" class="bx-o"/><text x="841" y="232" class="tmb" style="font-size:11.5px">catalog-backend-</text><text x="841" y="248" class="tmb" style="font-size:11.5px">module-temporal</text><text x="841" y="268" class="ts">TemporalWorkflow kind</text><rect x="829" y="282" width="205" height="60" rx="8" class="bx-o"/><text x="841" y="302" class="tmb" style="font-size:11.5px">scaffolder-backend-</text><text x="841" y="318" class="tmb" style="font-size:11.5px">module-temporal</text><text x="841" y="338" class="ts">Scaffolder actions</text><text x="190" y="372" class="ts">沒有任何後端模組匯入 temporal-backend。control 模組用 temporal-node；</text><text x="190" y="390" class="ts">scaffolder 模組則以使用者身分呼叫外掛的 HTTP 路由。</text><rect x="190" y="462" width="420" height="110" rx="8" class="bx-n"/><text x="202" y="482" class="tmb" style="font-size:11.5px">temporal-common</text><text x="202" y="502" class="ts">型別、權限、API 路徑、annotation 常數、</text><text x="202" y="518" class="ts">以及 TemporalWorkflow kind 的 schema</text><rect x="622" y="462" width="412" height="110" rx="8" class="bx-n"/><text x="634" y="482" class="tmb" style="font-size:11.5px">temporal-node</text><text x="634" y="502" class="ts">temporalServiceRef（共用 client）、temporalExtensionPoint；</text><text x="634" y="518" class="ts">/alpha 另有 temporalAccessServiceRef、</text><text x="634" y="534" class="ts">temporalControlExtensionPoint</text><rect x="1080" y="20" width="180" height="570" rx="10" class="band"/><text x="1096" y="48" class="g1">你的 Worker</text><text x="1096" y="68" class="g2">與 Temporal</text><rect x="1094" y="100" width="152" height="160" rx="8" class="bx-n"/><text x="1106" y="120" class="tmb" style="font-size:11.5px">temporal-workflow-kit</text><text x="1106" y="140" class="ts">實驗性，private，</text><text x="1106" y="156" class="ts">不發佈。寫入迴圈與</text><text x="1106" y="172" class="ts">LLM 標記，供 AI 流程</text><text x="1106" y="188" class="ts">使用（預設關閉）</text><rect x="1094" y="330" width="152" height="90" rx="8" class="bx-n"/><text x="1106" y="350" class="tmb" style="font-size:11.5px">Temporal Server</text><text x="1106" y="370" class="ts">由 temporal-node</text><text x="1106" y="386" class="ts">的連線讀取</text><rect x="1094" y="450" width="152" height="90" rx="8" class="bx-n"/><text x="1106" y="470" class="tmb" style="font-size:11.5px">S3</text><text x="1106" y="490" class="ts">External Storage，</text><text x="1106" y="506" class="ts">由 temporal-backend 讀取</text></svg>
