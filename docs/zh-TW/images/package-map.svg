<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" role="img" aria-label="套件分成兩邊：Backstage app 裡是 temporal-frontend 和它的兩個模組；Backstage 後端裡是 temporal-backend 和它的兩個模組。每個模組只依賴它那一邊的核心。前端透過 HTTP 呼叫後端，並帶著一份產生出來的共用定義副本。workflow kit 屬於 Worker 端，不在 Backstage 內。"><style>
:root{--bg:#f6f8fa;--surface:#ffffff;--band:#e9edf1;--ink:#1f2933;--muted:#52606d;--line:#9aa5b1;--read:#0b6e7f;--read-soft:#dcf1f4;--act:#b0440d;--act-soft:#fbe9dd;--own:#6a3fb8;--own-soft:#ece6f9}
@media (prefers-color-scheme:dark){:root{--bg:#10151a;--surface:#1d2630;--band:#18202a;--ink:#e6ecf1;--muted:#a3b0bd;--line:#566574;--read:#5cc6d4;--read-soft:#12343b;--act:#f2965d;--act-soft:#3f2616;--own:#b9a0f6;--own-soft:#2b2146}}
text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.bg{fill:var(--bg)}.band{fill:var(--band)}.frame{fill:none;stroke:var(--ink);stroke-width:1.6}
.bx-n{fill:var(--surface);stroke:var(--ink);stroke-width:1.6}.bx-r{fill:var(--read-soft);stroke:var(--read);stroke-width:1.6}
.bx-a{fill:var(--act-soft);stroke:var(--act);stroke-width:1.6}.bx-o{fill:var(--own-soft);stroke:var(--own);stroke-width:1.6}
.chip{fill:var(--bg);stroke:var(--line);stroke-width:1.2}.wrap{fill:none;stroke:var(--act);stroke-width:1.6;stroke-dasharray:7 5}
.ar{stroke:var(--read);stroke-width:2.2;fill:none}.aa{stroke:var(--act);stroke-width:2.2;fill:none}.an{stroke:var(--ink);stroke-width:1.8;fill:none}.ao{stroke:var(--own);stroke-width:2.2;fill:none}
.ret{stroke-dasharray:7 5}.life{stroke:var(--line);stroke-width:1.4;stroke-dasharray:3 6}.loop{fill:none;stroke:var(--muted);stroke-width:1.3;stroke-dasharray:5 5}
.mf-r{fill:var(--read)}.mf-a{fill:var(--act)}.mf-n{fill:var(--ink)}.mf-o{fill:var(--own)}.dot-r{fill:var(--read)}.dot-a{fill:var(--act)}
.g1{fill:var(--ink);font-size:15.5px;font-weight:700}.g2{fill:var(--muted);font-size:12.5px}
.h-r{fill:var(--read);font-size:17px;font-weight:700}.h-a{fill:var(--act);font-size:17px;font-weight:700}
.tb{fill:var(--ink);font-size:14px;font-weight:700}.t{fill:var(--ink);font-size:13px;font-weight:500}
.tm{fill:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.tmb{fill:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;font-weight:600}
.ts{fill:var(--muted);font-size:12px}.lab{fill:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
.lr{fill:var(--read);font-size:12.5px;font-weight:600}.la{fill:var(--act);font-size:12.5px;font-weight:600}
.mid{text-anchor:middle}.end{text-anchor:end}.ml{fill:var(--ink);font-size:12.5px}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mf-r"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mf-a"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mf-n"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mf-o"/></marker></defs><rect class="bg" x="0" y="0" width="1280" height="560"/><rect x="24" y="20" width="1032" height="190" rx="10" class="band"/><rect x="24" y="250" width="1032" height="230" rx="10" class="band"/><rect x="1076" y="20" width="180" height="460" rx="10" class="band"/><text x="40" y="48" class="g1">Backstage app</text><text x="40" y="68" class="g2">前端套件</text><text x="40" y="278" class="g1">Backstage 後端</text><text x="40" y="298" class="g2">後端套件</text><text x="1090" y="48" class="g1">你的 Worker</text><text x="1090" y="68" class="g2">和 Temporal</text><rect x="190" y="36" width="330" height="160" rx="8" class="bx-r"/><text x="202" y="56" class="tmb" style="font-size:11.5px">temporal-frontend</text><text x="202" y="76" class="ts">實體分頁、Workflows 頁、詳細頁、</text><text x="202" y="92" class="ts">各操作的按鈕；</text><text x="202" y="108" class="ts">/alpha：外掛和 blueprint</text><text x="202" y="124" class="ts">/common：共用定義的副本</text><text x="202" y="140" class="ts">/ui：給配套套件用</text><rect x="600" y="36" width="200" height="110" rx="8" class="bx-o"/><text x="612" y="56" class="tmb" style="font-size:11.5px">temporal-module-</text><text x="612" y="72" class="tmb" style="font-size:11.5px">zigflow</text><text x="612" y="92" class="ts">YAML 流程的</text><text x="612" y="108" class="ts">Definition 分頁（選用）</text><rect x="836" y="36" width="200" height="110" rx="8" class="bx-o"/><text x="848" y="56" class="tmb" style="font-size:11.5px">scaffolder-module-</text><text x="848" y="72" class="tmb" style="font-size:11.5px">temporal</text><text x="848" y="92" class="ts">TemporalWorkflowPicker</text><text x="848" y="108" class="ts">表單欄位（選用）</text><rect x="190" y="266" width="330" height="200" rx="8" class="bx-r"/><text x="202" y="286" class="tmb" style="font-size:11.5px">temporal-backend</text><text x="202" y="306" class="ts">REST API /api/temporal：讀取、</text><text x="202" y="322" class="ts">Query、操作、存取檢查；</text><text x="202" y="338" class="ts">TemporalWorkflow kind；給模組用：</text><text x="202" y="354" class="ts">/node：temporalServiceRef、enricher</text><text x="202" y="370" class="ts">/alpha：授權服務、自訂操作</text><text x="202" y="386" class="ts">/common：共用定義（正本）</text><rect x="600" y="266" width="200" height="110" rx="8" class="bx-o"/><text x="612" y="286" class="tmb" style="font-size:11.5px">temporal-backend-</text><text x="612" y="302" class="tmb" style="font-size:11.5px">module-zigflow</text><text x="612" y="322" class="ts">讀取 YAML 定義檔</text><text x="612" y="338" class="ts">（選用）</text><rect x="836" y="266" width="200" height="110" rx="8" class="bx-o"/><text x="848" y="286" class="tmb" style="font-size:11.5px">scaffolder-backend-</text><text x="848" y="302" class="tmb" style="font-size:11.5px">module-temporal</text><text x="848" y="322" class="ts">Scaffolder action，呼叫</text><text x="848" y="338" class="ts">外掛的路由（選用）</text><path d="M600,100 L524,100" class="ao" marker-end="url(#ao)"/><text x="560" y="92" class="lab mid">依賴</text><path d="M936,36 L936,28 L420,28 L420,32" class="ao" marker-end="url(#ao)"/><path d="M600,330 L524,330" class="ao" marker-end="url(#ao)"/><text x="560" y="322" class="lab mid">依賴</text><path d="M936,266 L936,258 L420,258 L420,262" class="ao" marker-end="url(#ao)"/><path d="M300,196 L300,262" class="ar" marker-end="url(#ar)"/><text x="310" y="234" class="lr">HTTP /api/temporal</text><path d="M936,376 L936,420 L524,420" class="ar" marker-end="url(#ar)"/><text x="560" y="412" class="lr">HTTP，以使用者身分</text><rect x="1088" y="88" width="156" height="150" rx="8" class="bx-n"/><text x="1100" y="108" class="tmb" style="font-size:11px">temporal-</text><text x="1100" y="124" class="tmb" style="font-size:11px">workflow-kit</text><text x="1100" y="144" class="ts">實驗性、private、</text><text x="1100" y="160" class="ts">不發佈。AI 流程的</text><text x="1100" y="176" class="ts">迴圈和 LLM 標記</text><text x="1100" y="192" class="ts">（預設關閉）</text><rect x="1088" y="300" width="156" height="100" rx="8" class="bx-n"/><text x="1100" y="320" class="tmb" style="font-size:11.5px">Temporal Server</text><text x="1100" y="340" class="ts">gRPC，經由</text><text x="1100" y="356" class="ts">temporalServiceRef</text><path d="M520,456 L1166,456 L1166,404" class="ar" marker-end="url(#ar)"/><text x="1100" y="448" class="lr end">gRPC</text><text x="40" y="510" class="ml">前端套件絕不依賴後端套件。temporal-frontend/src/common 由 temporal-backend/src/common</text><text x="40" y="528" class="ml">產生（yarn sync:common）。模組只依賴它那一邊的核心。</text><text x="40" y="548" class="la">temporal.control.enabled 同時關掉兩邊的操作</text></svg>
