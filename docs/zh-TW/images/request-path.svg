<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1560" width="1280" height="1560" role="img" aria-label="看和做兩種請求由上往下經過同樣的層：瀏覽器、Routes、Access 授權、Services、Repositories、共用連線，最後到 Temporal。兩者共用同一個授權檢查；操作多一道操作權限和稽核紀錄。"><style>
:root{--bg:#f6f8fa;--surface:#ffffff;--band:#e9edf1;--ink:#1f2933;--muted:#52606d;--line:#9aa5b1;--read:#0b6e7f;--read-soft:#dcf1f4;--act:#b0440d;--act-soft:#fbe9dd;--own:#6a3fb8;--own-soft:#ece6f9}
@media (prefers-color-scheme:dark){:root{--bg:#10151a;--surface:#1d2630;--band:#18202a;--ink:#e6ecf1;--muted:#a3b0bd;--line:#566574;--read:#5cc6d4;--read-soft:#12343b;--act:#f2965d;--act-soft:#3f2616;--own:#b9a0f6;--own-soft:#2b2146}}
text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.bg{fill:var(--bg)}.band{fill:var(--band)}.frame{fill:none;stroke:var(--ink);stroke-width:1.6}
.bx-n{fill:var(--surface);stroke:var(--ink);stroke-width:1.6}.bx-r{fill:var(--read-soft);stroke:var(--read);stroke-width:1.6}
.bx-a{fill:var(--act-soft);stroke:var(--act);stroke-width:1.6}.bx-o{fill:var(--own-soft);stroke:var(--own);stroke-width:1.6}
.chip{fill:var(--bg);stroke:var(--line);stroke-width:1.2}.wrap{fill:none;stroke:var(--act);stroke-width:1.6;stroke-dasharray:7 5}
.ar{stroke:var(--read);stroke-width:2.2;fill:none}.aa{stroke:var(--act);stroke-width:2.2;fill:none}.an{stroke:var(--ink);stroke-width:1.8;fill:none}.ao{stroke:var(--own);stroke-width:2.2;fill:none}
.ret{stroke-dasharray:7 5}.life{stroke:var(--line);stroke-width:1.4;stroke-dasharray:3 6}.loop{fill:none;stroke:var(--muted);stroke-width:1.3;stroke-dasharray:5 5}
.mf-r{fill:var(--read)}.mf-a{fill:var(--act)}.mf-n{fill:var(--ink)}.mf-o{fill:var(--own)}.dot-r{fill:var(--read)}.dot-a{fill:var(--act)}
.g1{fill:var(--ink);font-size:15.5px;font-weight:700}.g2{fill:var(--muted);font-size:12.5px}
.h-r{fill:var(--read);font-size:17px;font-weight:700}.h-a{fill:var(--act);font-size:17px;font-weight:700}
.tb{fill:var(--ink);font-size:14px;font-weight:700}.t{fill:var(--ink);font-size:13px;font-weight:500}
.tm{fill:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.tmb{fill:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;font-weight:600}
.ts{fill:var(--muted);font-size:12px}.lab{fill:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
.lr{fill:var(--read);font-size:12.5px;font-weight:600}.la{fill:var(--act);font-size:12.5px;font-weight:600}
.mid{text-anchor:middle}.end{text-anchor:end}.ml{fill:var(--ink);font-size:12.5px}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mf-r"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mf-a"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mf-n"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mf-o"/></marker></defs><rect class="bg" x="0" y="0" width="1280" height="1560"/><rect x="24" y="70" width="1232" height="130" rx="10" class="band"/><rect x="24" y="290" width="1232" height="110" rx="10" class="band"/><rect x="24" y="470" width="1232" height="290" rx="10" class="band"/><rect x="24" y="810" width="1232" height="230" rx="10" class="band"/><rect x="24" y="1090" width="1232" height="110" rx="10" class="band"/><rect x="24" y="1250" width="1232" height="100" rx="10" class="band"/><rect x="24" y="1420" width="1232" height="120" rx="10" class="band"/><rect x="12" y="262" width="1256" height="1100" rx="14" class="frame"/><text x="40" y="282" class="g2">Backstage 後端，網址在 /api/temporal 底下</text><text x="40" y="106" class="g1">瀏覽器</text><text x="40" y="126" class="g2">View（React）</text><text x="40" y="324" class="g1">Routes</text><text x="40" y="344" class="g2">Controller</text><text x="40" y="504" class="g1">Access</text><text x="40" y="524" class="g2">授權</text><text x="40" y="844" class="g1">Services</text><text x="40" y="864" class="g2">Use case</text><text x="40" y="1124" class="g1">Repositories</text><text x="40" y="1144" class="g2">Gateway</text><text x="40" y="1284" class="g1">共用連線</text><text x="40" y="1304" class="g2">Temporal client</text><text x="40" y="1454" class="g1">外部系統</text><circle cx="222" cy="40" r="6" class="dot-r"/><text x="236" y="46" class="h-r">看：打開一次執行的詳細頁</text><circle cx="612" cy="40" r="6" class="dot-a"/><text x="626" y="46" class="h-a">做：在那一頁按 Cancel</text><rect x="215" y="92" width="330" height="86" rx="8" class="bx-r"/><text x="231" y="118" class="tb">一次執行的詳細頁</text><text x="231" y="139" class="tm">plugins/temporal</text><text x="231" y="160" class="ts">TemporalClient 帶著登入者的 token</text><rect x="605" y="92" width="330" height="86" rx="8" class="bx-a"/><text x="621" y="118" class="tb">Cancel 按鈕與確認對話框</text><text x="621" y="139" class="tm">plugins/temporal-module-control</text><text x="621" y="160" class="ts">沒裝這個模組就沒有按鈕</text><line x1="380" y1="178" x2="380" y2="312" class="ar" marker-end="url(#ar)"/><text x="392" y="240" class="lab">GET …/workflows/:workflowId</text><line x1="770" y1="178" x2="770" y2="312" class="aa" marker-end="url(#aa)"/><text x="782" y="240" class="lab">POST …/workflows/:workflowId/cancel</text><rect x="215" y="312" width="330" height="66" rx="8" class="bx-r"/><text x="231" y="340" class="tmb">routes/router.ts</text><text x="231" y="361" class="ts">認出登入的人、解析網址參數</text><rect x="605" y="312" width="330" height="66" rx="8" class="bx-a"/><text x="621" y="340" class="tmb">routes/controlRoutes.ts</text><text x="621" y="361" class="ts">認出登入的人、解析網址參數</text><line x1="380" y1="378" x2="380" y2="496" class="ar" marker-end="url(#ar)"/><text x="392" y="440" class="lab">access.loadWorkflow(ref, 'read')</text><line x1="770" y1="378" x2="770" y2="496" class="aa" marker-end="url(#aa)"/><text x="782" y="440" class="lab">同一個呼叫，經 temporalAccessServiceRef</text><rect x="215" y="496" width="720" height="134" rx="8" class="bx-n"/><text x="231" y="521" class="tmb">TemporalAccessService.loadWorkflow()</text><text x="919" y="521" class="ts" style="text-anchor:end">看和做共用，只有一份實作</text><rect x="229" y="536" width="156" height="60" rx="6" class="chip"/><text x="307" y="561" class="t mid">namespace</text><text x="307" y="580" class="ts mid">在允許清單裡</text><line x1="388" y1="566" x2="406" y2="566" class="an" marker-end="url(#an)"/><rect x="409" y="536" width="156" height="60" rx="6" class="chip"/><text x="487" y="561" class="t mid">有 read 權限</text><text x="487" y="580" class="ts mid">對這個實體</text><line x1="568" y1="566" x2="586" y2="566" class="an" marker-end="url(#an)"/><rect x="589" y="536" width="156" height="60" rx="6" class="chip"/><text x="667" y="561" class="t mid">實體在 Catalog</text><text x="667" y="580" class="ts mid">而且使用者看得到</text><line x1="748" y1="566" x2="766" y2="566" class="an" marker-end="url(#an)"/><rect x="769" y="536" width="156" height="60" rx="6" class="chip"/><text x="847" y="561" class="t mid">流程屬於這個實體</text><text x="847" y="580" class="ts mid">（類型、佇列或搜尋屬性）</text><text x="231" y="616" class="ts">沒有指定實體就打開的流程：改由 list 權限決定，不看實體的 read 權限。</text><text x="1160" y="488" class="ts mid">Backstage 內建服務</text><rect x="1070" y="498" width="180" height="54" rx="8" class="bx-n"/><text x="1160" y="521" class="tb mid">Catalog</text><text x="1160" y="540" class="ts mid">實體和 annotation</text><line x1="935" y1="525" x2="1070" y2="525" class="an" marker-end="url(#an)"/><text x="1002" y="516" class="ts mid">讀實體</text><rect x="1070" y="566" width="180" height="150" rx="8" class="bx-n"/><text x="1160" y="630" class="tb mid">權限框架</text><text x="1160" y="650" class="ts mid">你寫的 policy 決定</text><text x="1160" y="668" class="ts mid">ALLOW / DENY</text><line x1="935" y1="590" x2="1070" y2="590" class="an" marker-end="url(#an)"/><text x="1002" y="581" class="ts mid">read 權限？</text><line x1="380" y1="630" x2="380" y2="836" class="ar" marker-end="url(#ar)"/><text x="370" y="720" class="lr" style="text-anchor:end">通過</text><text x="396" y="690" class="ts">任何一關沒過就到此為止：</text><text x="396" y="709" class="ts">回 400／403／404</text><line x1="770" y1="630" x2="770" y2="668" class="aa" marker-end="url(#aa)"/><text x="782" y="654" class="la">通過</text><rect x="605" y="668" width="330" height="84" rx="8" class="bx-a"/><text x="621" y="693" class="tb">第二道：這個操作的權限</text><text x="621" y="713" class="tm">temporal.workflow.cancel</text><text x="621" y="735" class="ts">再確認流程還在執行（否則 409）</text><line x1="935" y1="700" x2="1070" y2="700" class="aa" marker-end="url(#aa)"/><text x="1002" y="691" class="la" style="text-anchor:middle">cancel 權限？</text><line x1="770" y1="752" x2="770" y2="822" class="aa" marker-end="url(#aa)"/><text x="782" y="800" class="la">允許</text><rect x="215" y="836" width="330" height="72" rx="8" class="bx-r"/><text x="231" y="866" class="tmb">WorkflowQueries.describe()</text><text x="231" y="888" class="ts">Temporal 的資料 → 外掛的 API 型別</text><text x="215" y="932" class="ts">其他 service</text><rect x="215" y="944" width="110" height="48" rx="6" class="chip"/><text x="270" y="964" class="tm mid" style="font-size:10.5px">EntityWorkflow</text><text x="270" y="980" class="tm mid" style="font-size:10.5px">Sources</text><rect x="335" y="944" width="110" height="48" rx="6" class="chip"/><text x="390" y="964" class="tm mid" style="font-size:10.5px">WorkflowList</text><text x="390" y="980" class="tm mid" style="font-size:10.5px">Queries</text><rect x="455" y="944" width="110" height="48" rx="6" class="chip"/><text x="510" y="964" class="tm mid" style="font-size:10.5px">AiWorkflow</text><text x="510" y="980" class="tm mid" style="font-size:10.5px">Queries</text><rect x="595" y="822" width="350" height="108" rx="10" class="wrap"/><text x="609" y="845" class="la">audited() 開稽核事件，</text><text x="609" y="862" class="la">做完記成功或失敗</text><rect x="615" y="872" width="310" height="52" rx="8" class="bx-a"/><text x="631" y="894" class="tmb">WorkflowCommands.cancel()</text><text x="631" y="913" class="ts">Temporal 的錯誤轉成 404、409、503</text><rect x="1070" y="840" width="180" height="56" rx="8" class="bx-n"/><text x="1160" y="864" class="tb mid">Auditor</text><text x="1160" y="883" class="ts mid">誰、哪個流程、結果</text><line x1="945" y1="868" x2="1070" y2="868" class="aa" marker-end="url(#aa)"/><text x="1007" y="859" class="la" style="text-anchor:middle">寫紀錄</text><line x1="330" y1="908" x2="330" y2="1112" class="ar" marker-end="url(#ar)"/><line x1="450" y1="908" x2="450" y2="1112" class="ar" marker-end="url(#ar)"/><rect x="215" y="1112" width="120" height="66" rx="8" class="bx-r"/><text x="275" y="1140" class="tmb mid">PayloadStore</text><text x="275" y="1161" class="ts mid">讀 S3</text><rect x="355" y="1112" width="190" height="66" rx="8" class="bx-r"/><text x="450" y="1140" class="tm mid" style="font-weight:600;font-size:11.5px">TemporalReadRepository</text><text x="450" y="1161" class="ts mid">Temporal 的讀取呼叫</text><line x1="770" y1="924" x2="770" y2="1270" class="aa" marker-end="url(#aa)"/><text x="782" y="1100" class="la">這個模組沒有 repository 層，</text><text x="782" y="1118" class="la">直接用共用連線呼叫 Temporal</text><text x="782" y="1230" class="lab">requestCancelWorkflowExecution</text><line x1="450" y1="1178" x2="450" y2="1270" class="ar" marker-end="url(#ar)"/><text x="460" y="1230" class="lab">describeWorkflowExecution</text><rect x="355" y="1270" width="580" height="62" rx="8" class="bx-n"/><text x="371" y="1296" class="tmb">temporalServiceRef</text><text x="530" y="1296" class="tm">plugins/temporal-node</text><text x="371" y="1317" class="ts">一條 gRPC 連線，每個 namespace 一個 client；設定來自 app-config</text><line x1="275" y1="1178" x2="275" y2="1442" class="ar" marker-end="url(#ar)"/><text x="285" y="1400" class="lab">GetObject</text><line x1="645" y1="1332" x2="645" y2="1442" class="an" marker-end="url(#an)"/><text x="657" y="1400" class="lab">gRPC（可開 TLS、bearer token）</text><rect x="215" y="1442" width="120" height="80" rx="8" class="bx-n"/><text x="275" y="1468" class="tb mid">S3</text><text x="275" y="1487" class="ts mid">大 payload</text><text x="275" y="1505" class="ts mid">最多讀 50 MiB</text><rect x="355" y="1442" width="580" height="80" rx="8" class="bx-n"/><text x="371" y="1472" class="tb">Temporal Server</text><text x="371" y="1495" class="ts">流程的狀態和歷史都在這裡。外掛沒有自己的資料庫，每次都現問。</text></svg>
