<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="temporal-backend 內部，請求往下經過四層：routes（router.ts 是讀取和 Query；controlRoutes.ts 是操作，只在 temporal.control.enabled 為 true 時掛上）、access（TemporalAccessService，ref 是 temporalAccessServiceRef，搭配權限框架和 catalog）、services（WorkflowQueries 等查詢類別、WorkflowCommands），再經 TemporalService（temporalServiceRef，root scope）到 Temporal。左邊是外掛的模組：temporalControlExtensionPoint 把自訂操作接到操作路由，temporalWorkflowEnricherExtensionPoint 把 enricher 接到查詢，你自己的路由使用 temporalAccessServiceRef，Zigflow 模組在 /api/temporal 下加一條路由並自己檢查讀取權限。右邊是其他後端程式：Scaffolder 模組以使用者身分呼叫 HTTP API，你的其他外掛依賴 temporalServiceRef，你為 temporalAccessServiceRef 或 temporalServiceRef 提供的 factory 會取代預設的。"><style>
:root{--bg:#f6f8fa;--surface:#ffffff;--band:#e9edf1;--ink:#1f2933;--muted:#52606d;--line:#9aa5b1;--read:#0b6e7f;--read-soft:#dcf1f4;--act:#b0440d;--act-soft:#fbe9dd;--own:#6a3fb8;--own-soft:#ece6f9}
@media (prefers-color-scheme:dark){:root{--bg:#10151a;--surface:#1d2630;--band:#18202a;--ink:#e6ecf1;--muted:#a3b0bd;--line:#566574;--read:#5cc6d4;--read-soft:#12343b;--act:#f2965d;--act-soft:#3f2616;--own:#b9a0f6;--own-soft:#2b2146}}
text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.bg{fill:var(--bg)}.band{fill:var(--band)}
.bx-n{fill:var(--surface);stroke:var(--ink);stroke-width:1.6}.bx-r{fill:var(--read-soft);stroke:var(--read);stroke-width:1.6}
.bx-a{fill:var(--act-soft);stroke:var(--act);stroke-width:1.6}.bx-o{fill:var(--own-soft);stroke:var(--own);stroke-width:1.6}
.chip{fill:var(--bg);stroke:var(--line);stroke-width:1.2}.wrap{fill:none;stroke:var(--act);stroke-width:1.6;stroke-dasharray:7 5}
.ar{stroke:var(--read);stroke-width:2.2;fill:none}.aa{stroke:var(--act);stroke-width:2.2;fill:none}.an{stroke:var(--ink);stroke-width:1.8;fill:none}.ao{stroke:var(--own);stroke-width:2.2;fill:none}
.ret{stroke-dasharray:7 5}
.mf-r{fill:var(--read)}.mf-a{fill:var(--act)}.mf-n{fill:var(--ink)}.mf-o{fill:var(--own)}
.num{fill:var(--ink)}.numt{fill:var(--bg);font-size:12.5px;font-weight:700}
.g1{fill:var(--ink);font-size:15.5px;font-weight:700}.g2{fill:var(--muted);font-size:12.5px}
.tb{fill:var(--ink);font-size:14px;font-weight:700}.t{fill:var(--ink);font-size:13px;font-weight:500}
.tm{fill:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.tmb{fill:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;font-weight:600}
.ts{fill:var(--muted);font-size:12px}.lab{fill:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
.lr{fill:var(--read);font-size:12.5px;font-weight:600}.la{fill:var(--act);font-size:12.5px;font-weight:600}.lo{fill:var(--own);font-size:12.5px;font-weight:600}
.mid{text-anchor:middle}.end{text-anchor:end}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mf-r"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mf-a"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mf-n"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mf-o"/></marker></defs><rect class="bg" x="0" y="0" width="1280" height="720"/><rect x="340" y="20" width="600" height="680" rx="10" class="band"/><text x="356" y="48" class="g1">temporal-backend</text><text x="356" y="68" class="g2">一個外掛，pluginId 為 temporal</text><rect x="24" y="20" width="306" height="680" rx="10" class="band"/><text x="40" y="48" class="g1">外掛的模組</text><text x="40" y="68" class="g2">createBackendModule({ pluginId: 'temporal' })</text><rect x="960" y="20" width="296" height="680" rx="10" class="band"/><text x="976" y="48" class="g1">其他後端程式</text><text x="976" y="68" class="g2">其他外掛、你自己的 factory</text><rect x="360" y="80" width="560" height="44" rx="8" class="bx-o"/><text x="372" y="101" class="tmb">HTTP 請求  /api/temporal/…</text><path d="M640,124 L640,148" class="an" marker-end="url(#an)"/><rect x="360" y="150" width="560" height="110" rx="8" class="bx-a"/><text x="372" y="171" class="tmb">routes/</text><rect x="376" y="180" width="250" height="66" rx="8" class="bx-n"/><text x="388" y="201" class="tmb">router.ts</text><text x="388" y="221" class="ts">讀取、Query</text><rect x="642" y="180" width="262" height="66" rx="8" class="bx-n"/><text x="654" y="201" class="tmb">controlRoutes.ts</text><text x="654" y="221" class="ts">操作；只在</text><text x="654" y="238" class="tm">temporal.control.enabled</text><path d="M640,260 L640,288" class="an" marker-end="url(#an)"/><rect x="360" y="290" width="560" height="110" rx="8" class="bx-a"/><text x="372" y="311" class="tmb">access/</text><rect x="376" y="320" width="330" height="66" rx="8" class="bx-n"/><text x="388" y="341" class="tmb">TemporalAccessService</text><text x="388" y="361" class="tm">temporalAccessServiceRef (plugin)</text><rect x="722" y="320" width="182" height="66" rx="8" class="bx-n"/><text x="734" y="341" class="tb">權限</text><text x="734" y="361" class="tm">catalogServiceRef</text><path d="M640,400 L640,428" class="an" marker-end="url(#an)"/><rect x="360" y="430" width="560" height="110" rx="8" class="bx-a"/><text x="372" y="451" class="tmb">services/</text><rect x="376" y="460" width="330" height="66" rx="8" class="bx-n"/><text x="388" y="481" class="tmb">WorkflowQueries</text><text x="388" y="501" class="tm">WorkflowListQueries, …</text><rect x="722" y="460" width="182" height="66" rx="8" class="bx-n"/><text x="734" y="481" class="tmb">WorkflowCommands</text><text x="734" y="501" class="ts">start、signal…</text><path d="M640,540 L640,568" class="an" marker-end="url(#an)"/><rect x="360" y="570" width="560" height="56" rx="8" class="bx-r"/><text x="372" y="591" class="tmb">TemporalService</text><text x="372" y="611" class="tm">temporalServiceRef (root) · @temporalio/client</text><path d="M640,626 L640,650" class="ao" marker-end="url(#ao)"/><rect x="360" y="652" width="560" height="36" rx="8" class="bx-o"/><text x="372" y="673" class="tmb">Temporal</text><rect x="640" y="176" width="272" height="74" rx="6" class="wrap"/><rect x="372" y="456" width="338" height="74" rx="6" class="wrap"/><rect x="34" y="90" width="290" height="96" rx="8" class="bx-a"/><text x="46" y="111" class="tmb">temporalControlExtensionPoint</text><text x="46" y="131" class="tm">addControlAction()</text><text x="46" y="148" class="ts">POST …/actions/:actionId</text><text x="46" y="165" class="ts">操作關閉時被略過</text><path d="M324,138 C470,138 560,150 690,176" class="aa" marker-end="url(#aa)"/><rect x="34" y="430" width="290" height="96" rx="8" class="bx-a"/><text x="46" y="451" class="tmb">temporalWorkflowEnricherExtensionPoint</text><text x="46" y="471" class="tm">addWorkflowEnricher()</text><text x="46" y="488" class="ts">列表和詳細資料，</text><text x="46" y="505" class="tm">extensions[id]</text><path d="M324,478 L370,478" class="aa" marker-end="url(#aa)"/><rect x="34" y="290" width="290" height="80" rx="8" class="bx-n"/><text x="46" y="311" class="tb">你的模組的路由</text><text x="46" y="331" class="tm">deps: temporalAccessServiceRef</text><text x="46" y="348" class="tm">loadWorkflow(), authorizeOn()</text><path d="M324,340 L374,350" class="aa" marker-end="url(#aa)"/><rect x="34" y="580" width="290" height="100" rx="8" class="bx-n"/><text x="46" y="601" class="tmb">temporal-backend-module-zigflow</text><text x="46" y="621" class="tm">GET …/definition</text><text x="46" y="638" class="ts">在 /api/temporal 下的自有路由；</text><text x="46" y="655" class="ts">自己檢查 temporal.workflow.read</text><path d="M324,610 C334,610 334,124 358,104" class="an ret" marker-end="url(#an)"/><rect x="980" y="90" width="256" height="100" rx="8" class="bx-n"/><text x="992" y="111" class="tmb">scaffolder-backend-module-temporal</text><text x="992" y="131" class="ts">另一個外掛（scaffolder）：</text><text x="992" y="148" class="ts">以使用者身分呼叫 HTTP API</text><path d="M978,120 L922,104" class="ao" marker-end="url(#ao)"/><rect x="980" y="290" width="256" height="96" rx="8" class="bx-n"/><text x="992" y="311" class="tb">你的存取 factory</text><text x="992" y="331" class="tm">createServiceFactory({</text><text x="992" y="348" class="tm">  service: temporalAccessServiceRef</text><text x="992" y="365" class="ts">取代預設的 factory</text><path d="M978,340 L708,352" class="aa ret" marker-end="url(#aa)"/><rect x="980" y="470" width="256" height="80" rx="8" class="bx-n"/><text x="992" y="491" class="tb">你的其他外掛</text><text x="992" y="511" class="tm">deps: temporalServiceRef</text><text x="992" y="528" class="tm">getClient({ namespace })</text><path d="M978,520 C950,560 940,590 922,596" class="ar" marker-end="url(#ar)"/><rect x="980" y="590" width="256" height="96" rx="8" class="bx-n"/><text x="992" y="611" class="tb">你的連線 factory</text><text x="992" y="631" class="tm">createServiceFactory({</text><text x="992" y="648" class="tm">  service: temporalServiceRef</text><text x="992" y="665" class="ts">取代連線</text><path d="M978,640 L922,612" class="ar ret" marker-end="url(#ar)"/></svg>
