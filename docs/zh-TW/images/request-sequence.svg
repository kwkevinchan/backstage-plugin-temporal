<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1580" width="1280" height="1580" role="img" aria-label="時間由上往下的四個階段：使用者執行範本，範本步驟用該使用者的身分透過外掛啟動流程；另一個步驟等到流程設定搜尋屬性；Update 經外掛送進流程，流程接著結束。每一次外掛呼叫都先檢查權限。"><style>
:root{--bg:#f6f8fa;--surface:#ffffff;--band:#e9edf1;--ink:#1f2933;--muted:#52606d;--line:#9aa5b1;--read:#0b6e7f;--read-soft:#dcf1f4;--act:#b0440d;--act-soft:#fbe9dd;--own:#6a3fb8;--own-soft:#ece6f9}
@media (prefers-color-scheme:dark){:root{--bg:#10151a;--surface:#1d2630;--band:#18202a;--ink:#e6ecf1;--muted:#a3b0bd;--line:#566574;--read:#5cc6d4;--read-soft:#12343b;--act:#f2965d;--act-soft:#3f2616;--own:#b9a0f6;--own-soft:#2b2146}}
text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.bg{fill:var(--bg)}.band{fill:var(--band)}.frame{fill:none;stroke:var(--ink);stroke-width:1.6}
.bx-n{fill:var(--surface);stroke:var(--ink);stroke-width:1.6}.bx-r{fill:var(--read-soft);stroke:var(--read);stroke-width:1.6}
.bx-a{fill:var(--act-soft);stroke:var(--act);stroke-width:1.6}.bx-o{fill:var(--own-soft);stroke:var(--own);stroke-width:1.6}
.chip{fill:var(--bg);stroke:var(--line);stroke-width:1.2}.wrap{fill:none;stroke:var(--act);stroke-width:1.6;stroke-dasharray:7 5}
.ar{stroke:var(--read);stroke-width:2.2;fill:none}.aa{stroke:var(--act);stroke-width:2.2;fill:none}.an{stroke:var(--ink);stroke-width:1.8;fill:none}.ao{stroke:var(--own);stroke-width:2.2;fill:none}
.ret{stroke-dasharray:7 5}.life{stroke:var(--line);stroke-width:1.4;stroke-dasharray:3 6}.loop{fill:none;stroke:var(--muted);stroke-width:1.3;stroke-dasharray:5 5}
.mf-r{fill:var(--read)}.mf-a{fill:var(--act)}.mf-n{fill:var(--ink)}.mf-o{fill:var(--own)}.dot-r{fill:var(--read)}.dot-a{fill:var(--act)}
.g1{fill:var(--ink);font-size:15.5px;font-weight:700}.g2{fill:var(--muted);font-size:12.5px}
.h-r{fill:var(--read);font-size:17px;font-weight:700}.h-a{fill:var(--act);font-size:17px;font-weight:700}
.tb{fill:var(--ink);font-size:14px;font-weight:700}.t{fill:var(--ink);font-size:13px;font-weight:500}
.tm{fill:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.tmb{fill:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;font-weight:600}
.ts{fill:var(--muted);font-size:12px}.lab{fill:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
.lr{fill:var(--read);font-size:12.5px;font-weight:600}.la{fill:var(--act);font-size:12.5px;font-weight:600}
.mid{text-anchor:middle}.end{text-anchor:end}.ml{fill:var(--ink);font-size:12.5px}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mf-r"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mf-a"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mf-n"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mf-o"/></marker></defs><rect class="bg" x="0" y="0" width="1280" height="1580"/><rect x="24" y="150" width="1232" height="430" rx="10" class="band"/><rect x="24" y="610" width="1232" height="280" rx="10" class="band"/><rect x="24" y="920" width="1232" height="400" rx="10" class="band"/><rect x="24" y="1350" width="1232" height="200" rx="10" class="band"/><text x="40" y="184" class="g1">啟動</text><text x="40" y="204" class="g2">使用者執行範本</text><text x="40" y="644" class="g1">等待</text><text x="40" y="664" class="g2">範本還在執行</text><text x="40" y="954" class="g1">決定</text><text x="40" y="974" class="g2">有人送出 Update</text><text x="40" y="1384" class="g1">收尾</text><text x="40" y="1404" class="g2">流程自己跑完</text><line x1="290" y1="118" x2="290" y2="1550" class="life"/><line x1="500" y1="118" x2="500" y2="1550" class="life"/><line x1="730" y1="118" x2="730" y2="1550" class="life"/><line x1="960" y1="118" x2="960" y2="1550" class="life"/><line x1="1160" y1="118" x2="1160" y2="1550" class="life"/><rect x="205" y="60" width="170" height="58" rx="8" class="bx-n"/><text x="290" y="84" class="tb mid">瀏覽器</text><text x="290" y="104" class="ts mid">Create 頁、詳細頁</text><rect x="415" y="60" width="170" height="58" rx="8" class="bx-n"/><text x="500" y="84" class="tb mid">Scaffolder 後端</text><text x="500" y="104" class="ts mid">執行範本裡的步驟</text><rect x="645" y="60" width="170" height="58" rx="8" class="bx-n"/><text x="730" y="84" class="tb mid">Temporal 外掛後端</text><text x="730" y="104" class="ts mid">圖一的那幾層</text><rect x="875" y="60" width="170" height="58" rx="8" class="bx-n"/><text x="960" y="84" class="tb mid">Temporal Server</text><text x="960" y="104" class="ts mid">記住流程的狀態</text><rect x="1075" y="60" width="170" height="58" rx="8" class="bx-o"/><text x="1160" y="84" class="tb mid">Worker</text><text x="1160" y="104" class="ts mid">你寫的流程程式碼</text><line x1="290" y1="200" x2="500" y2="200" class="an" marker-end="url(#an)"/><text x="302" y="191" class="ml">送出範本</text><text x="302" y="218" class="ts">表單：服務、環境</text><rect x="400" y="240" width="200" height="26" rx="13" class="chip"/><text x="500" y="257" class="lab" style="text-anchor:middle">temporal:workflow:start</text><line x1="500" y1="300" x2="730" y2="300" class="aa" marker-end="url(#aa)"/><text x="512" y="291" class="lab">POST /entities/…/workflows</text><text x="512" y="318" class="la">用執行範本的人的身分</text><rect x="620" y="334" width="220" height="110" rx="8" class="bx-a"/><text x="634" y="357" class="t">實體的 start 權限</text><text x="634" y="377" class="t">流程類型和佇列屬於</text><text x="634" y="394" class="t">這個實體</text><text x="634" y="414" class="t">稽核事件 workflow-start</text><text x="634" y="434" class="t">標上 entityRef、initiator</text><line x1="730" y1="470" x2="960" y2="470" class="aa" marker-end="url(#aa)"/><text x="742" y="461" class="lab">startWorkflowExecution</text><line x1="730" y1="520" x2="500" y2="520" class="aa ret" marker-end="url(#aa)"/><text x="512" y="511" class="ml">201 和 workflowId</text><line x1="960" y1="520" x2="1160" y2="520" class="an" marker-end="url(#an)"/><text x="972" y="511" class="ml">工作放進 task queue</text><rect x="1075" y="534" width="170" height="46" rx="8" class="bx-o"/><text x="1160" y="554" class="t mid">開始執行</text><text x="1160" y="571" class="ts mid">你的流程程式碼</text><rect x="400" y="636" width="200" height="26" rx="13" class="chip"/><text x="500" y="653" class="lab" style="text-anchor:middle">temporal:workflow:wait</text><rect x="1075" y="634" width="170" height="66" rx="8" class="bx-o"/><text x="1160" y="657" class="t mid" style="font-size:12px">到達需要決定的地方</text><text x="1160" y="676" class="ts mid">設定搜尋屬性</text><text x="1160" y="692" class="ts mid" style="font-size:11px">（例如 ApprovalPending）</text><line x1="1160" y1="724" x2="960" y2="724" class="ao" marker-end="url(#ao)"/><text x="972" y="715" class="lab">屬性 = true</text><rect x="420" y="750" width="620" height="90" rx="10" class="loop"/><rect x="436" y="740" width="262" height="20" rx="0" class="band"/><text x="444" y="755" class="ts">重複，直到屬性為 true</text><line x1="500" y1="800" x2="730" y2="800" class="ar" marker-end="url(#ar)"/><text x="512" y="791" class="lab">GET …/workflows/:workflowId</text><text x="512" y="818" class="lr">每 intervalSeconds 秒（預設 5）</text><line x1="730" y1="800" x2="960" y2="800" class="ar" marker-end="url(#ar)"/><text x="742" y="791" class="lab">describeWorkflowExecution</text><line x1="500" y1="868" x2="290" y2="868" class="an ret" marker-end="url(#an)"/><text x="302" y="859" class="ml">範本完成，附上流程連結</text><line x1="290" y1="980" x2="730" y2="980" class="aa" marker-end="url(#aa)"/><text x="302" y="971" class="lab">POST …/workflows/:workflowId/update</text><text x="302" y="998" class="ts">Update… 對話框（或另一個範本步驟）</text><rect x="615" y="1010" width="230" height="110" rx="8" class="bx-a"/><text x="629" y="1033" class="t">同一道門（圖一）</text><text x="629" y="1053" class="t">update 權限</text><text x="629" y="1073" class="t">名稱在 allowedUpdates 內</text><text x="629" y="1093" class="t">稽核事件 workflow-update</text><text x="629" y="1111" class="t">流程要在執行中</text><line x1="730" y1="1150" x2="960" y2="1150" class="ao" marker-end="url(#ao)"/><text x="742" y="1141" class="lab">updateWorkflowExecution</text><text x="742" y="1168" class="ts">帶上使用者身分</text><line x1="960" y1="1150" x2="1160" y2="1150" class="an" marker-end="url(#an)"/><text x="972" y="1141" class="ml">交給流程</text><rect x="1075" y="1164" width="170" height="62" rx="8" class="bx-o"/><text x="1160" y="1188" class="t mid">validator 檢查</text><text x="1160" y="1208" class="ts mid" style="font-size:11.5px">handler 記下決定</text><line x1="1160" y1="1252" x2="290" y2="1252" class="an ret" marker-end="url(#an)"/><text x="302" y="1243" class="ml">畫面顯示結果</text><text x="742" y="1243" class="ml">Update 的回傳值，或 validator 的錯誤</text><rect x="1075" y="1372" width="170" height="70" rx="8" class="bx-o"/><text x="1160" y="1396" class="t mid">繼續執行直到結束</text><text x="1160" y="1416" class="ts mid">屬性設回 false</text><line x1="1160" y1="1470" x2="960" y2="1470" class="ao" marker-end="url(#ao)"/><text x="972" y="1461" class="ml">流程結束：Completed</text><line x1="290" y1="1520" x2="730" y2="1520" class="ar" marker-end="url(#ar)"/><text x="302" y="1511" class="ml">頁面重新讀取</text><text x="512" y="1511" class="ts">走圖一的「看」</text><line x1="730" y1="1520" x2="960" y2="1520" class="ar" marker-end="url(#ar)"/></svg>
