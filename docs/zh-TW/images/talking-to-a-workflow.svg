<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 456" width="860" height="456" role="img" aria-label="和執行中的流程溝通。左邊 Client 或外掛送 Signal、Update、Query、Cancel、Terminate 給執行中的 order-1001 Run 1。Signal、Update、Cancel、Terminate 會寫進 Event History，Query 不會。右邊 Run 1 用 Continue-As-New 接成 Run 2，並啟動 Child Workflow notify-1001。Search Attributes 和 Memo 掛在執行上。輸入、輸出和訊息的參數依序經過 Data Converter、選用的 Codec 和 External Storage（把大的 Payload 放在 S3），才進到 Event History。"><style>
:root{--bg:#f6f8fa;--surface:#ffffff;--ink:#1f2933;--muted:#52606d;--line:#9aa5b1;--acc:#0b6e7f;--acc-soft:#dcf1f4;--ours:#b0440d;--ours-soft:#fbe9dd;--fail:#b42318;--fail-soft:#fde8e6;--q:#e9edf1}
@media (prefers-color-scheme:dark){:root{--bg:#10151a;--surface:#1d2630;--ink:#e6ecf1;--muted:#a3b0bd;--line:#566574;--acc:#5cc6d4;--acc-soft:#12343b;--ours:#f2965d;--ours-soft:#3f2616;--fail:#f28b82;--fail-soft:#40201e;--q:#26313c}}
text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.bg{fill:var(--bg)}
.box{fill:var(--surface);stroke:var(--ink);stroke-width:1.5}
.acc{fill:var(--acc-soft);stroke:var(--acc);stroke-width:1.6}
.ours{fill:var(--ours-soft);stroke:var(--ours);stroke-width:1.5;stroke-dasharray:6 4}
.dash{stroke-dasharray:5 4}
.q{fill:var(--q);stroke:var(--line);stroke-width:1.2}
.bfail{fill:var(--fail-soft);stroke:var(--fail);stroke-width:1.5}
.bok{fill:var(--acc-soft);stroke:var(--acc);stroke-width:1.5}
.bwait{fill:none;stroke:var(--muted);stroke-width:1.3;stroke-dasharray:5 4}
.grid{stroke:var(--line);stroke-width:1}
.ln{stroke:var(--ink);stroke-width:1.7;fill:none}
.la{stroke:var(--acc);stroke-width:2;fill:none}
.lo{stroke:var(--ours);stroke-width:1.8;fill:none;stroke-dasharray:6 4}
.lm{stroke:var(--muted);stroke-width:1.7;fill:none;stroke-dasharray:4 4}
.mn{fill:var(--ink)}.ma{fill:var(--acc)}.mo{fill:var(--ours)}.mm{fill:var(--muted)}
.h{fill:var(--ink);font-size:15px;font-weight:700}
.t{fill:var(--ink);font-size:13.5px;font-weight:600}
.s{fill:var(--muted);font-size:12.5px}
.sa{fill:var(--acc);font-size:12.5px;font-weight:600}
.so{fill:var(--ours);font-size:12.5px;font-weight:600}
.sf{fill:var(--fail);font-size:12.5px;font-weight:600}
.c{text-anchor:middle}
.badge{fill:var(--acc);stroke:none}.bn{fill:var(--bg);font-size:12px;font-weight:700;text-anchor:middle}
</style><defs>
<marker id="mn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mn"/></marker>
<marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ma"/></marker>
<marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mo"/></marker>
<marker id="mm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mm"/></marker>
</defs><rect class="bg" x="0" y="0" width="860" height="456"/><path d="M14 17 L54 17" class="la" marker-end="url(#ma)"/><text x="62" y="21" class="s">會寫進 Event History</text><path d="M330 17 L370 17" class="lm" marker-end="url(#mm)"/><text x="378" y="21" class="s">不寫</text><rect x="14" y="50" width="186" height="240" rx="6" class="ours"/><text x="28" y="74" class="h">Client 或外掛的按鈕</text><text x="28" y="100" class="t">Signal…</text><text x="28" y="116" class="s">送了就走</text><text x="28" y="138" class="t">Update…</text><text x="28" y="154" class="s">等結果</text><text x="28" y="176" class="t">Query…</text><text x="28" y="192" class="s">只讀狀態</text><text x="28" y="214" class="t">Cancel</text><text x="28" y="230" class="s">請它收尾</text><text x="28" y="252" class="t">Terminate</text><text x="28" y="268" class="s">直接停，可附原因</text><rect x="250" y="50" width="310" height="240" rx="8" class="acc"/><text x="264" y="74" class="h">order-1001 · Run 1（執行中）</text><text x="264" y="94" class="s">狀態：approvedBy、目前在哪一步</text><rect x="264" y="106" width="282" height="28" rx="4" class="box"/><text x="274" y="125" class="s">signal handler：改狀態</text><rect x="264" y="142" width="282" height="28" rx="4" class="box"/><text x="274" y="161" class="s">update handler ＋ validator：回傳結果</text><rect x="264" y="178" width="282" height="28" rx="4" class="box"/><text x="274" y="197" class="s">query handler：只能讀</text><text x="264" y="238" class="s">Cancel：程式收到取消，可以 catch 並收尾</text><text x="264" y="264" class="s">Terminate：伺服器直接結束，不再跑程式</text><path d="M200 100 L262 120" class="la" marker-end="url(#ma)"/><path d="M200 138 L262 152" class="la" marker-end="url(#ma)"/><path d="M200 178 L262 190" class="lm" marker-end="url(#mm)"/><path d="M262 196 L200 186" class="lm" marker-end="url(#mm)"/><path d="M200 214 L262 232" class="la" marker-end="url(#ma)"/><path d="M200 252 L262 260" class="la" marker-end="url(#ma)"/><text x="500" y="42" class="s">Continue-As-New（帶著狀態）</text><path d="M560 96 L598 96" class="ln" marker-end="url(#mn)"/><rect x="598" y="50" width="248" height="96" rx="6" class="box"/><text x="612" y="74" class="t">order-1001 · Run 2</text><text x="612" y="94" class="s">同一個 Workflow ID、</text><text x="612" y="111" class="s">新的 Run ID、新的空紀錄。</text><text x="612" y="128" class="s">外掛顯示 Run 2 of 2。</text><path d="M560 218 L598 218" class="ln" marker-end="url(#mn)"/><rect x="598" y="172" width="248" height="118" rx="6" class="box"/><text x="612" y="196" class="t">Child Workflow</text><text x="612" y="216" class="s">由 Run 1 啟動的 notify-1001：</text><text x="612" y="233" class="s">有自己的 ID 和紀錄，</text><text x="612" y="250" class="s">父流程可以等它。外掛的方塊</text><text x="612" y="267" class="s">可以連到它的詳細頁。</text><text x="24" y="322" class="s">掛在執行上</text><rect x="14" y="332" width="206" height="100" rx="6" class="box"/><text x="28" y="354" class="t">Search Attributes</text><text x="28" y="374" class="s">例：BackstageEntityRef：</text><text x="28" y="390" class="s">可搜尋，外掛靠它找元件</text><text x="28" y="406" class="s">的流程。</text><text x="28" y="422" class="s">Memo：附註，不能搜尋。</text><path d="M150 330 L266 292" class="ln" marker-end="url(#mn)"/><path d="M320 290 L320 354" class="la" marker-end="url(#ma)"/><text x="330" y="326" class="sa">輸入、輸出、訊息的參數</text><rect x="250" y="356" width="140" height="78" rx="6" class="box"/><text x="262" y="378" class="t">Data Converter</text><text x="262" y="398" class="s">值轉成 Payload，</text><text x="262" y="414" class="s">再轉回來</text><path d="M390 395 L402 395" class="ln" marker-end="url(#mn)"/><rect x="402" y="356" width="140" height="78" rx="6" class="box dash"/><text x="414" y="378" class="t">Codec（選用）</text><text x="414" y="398" class="s">對整個 Payload</text><text x="414" y="414" class="s">加密、壓縮</text><path d="M542 395 L554 395" class="ln" marker-end="url(#mn)"/><rect x="554" y="356" width="140" height="78" rx="6" class="box"/><text x="566" y="378" class="t">External Storage</text><text x="566" y="398" class="s">大的 Payload 放 S3，</text><text x="566" y="414" class="s">紀錄只留參照</text><path d="M694 395 L706 395" class="ln" marker-end="url(#mn)"/><rect x="706" y="356" width="140" height="78" rx="6" class="acc"/><text x="718" y="378" class="t">Event History</text><text x="718" y="398" class="s">Payload，或它們的</text><text x="718" y="414" class="s">參照</text></svg>
