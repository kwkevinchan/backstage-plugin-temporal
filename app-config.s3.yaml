# Temporal External Storage: large payloads that the workers store in S3 with
# the S3 driver of the Temporal SDK (@temporalio/external-storage-s3).
# Local development with RustFS (examples/docker-compose.rustfs.yaml), whose
# S3 API listens on localhost:9100:
#
#   yarn workspace backend start --config ../../app-config.yaml --config ../../app-config.s3.yaml
#
# The connection and the credentials are a Backstage AWS S3 integration; the
# access key comes from the environment, and the backend only needs read
# access. integrationHost selects that integration by the host of its
# endpoint.
integrations:
  awsS3:
    - endpoint: http://localhost:9100
      s3ForcePathStyle: true
      accessKeyId: ${PAYLOAD_S3_ACCESS_KEY}
      secretAccessKey: ${PAYLOAD_S3_SECRET_KEY}
temporal:
  externalStorage:
    s3:
      bucket: ${PAYLOAD_S3_BUCKET}
      integrationHost: localhost:9100
