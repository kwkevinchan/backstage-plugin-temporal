name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boundaries:
    name: Boundaries and secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Boundary scanner self test
        run: node scripts/check-boundaries.test.mjs

      - name: Scan tracked files
        env:
          BOUNDARY_DENYLIST: ${{ secrets.BOUNDARY_DENYLIST }}
        run: node scripts/check-boundaries.mjs --tracked

      - name: Scan commits and diff
        env:
          BOUNDARY_DENYLIST: ${{ secrets.BOUNDARY_DENYLIST }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "No usable base commit; scanning the head commit only"
            BASE_SHA="$(git rev-parse "$HEAD_SHA^")"
          fi
          node scripts/check-boundaries.mjs --range "$BASE_SHA..$HEAD_SHA"

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    name: Verify (Backstage ${{ matrix.backstage }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The main line pinned in backstage.json.
        backstage: ['1.56']
    env:
      CI: true
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Enable corepack
        run: corepack enable

      - name: Cache yarn
        uses: actions/cache@v4
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Install
        run: yarn install --immutable
        env:
          HUSKY: 0

      - name: Constraints
        run: yarn constraints

      - name: Backstage release pin
        run: node scripts/pin-backstage-release.mjs --check

      - name: Prettier
        run: yarn prettier:check

      - name: Type check
        run: yarn tsc:full

      - name: Lint
        run: yarn backstage-cli repo lint

      - name: Test
        run: yarn backstage-cli repo test

      - name: Build
        run: yarn backstage-cli repo build --all

  e2e:
    name: Smoke (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [app, app-next]
    env:
      CI: true
      NODE_OPTIONS: --max-old-space-size=8192
      SMOKE_APP: ${{ matrix.app }}
      SMOKE_SHOT_DIR: e2e-test-results/${{ matrix.app }}
      # Large payloads in RustFS (S3-compatible), for the S3 payload test.
      # Throwaway credentials of a container that only lives in this job.
      SMOKE_S3: '1'
      PAYLOAD_S3_ENDPOINT: http://localhost:9100
      PAYLOAD_S3_BUCKET: temporal-payloads
      PAYLOAD_S3_ACCESS_KEY: ci-access
      PAYLOAD_S3_SECRET_KEY: ci-secret-key
      APP_CONFIG_temporal_payloads_s3_endpoint: http://localhost:9100
      APP_CONFIG_temporal_payloads_s3_bucket: temporal-payloads
      APP_CONFIG_temporal_payloads_s3_forcePathStyle: 'true'
      APP_CONFIG_temporal_payloads_s3_credentials_accessKeyId: ci-access
      APP_CONFIG_temporal_payloads_s3_credentials_secretAccessKey: ci-secret-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Enable corepack
        run: corepack enable

      - name: Cache yarn
        uses: actions/cache@v4
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Install
        run: yarn install --immutable
        env:
          HUSKY: 0

      - name: Install Temporal CLI
        run: |
          curl -sSf https://temporal.download/cli.sh | sh
          echo "$HOME/.temporalio/bin" >> "$GITHUB_PATH"

      - name: Start Temporal development server
        run: |
          temporal server start-dev --headless --port 7233 \
            --search-attribute BackstageEntityRef=Keyword \
            --search-attribute ApprovalPending=Bool > temporal.log 2>&1 &
          for i in $(seq 1 60); do
            temporal operator cluster health 2>/dev/null | grep -q SERVING && break
            sleep 2
          done
          temporal operator cluster health

      - name: Start RustFS
        run: |
          docker run -d --name rustfs -p 127.0.0.1:9100:9000 \
            -e RUSTFS_ACCESS_KEY="$PAYLOAD_S3_ACCESS_KEY" \
            -e RUSTFS_SECRET_KEY="$PAYLOAD_S3_SECRET_KEY" \
            rustfs/rustfs:1.0.4
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:9100/ && break
            sleep 2
          done

      - name: Start example workflows
        run: yarn workspace example-worker start

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Smoke test
        run: yarn test:e2e

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.app }}
          path: |
            e2e-test-results/
            e2e-test-report/
            temporal.log
          retention-days: 7
