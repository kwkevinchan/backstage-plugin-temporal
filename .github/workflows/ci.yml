name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boundaries:
    name: Boundaries and secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Boundary scanner self test
        run: node scripts/check-boundaries.test.mjs

      # The frontend copies of the shared definitions must match the backend
      # originals (see scripts/sync-common.mjs).
      - name: Shared definitions copies
        run: node scripts/sync-common.mjs --check

      - name: Scan tracked files
        env:
          BOUNDARY_DENYLIST: ${{ secrets.BOUNDARY_DENYLIST }}
        run: node scripts/check-boundaries.mjs --tracked

      - name: Scan commits and diff
        env:
          BOUNDARY_DENYLIST: ${{ secrets.BOUNDARY_DENYLIST }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "No usable base commit; scanning the head commit only"
            BASE_SHA="$(git rev-parse "$HEAD_SHA^")"
          fi
          node scripts/check-boundaries.mjs --range "$BASE_SHA..$HEAD_SHA"

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    name: Verify (Backstage ${{ matrix.backstage }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The main line pinned in backstage.json.
        backstage: ['1.56']
    env:
      CI: true
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Enable corepack
        run: corepack enable

      - name: Cache yarn
        uses: actions/cache@v4
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Install
        run: yarn install --immutable
        env:
          HUSKY: 0

      - name: Constraints
        run: yarn constraints

      - name: Backstage release pin
        run: node scripts/pin-backstage-release.mjs --check

      - name: Prettier
        run: yarn prettier:check

      # Lint and validate the OpenAPI spec of the backend plugin. The route
      # tests check the requests and responses against it.
      - name: OpenAPI spec
        run: yarn lint:openapi

      - name: Type check
        run: yarn tsc:full

      # The API reports (report*.api.md) of the published packages must match
      # their exports. Reads the declarations the type check wrote to
      # dist-types; run `yarn build:api-reports` and commit the changes.
      - name: API reports
        run: yarn build:api-reports:only --ci

      - name: Lint
        run: yarn backstage-cli repo lint

      - name: Test
        run: yarn backstage-cli repo test

      - name: Build
        run: yarn backstage-cli repo build --all

  e2e:
    name: Smoke (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [app, app-next]
    env:
      CI: true
      NODE_OPTIONS: --max-old-space-size=8192
      SMOKE_APP: ${{ matrix.app }}
      SMOKE_SHOT_DIR: e2e-test-results/${{ matrix.app }}
      # Temporal External Storage in RustFS (S3-compatible), for the payload test.
      # Throwaway credentials of a container that only lives in this job.
      SMOKE_S3: '1'
      # A YAML workflow run by Zigflow, for the run on the Definition tab.
      SMOKE_ZIGFLOW: '1'
      PAYLOAD_S3_ENDPOINT: http://localhost:9100
      PAYLOAD_S3_BUCKET: temporal-payloads
      PAYLOAD_S3_ACCESS_KEY: ci-access
      PAYLOAD_S3_SECRET_KEY: ci-secret-key
      APP_CONFIG_temporal_externalStorage_s3_endpoint: http://localhost:9100
      APP_CONFIG_temporal_externalStorage_s3_bucket: temporal-payloads
      APP_CONFIG_temporal_externalStorage_s3_forcePathStyle: 'true'
      APP_CONFIG_temporal_externalStorage_s3_credentials_accessKeyId: ci-access
      APP_CONFIG_temporal_externalStorage_s3_credentials_secretAccessKey: ci-secret-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Enable corepack
        run: corepack enable

      - name: Cache yarn
        uses: actions/cache@v4
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Install
        run: yarn install --immutable
        env:
          HUSKY: 0

      - name: Install Temporal CLI
        run: |
          curl -sSf https://temporal.download/cli.sh | sh
          echo "$HOME/.temporalio/bin" >> "$GITHUB_PATH"

      - name: Start Temporal development server
        run: |
          temporal server start-dev --headless --port 7233 \
            --search-attribute BackstageEntityRef=Keyword \
            --search-attribute BackstageInitiator=Keyword \
            --search-attribute ApprovalPending=Bool > temporal.log 2>&1 &
          for i in $(seq 1 60); do
            temporal operator cluster health 2>/dev/null | grep -q SERVING && break
            sleep 2
          done
          temporal operator cluster health

      - name: Start RustFS
        run: |
          docker run -d --name rustfs -p 127.0.0.1:9100:9000 \
            -e RUSTFS_ACCESS_KEY="$PAYLOAD_S3_ACCESS_KEY" \
            -e RUSTFS_SECRET_KEY="$PAYLOAD_S3_SECRET_KEY" \
            rustfs/rustfs:1.0.4
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:9100/ && break
            sleep 2
          done

      - name: Start example workflows
        run: yarn workspace example-worker start

      # Zigflow runs the YAML examples (examples/workflows); its activities
      # run in the example worker. Health and metrics ports stay off 3000.
      - name: Start Zigflow and the YAML example workflows
        run: |
          docker run -d --name zigflow --network host \
            -e TEMPORAL_ADDRESS=localhost:7233 -e DISABLE_TELEMETRY=true \
            -e CONVERT_FAILURE_DATA=false -e WORKFLOW_FILE= \
            -e WORKFLOW_DIRECTORY=/app/workflows \
            -v "$PWD/examples/workflows:/app/workflows:ro" \
            ghcr.io/zigflow/zigflow:0.18.0-core \
            run --health-listen-address 127.0.0.1:3901 \
            --metrics-listen-address 127.0.0.1:9901
          yarn workspace example-worker zigflow
          docker logs zigflow 2>&1 | tail -20

      # Signals, updates, queries and started workflows of the control tests.
      - name: Start example worker
        run: |
          yarn workspace example-worker serve > worker.log 2>&1 &
          for i in $(seq 1 30); do
            grep -q "Worker polling" worker.log && break
            sleep 2
          done
          cat worker.log

      # The hosted runner sometimes cannot resolve the Ubuntu mirrors for
      # minutes at a time (apt: "Temporary failure resolving"), which fails
      # the system packages part of this step with exit code 100. A later
      # attempt usually resolves them again, so both parts are tried together
      # at most MAX_ATTEMPTS times. `install --with-deps` is run as its two
      # halves: install-deps (apt, needs root) and install (browser download).
      # timeout runs as root for the apt half, because a timeout started as a
      # normal user cannot signal the apt-get that sudo starts and would leave
      # it holding the dpkg lock. Each half is capped (DEPS_MINUTES,
      # BROWSER_MINUTES), since a failing attempt can otherwise spend 10+
      # minutes in apt's own timeouts. Before each retry, after the wait, dpkg
      # is finished off in case apt was stopped half-way; the wait lets a dpkg
      # that timeout cannot signal (it runs in its own session) exit first.
      # If every attempt fails the step fails. Worst case: 3 * (5 + 2 min +
      # 30 s kill grace) + 15 s + 30 s of waiting = 23 min 15 s, under the
      # step timeout.
      - name: Install Playwright browser
        timeout-minutes: 25
        run: |
          MAX_ATTEMPTS=3
          DEPS_MINUTES=5
          BROWSER_MINUTES=2
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            if sudo env "PATH=$PATH" CI=true timeout --kill-after=30s "${DEPS_MINUTES}m" \
                npx playwright install-deps chromium &&
              timeout --kill-after=30s "${BROWSER_MINUTES}m" \
                npx playwright install chromium; then
              exit 0
            fi
            echo "Playwright browser install failed (attempt $attempt of $MAX_ATTEMPTS)"
            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              sleep $((attempt * 15))
              sudo dpkg --configure -a || true
            fi
          done
          exit 1

      - name: Smoke test
        run: yarn test:e2e

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.app }}
          path: |
            e2e-test-results/
            e2e-test-report/
            temporal.log
            worker.log
          retention-days: 7
