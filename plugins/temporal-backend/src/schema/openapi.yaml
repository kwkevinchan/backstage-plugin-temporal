        - $ref: '#/components/parameters/runId'
        - $ref: '#/components/parameters/entityRef'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowHandlersResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /namespaces/{namespace}/workflows/{workflowId}/runs/{runId}/query:
    post:
      operationId: queryWorkflowRun
      summary: Run a query on a workflow (one run)
      description: |-
        Queries only read the workflow, but run the worker's code, so they are recorded with the auditor. Always served, also when `temporal.control.enabled` is false.

        Permission: `temporal.workflow.read` on the entity (from `entityRef`, else from the workflow's entity reference search attribute), or `temporal.workflow.list` for a workflow it covers when no `entityRef` is given. Then `temporal.workflow.query` on the workflow's entity.
      tags:
        - Workflows
      x-temporal-permissions:
        - temporal.workflow.read
        - temporal.workflow.list
        - temporal.workflow.query
      parameters:
        - $ref: '#/components/parameters/namespace'
        - $ref: '#/components/parameters/workflowId'
        - $ref: '#/components/parameters/runId'
        - $ref: '#/components/parameters/entityRef'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowMessageRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowMessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /namespaces/{namespace}/workflows/{workflowId}/runs/{runId}/signal:
    post:
      operationId: signalWorkflowRun
      summary: Send a signal to a running workflow (one run)
      description: |-
        The name must be allowed by `temporal.control.allowedSignals` when it is set. 409 when the workflow is not running.

        Permission: `temporal.workflow.read` on the entity (from `entityRef`, else from the workflow's entity reference search attribute), or `temporal.workflow.list` for a workflow it covers when no `entityRef` is given. Then `temporal.workflow.signal` on the workflow's entity (for a workflow without one, the permission must be allowed without conditions).

        Exists unless `temporal.control.enabled` is false (otherwise 404). Recorded with the auditor.
      tags:
        - Operations
      x-temporal-permissions:
        - temporal.workflow.read
        - temporal.workflow.list
        - temporal.workflow.signal
      x-temporal-control: true
      parameters:
        - $ref: '#/components/parameters/namespace'
        - $ref: '#/components/parameters/workflowId'
        - $ref: '#/components/parameters/runId'
        - $ref: '#/components/parameters/entityRef'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowMessageRequest'
      responses:
        '202':
          description: Sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empty'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /namespaces/{namespace}/workflows/{workflowId}/runs/{runId}/update:
    post:
      operationId: updateWorkflowRun
      summary: Send an update to a running workflow and wait for its result (one run)
      description: |-
        The name must be allowed by `temporal.control.allowedUpdates` when it is set. 409 when the workflow is not running; 503 when the update does not finish in time.

        Permission: `temporal.workflow.read` on the entity (from `entityRef`, else from the workflow's entity reference search attribute), or `temporal.workflow.list` for a workflow it covers when no `entityRef` is given. Then `temporal.workflow.update` on the workflow's entity (for a workflow without one, the permission must be allowed without conditions).

        Exists unless `temporal.control.enabled` is false (otherwise 404). Recorded with the auditor.
      tags:
        - Operations
      x-temporal-permissions:
        - temporal.workflow.read
        - temporal.workflow.list
        - temporal.workflow.update
      x-temporal-control: true
      parameters:
        - $ref: '#/components/parameters/namespace'
        - $ref: '#/components/parameters/workflowId'
        - $ref: '#/components/parameters/runId'
        - $ref: '#/components/parameters/entityRef'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowMessageRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowMessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /namespaces/{namespace}/workflows/{workflowId}/runs/{runId}/cancel:
    post:
      operationId: cancelWorkflowRun
      summary: Request cancellation of a running workflow (one run)
      description: |-
        409 when the workflow is not running. The body is not read.

        Permission: `temporal.workflow.read` on the entity (from `entityRef`, else from the workflow's entity reference search attribute), or `temporal.workflow.list` for a workflow it covers when no `entityRef` is given. Then `temporal.workflow.cancel` on the workflow's entity (for a workflow without one, the permission must be allowed without conditions).

        Exists unless `temporal.control.enabled` is false (otherwise 404). Recorded with the auditor.
      tags:
        - Operations
      x-temporal-permissions:
        - temporal.workflow.read
        - temporal.workflow.list
        - temporal.workflow.cancel
      x-temporal-control: true
      parameters:
        - $ref: '#/components/parameters/namespace'
        - $ref: '#/components/parameters/workflowId'
        - $ref: '#/components/parameters/runId'
        - $ref: '#/components/parameters/entityRef'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Empty'
      responses:
        '202':
          description: Requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empty'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /namespaces/{namespace}/workflows/{workflowId}/runs/{runId}/terminate:
    post:
      operationId: terminateWorkflowRun
      summary: Terminate a running workflow (one run)
      description: |-
        409 when the workflow is not running. The reason defaults to `Terminated from Backstage`.

        Permission: `temporal.workflow.read` on the entity (from `entityRef`, else from the workflow's entity reference search attribute), or `temporal.workflow.list` for a workflow it covers when no `entityRef` is given. Then `temporal.workflow.terminate` on the workflow's entity (for a workflow without one, the permission must be allowed without conditions).

        Exists unless `temporal.control.enabled` is false (otherwise 404). Recorded with the auditor.
      tags:
