    post:
      operationId: updateWorkflowRun
      summary: Send an update to the workflow's execution chain and wait for its result
      description: |-
        Operates on the execution chain of the opened run (passing `firstExecutionRunId` without `runId` to Temporal), targeting whichever run in the chain is currently running. The name must be allowed by `temporal.control.allowedUpdates` when it is set. 409 when the chain has ended or the workflow ID now belongs to a different chain; when the Temporal server does not report the chain ID, the request is locked to the opened run; 503 when the update does not finish in time.

        Permission: `temporal.workflow.read` on the entity (from `entityRef`, else from the workflow's entity reference search attribute), or `temporal.workflow.list` for a workflow it covers when no `entityRef` is given. Then `temporal.workflow.update` on the opened run's entity (assuming runs in a chain belong to the same entity; for a workflow without one, the permission must be allowed without conditions).

        Exists unless `temporal.control.enabled` is false (otherwise 404). Recorded with the auditor (`firstRunId`, `scope: 'chain'`; `scope: 'run'` without `firstRunId` when the chain ID is not reported).
      tags:
        - Operations
      x-temporal-permissions:
        - temporal.workflow.read
        - temporal.workflow.list
        - temporal.workflow.update
      x-temporal-control: true
      parameters:
        - $ref: '#/components/parameters/namespace'
        - $ref: '#/components/parameters/workflowId'
        - $ref: '#/components/parameters/runId'
        - $ref: '#/components/parameters/entityRef'
