        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /namespaces/{namespace}/schedules/{scheduleId}/{operation}:
    post:
      operationId: operateSchedule
      summary: Pause, unpause or trigger a schedule
      description: |-
        With `entityRef`, the schedule must start one of the workflow types of the entity or the `TemporalWorkflow` entities it depends on (404 otherwise). `pause` and `unpause` keep an optional note; `trigger` takes none (400). An `operation` that is not `pause`, `unpause` or `trigger` does not match this route and answers 404 without a body. 409 when Temporal refuses the operation in the state of the schedule.

        Permission: `temporal.workflow.start` on the entity of `entityRef`; without it, `temporal.workflow.list` and `temporal.workflow.start`, both without conditions.

        Exists unless `temporal.control.enabled` is false (otherwise 404). Recorded with the auditor.
      tags:
        - Schedules
        - Operations
      x-temporal-permissions:
        - temporal.workflow.start
      x-temporal-control: true
      parameters:
        - $ref: '#/components/parameters/namespace'
        - $ref: '#/components/parameters/scheduleId'
        - $ref: '#/components/parameters/scheduleOperation'
        - $ref: '#/components/parameters/scheduleEntityRef'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type:
                    - string
