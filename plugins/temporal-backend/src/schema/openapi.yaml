openapi: 3.1.0
info:
  title: temporal
  version: '1'
  description: |-
    The HTTP API of the Temporal backend plugin for Backstage (`@kwkevinchan/backstage-plugin-temporal-backend`).

    The paths are relative to the base URL of the plugin, `/api/temporal` in a default backend (the discovery service gives the URL of an installation). Every route needs Backstage credentials: a user token from the identity API, or a service token.

    The routes that change workflows (tag `Operations`, `x-temporal-control: true`) exist unless `temporal.control.enabled` is false. Routes and fields marked experimental (`x-temporal-experimental: true`, tag `Experimental`) change before the first stable release. `x-temporal-permissions` lists the permissions a route checks; the description says on what, and the permission policy decides.

    Paths take the entity kind, namespace and name in lowercase. Errors have the body of the Backstage backend (`Error`). A route that is not served (the operations with `temporal.control.enabled: false`, the definition route without its module) answers 404 without a body. Query parameters that are not listed are ignored, so a newer frontend can send them without breaking older backends.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact: {}
servers:
  - url: /
tags:
  - name: Workflows
    description: Reading workflows and their history.
  - name: Schedules
    description: Temporal schedules.
  - name: Operations
    description: Routes that change workflows; absent when `temporal.control.enabled` is false.
  - name: Experimental
    description: 'Experimental: the shape changes before the first stable release. The model calls and Event Groups do not need a setting.'
  - name: Definitions
    description: Served by `@kwkevinchan/backstage-plugin-temporal-backend-module-zigflow`.
security:
  - JWT: []
components:
  securitySchemes:
    JWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    namespace:
      name: namespace
      in: path
      required: true
      description: Temporal namespace. Must match `^[A-Za-z0-9][A-Za-z0-9._-]{0,254}$` and be listed in `temporal.connection.namespaces`.
      schema:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,254}$'
        maxLength: 255
    workflowId:
      name: workflowId
      in: path
      required: true
      description: Workflow ID, at most 1000 characters.
      schema:
        type: string
        minLength: 1
        maxLength: 1000
    runId:
      name: runId
      in: path
      required: true
      description: Run ID, at most 1000 characters.
      schema:
        type: string
        minLength: 1
        maxLength: 1000
    entityKind:
      name: kind
      in: path
      required: true
      description: Entity kind, lowercase.
      schema:
        type: string
    entityNamespace:
      name: namespace
      in: path
      required: true
      description: Entity namespace, lowercase.
      schema:
        type: string
    entityName:
      name: name
      in: path
      required: true
      description: Entity name, lowercase.
      schema:
        type: string
    entityRef:
      name: entityRef
      in: query
      required: false
      allowReserved: true
      description: "The entity the workflow is opened from, for example `component:default/orders`. With it, the permission is checked on that entity, and the workflow must belong to it (its workflow sources, or a parent workflow that does, up to three levels): 404 otherwise. Without it, `temporal.workflow.list` allows the workflows it covers; only when it does not, the permission is checked on the entity in the workflow's entity reference search attribute (403 when there is none)."
      schema:
        type: string
    scheduleEntityRef:
      name: entityRef
      in: query
      required: false
      allowReserved: true
      description: 'An entity, for example `component:default/orders`. `temporal.workflow.start` is checked on it, and the schedule must start one of the workflow types of the entity or of the `TemporalWorkflow` entities it depends on, in its namespace: 404 otherwise. Without it, `temporal.workflow.list` and `temporal.workflow.start` must be allowed without conditions.'
      schema:
        type: string
    status:
      name: status
      in: query
      required: false
      allowReserved: true
      description: Only runs with this status. An empty value is ignored, as if the parameter was omitted.
      schema:
        type: string
        enum:
          - Running
          - Completed
          - Failed
          - Canceled
          - Terminated
          - ContinuedAsNew
          - TimedOut
    allRuns:
      name: allRuns
      in: query
      required: false
      allowReserved: true
      description: Without `true` (or a `status`), runs that continued as new are left out, so a workflow that keeps continuing as new is listed once. An empty value is treated as false.
      schema:
        type: boolean
    searchAttribute:
      name: searchAttribute
      in: query
      required: false
      allowReserved: true
      description: A Bool search attribute that must be true, for example `ApprovalPending`. Letters, digits and `_`, at most 64 characters, starting with a letter or `_`. An empty value is ignored.
      schema:
        type: string
        pattern: '^$|^[A-Za-z_][A-Za-z0-9_]{0,63}$'
        maxLength: 64
    listPageSize:
      name: pageSize
      in: query
      required: false
      allowReserved: true
      description: Runs per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    pageToken:
      name: pageToken
      in: query
      required: false
      allowReserved: true
      description: '`nextPageToken` of the previous page. A base64-url string of at most 4096 characters; an empty value is ignored.'
      schema:
        type: string
        pattern: '^[A-Za-z0-9+/=_-]{0,4096}$'
        maxLength: 4096
    listNamespace:
      name: namespace
      in: query
      required: false
      allowReserved: true
      description: Temporal namespace; defaults to `temporal.connection.defaultNamespace`. When set, must match `^[A-Za-z0-9][A-Za-z0-9._-]{0,254}$` and be listed in `temporal.connection.namespaces`. An empty value uses the default.
      schema:
        type: string
        pattern: '^$|^[A-Za-z0-9][A-Za-z0-9._-]{0,254}$'
        maxLength: 255
    workflowType:
      name: workflowType
      in: query
      required: false
      allowReserved: true
      description: Only this workflow type. An empty value is ignored.
      schema:
        type: string
        pattern: '^$|^[A-Za-z0-9_][A-Za-z0-9_.:/-]{0,254}$'
        maxLength: 255
    workflowIdPrefix:
      name: workflowId
      in: query
      required: false
      allowReserved: true
      description: 'Start of the workflow ID. The plugin trims the value first; after that it must be 1 to 255 letters, digits or `_ . : / -`. An empty value is ignored.'
      schema:
        type: string
        pattern: '^$|^[A-Za-z0-9_.:/-]{1,255}$'
        maxLength: 255
    statsLimit:
      name: limit
      in: query
      required: false
      allowReserved: true
      description: Most recent runs to compute the numbers from.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    historyPageSize:
      name: pageSize
      in: query
      required: false
      allowReserved: true
      description: Events per page.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    scheduleId:
      name: scheduleId
      in: path
      required: true
      description: Schedule ID, at most 1000 characters.
      schema:
        type: string
        minLength: 1
        maxLength: 1000
    scheduleOperation:
      name: operation
      in: path
      required: true
      description: The operation. A value that is not `pause`, `unpause` or `trigger` does not match this route and answers 404 without a body.
      schema:
        type: string
        enum:
          - pause
          - unpause
          - trigger
    actionId:
      name: actionId
      in: path
      required: true
      description: ID of a custom action registered by a backend module. An ID that does not match the pattern, or is not registered, answers 404.
      schema:
        type: string
        pattern: ^[A-Za-z][A-Za-z0-9._-]{0,99}$
    eventId:
      name: eventId
      in: path
      required: true
      description: Event ID of the `ActivityTaskScheduled` event of the model call.
      schema:
        type: string
        pattern: ^[0-9]{1,19}$
    llmCallIndex:
      name: index
      in: query
      required: false
      allowReserved: true
      description: Position of the model call in a step that made several, from 0.
      schema:
        type: string
        pattern: ^[0-9]{1,4}$
        default: '0'
  responses:
    BadRequest:
      description: Invalid parameters or body (`InputError`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: No valid Backstage credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The permission policy does not allow it (`NotAllowedError`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found (`NotFoundError`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The workflow is not in a state that allows it (`ConflictError`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Unexpected error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: Temporal is not reachable, did not answer within the deadline of the call, rate limits the backend or refused its credentials, or no worker answered a query or an update in time (`ServiceUnavailableError`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      description: The error body of the Backstage backend (`@backstage/errors`).
      required:
        - error
        - response
      properties:
        error:
          type: object
          required:
            - name
            - message
          properties:
            name:
              type: string
              description: Error class, for example `InputError` or `NotAllowedError`.
            message:
              type: string
            stack:
              type: string
              description: Only when the backend is configured to show stack traces.
            code:
              type: string
            continuedAsNewRunId:
              type: string
              description: On a 409 of `POST .../signal` on a run that continued as new, the run it continued as.
          additionalProperties: {}
        request:
          type: object
          required:
            - method
            - url
          properties:
            method:
              type: string
            url:
              type: string
          additionalProperties: {}
        response:
          type: object
          required:
            - statusCode
          properties:
            statusCode:
              type: integer
          additionalProperties: {}
      additionalProperties: {}
    WorkflowStatus:
      type: string
      description: Status of a workflow execution, named like the Temporal visibility `ExecutionStatus` values.
      enum:
        - Running
        - Completed
        - Failed
        - Canceled
        - Terminated
        - ContinuedAsNew
        - TimedOut
        - Unknown
    WorkflowFailure:
      type: object
      description: A failure with its cause chain, outermost first.
      required:
        - message
      properties:
        message:
          type: string
        kind:
          type: string
          description: Failure kind, for example `ApplicationFailure` or `TimeoutFailure`.
        type:
          type: string
          description: Application error type, for `ApplicationFailure`.
        source:
          type: string
        stackTrace:
          type: string
        nonRetryable:
          type: boolean
        cause:
          type: object
          description: The cause, a `WorkflowFailure` itself (not expanded here).
          additionalProperties: {}
      additionalProperties: false
    PendingActivity:
      type: object
      description: An activity that is scheduled, started or waiting for a retry.
      required:
        - activityId
        - activityType
        - state
      properties:
        activityId:
          type: string
        activityType:
          type: string
        state:
          type: string
        attempt:
          type: integer
        maximumAttempts:
          type: integer
        scheduledTime:
          type: string
          description: ISO 8601 timestamp.
        lastStartedTime:
          type: string
          description: ISO 8601 timestamp.
        lastHeartbeatTime:
          type: string
          description: ISO 8601 timestamp.
        lastFailure:
          $ref: '#/components/schemas/WorkflowFailure'
      additionalProperties: false
    WorkflowSummary:
      type: object
      description: One row of a workflow list.
      required:
        - namespace
        - workflowId
        - runId
        - workflowType
        - status
      properties:
        namespace:
          type: string
        workflowId:
          type: string
        runId:
          type: string
        workflowType:
          type: string
        taskQueue:
          type: string
        status:
          $ref: '#/components/schemas/WorkflowStatus'
        startTime:
          type: string
          description: ISO 8601 timestamp.
        closeTime:
          type: string
          description: ISO 8601 timestamp, set when the execution is closed.
        historyLength:
          type: integer
        entityRef:
          type: string
          description: Catalog entity reference from the configured search attribute.
        initiator:
          type: string
          description: Entity reference of the user who started the workflow, from the search attribute `temporal.searchAttributes.initiator`, when configured.
        workflowEntityRef:
          type: string
          description: The `TemporalWorkflow` entity this run matches, when it is listed for or opened through an entity that depends on one. The permission checks of the operations include this entity.
        workflowTypeEntityRef:
          type: string
          description: The `TemporalWorkflow` entity that describes the workflow type of this run, found in the catalog by namespace, workflow type and task queue. It is only for showing a link; no permission check uses it. It is missing when no entity or more than one entity matches.
        webUiUrl:
          type: string
          description: Link to the execution in the Temporal Web UI, when configured.
        extensions:
          type: object
          description: Data added by backend workflow enrichers, keyed by enricher.
          additionalProperties: {}
      additionalProperties: false
    WorkflowDetail:
      type: object
      description: Details of one workflow execution.
      required:
        - namespace
        - workflowId
        - runId
        - workflowType
        - status
        - pendingActivities
      properties:
        namespace:
          type: string
        workflowId:
          type: string
        runId:
          type: string
        workflowType:
          type: string
        taskQueue:
          type: string
        status:
          $ref: '#/components/schemas/WorkflowStatus'
        startTime:
          type: string
          description: ISO 8601 timestamp.
        closeTime:
          type: string
          description: ISO 8601 timestamp, set when the execution is closed.
        historyLength:
          type: integer
        entityRef:
          type: string
          description: Catalog entity reference from the configured search attribute.
        initiator:
          type: string
          description: Entity reference of the user who started the workflow, from the search attribute `temporal.searchAttributes.initiator`, when configured.
        workflowEntityRef:
          type: string
          description: The `TemporalWorkflow` entity this run matches, when it is listed for or opened through an entity that depends on one. The permission checks of the operations include this entity.
        workflowTypeEntityRef:
          type: string
          description: The `TemporalWorkflow` entity that describes the workflow type of this run, found in the catalog by namespace, workflow type and task queue. It is only for showing a link; no permission check uses it. It is missing when no entity or more than one entity matches.
        webUiUrl:
          type: string
          description: Link to the execution in the Temporal Web UI, when configured.
        extensions:
          type: object
          description: Data added by backend workflow enrichers, keyed by enricher.
          additionalProperties: {}
        executionTime:
          type: string
          description: ISO 8601 timestamp.
        parent:
          type: object
          required:
            - workflowId
          properties:
            workflowId:
              type: string
            runId:
              type: string
            namespace:
              type: string
          additionalProperties: false
        searchAttributes:
          type: object
          additionalProperties: {}
        memo:
          type: object
          additionalProperties: {}
        failure:
          $ref: '#/components/schemas/WorkflowFailure'
        continuedAsNewRunId:
          type: string
          description: The run this one continued as, for a run that continued as new.
        firstRunId:
          type: string
          description: Run ID of the first execution in this run's chain (Continue-As-New, workflow retry, cron or reset).
        pendingActivities:
          type: array
          items:
            $ref: '#/components/schemas/PendingActivity'
      additionalProperties: false
    RelatedWorkflows:
      type: object
      description: |-
        How many TemporalWorkflow entities an entity depends on, and how many of them were queried for the merged list and statistics. At most 20 are queried. Present on entity lists and statistics when the entity depends on at least one; absent on namespace lists.
      required:
        - total
        - queried
      properties:
        total:
          type: integer
          description: Number of TemporalWorkflow entities the entity depends on.
        queried:
          type: integer
          description: Number of those entities included in the query, at most 20. When total is greater, the rest are left out.
      additionalProperties: false
    WorkflowListResponse:
      type: object
      required:
        - items
        - namespace
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowSummary'
        nextPageToken:
          type: string
          description: Opaque token for the next page, absent on the last page.
        namespace:
          type: string
        relatedWorkflows:
          $ref: '#/components/schemas/RelatedWorkflows'
      additionalProperties: false
    WorkflowStatsResponse:
      type: object
      description: Summary of an entity's most recent workflow runs.
      required:
        - namespace
        - sampleSize
        - limit
        - byStatus
        - succeeded
        - failed
        - running
      properties:
        namespace:
          type: string
        sampleSize:
          type: integer
          description: Number of most recent runs the numbers are computed from, using the same default as the workflow list (runs that continued as new are left out).
        limit:
          type: integer
          description: The requested maximum of runs.
        byStatus:
          type: object
          description: Runs by status.
          properties:
            Running:
              type: integer
            Completed:
              type: integer
            Failed:
              type: integer
            Canceled:
              type: integer
            Terminated:
              type: integer
            ContinuedAsNew:
              type: integer
            TimedOut:
              type: integer
            Unknown:
              type: integer
          additionalProperties: false
        succeeded:
          type: integer
          description: Completed runs.
        failed:
          type: integer
          description: Failed, timed out or terminated runs.
        running:
          type: integer
          description: Running runs.
        averageDurationMs:
          type: number
          description: Mean duration of the closed runs in the sample, in milliseconds.
        relatedWorkflows:
          $ref: '#/components/schemas/RelatedWorkflows'
      additionalProperties: false
    WorkflowTypeOverviewRequest:
      type: object
      description: References of `TemporalWorkflow` entities, for example one page of the Temporal page.
      required:
        - entityRefs
      properties:
        entityRefs:
          type: array
          minItems: 1
          maxItems: 25
          items:
            type: string
            minLength: 1
            maxLength: 1000
      additionalProperties: false
    WorkflowTypeOverviewRun:
      type: object
      description: One run in the workflow type overview.
      required:
        - namespace
        - workflowId
        - runId
        - status
      properties:
        namespace:
          type: string
        workflowId:
          type: string
        runId:
          type: string
        status:
          $ref: '#/components/schemas/WorkflowStatus'
        startTime:
          type: string
          description: ISO 8601 timestamp.
        closeTime:
          type: string
          description: ISO 8601 timestamp.
      additionalProperties: false
    WorkflowTypeOverview:
      type: object
      description: The numbers of one `TemporalWorkflow` entity. The counts are approximate (Temporal's visibility store is eventually consistent) and kept by the backend for 60 seconds.
      required:
        - entityRef
        - running
        - completed
        - failed
        - windowDays
        - sampleSize
        - updatedAt
      properties:
        entityRef:
          type: string
        running:
          type: integer
          description: Runs that are running now, however old.
        completed:
          type: integer
          description: Runs that completed in the last `windowDays` days.
        failed:
          type: integer
          description: Runs that failed, timed out or were terminated in the last `windowDays` days.
        windowDays:
          type: integer
          description: Days that `completed`, `failed` and `lastFailure` cover (7).
        latestRun:
          $ref: '#/components/schemas/WorkflowTypeOverviewRun'
        averageDurationMs:
          type: number
          description: Mean duration of the closed runs among the most recent `sampleSize` runs, in milliseconds.
        sampleSize:
          type: integer
          description: Number of most recent runs `latestRun` and `averageDurationMs` come from (at most 50; runs that continued as new are left out).
        lastFailure:
          $ref: '#/components/schemas/WorkflowTypeOverviewRun'
        updatedAt:
          type: string
          description: When the numbers were read from Temporal (ISO 8601).
        error:
          type: object
          description: Set when the numbers could not be read; the counts are then 0. `message` is fixed text, never what Temporal said. `rateLimited` is true when Temporal refused a call for its rate limit.
          required:
            - message
          properties:
            message:
              type: string
            rateLimited:
              type: boolean
          additionalProperties: false
      additionalProperties: false
    WorkflowTypeOverviewResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          description: One item for each requested entity that the caller may read and that exists, in the order of the request.
          items:
            $ref: '#/components/schemas/WorkflowTypeOverview'
      additionalProperties: false
    WorkflowHistoryEvent:
      type: object
      required:
        - eventId
        - eventType
      properties:
        eventId:
          type: string
        eventTime:
          type: string
          description: ISO 8601 timestamp.
        eventType:
          type: string
          description: Event type without the `EVENT_TYPE_` prefix, for example `WorkflowExecutionStarted`.
        attributes:
          type: object
          description: 'The event attributes as JSON, with payloads shown as `DecodedPayload`: `{ encoding, value }` (decoded JSON), `{ encoding, size, undecodable: true, metadata? }` (data that is not plain JSON, for example encrypted payloads; the data itself is not sent) or `{ encoding, external }` (a reference to External Storage).'
          additionalProperties: {}
      additionalProperties: false
    WorkflowHistoryResponse:
      type: object
      required:
        - events
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowHistoryEvent'
        nextPageToken:
          type: string
          description: Opaque token for the next page, absent on the last page.
      additionalProperties: false
    ExternalPayload:
      type: object
      description: Where a payload in Temporal External Storage (the S3 driver of the Temporal SDKs) is stored, from the reference payload in the history. The data is not read.
      required:
        - store
        - bucket
        - key
        - size
        - sha256
      properties:
        store:
          type: string
        bucket:
          type: string
        key:
          type: string
        size:
          type: integer
          description: Size of the stored payload in bytes, as the reference records it.
        sha256:
          type: string
          description: SHA-256 of the stored object, lowercase hex.
      additionalProperties: false
    WorkflowResultResponse:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/WorkflowStatus'
        result:
          description: Decoded workflow result, when completed.
        failure:
          $ref: '#/components/schemas/WorkflowFailure'
      additionalProperties: false
      description: The result or failure of a workflow run, from its close event. A running run has only `status`.
    WorkflowNodeKind:
      type: string
      enum:
        - workflowStarted
        - workflowClosed
        - activity
        - timer
        - signal
        - signalSent
        - update
        - childWorkflow
        - marker
        - cancelRequest
        - waiting
        - workflowTask
        - event
    WorkflowNodeStatus:
      type: string
      enum:
        - Scheduled
        - Running
        - Retrying
        - Waiting
        - Completed
        - Failed
        - TimedOut
        - Canceled
        - Terminated
        - Rejected
        - ContinuedAsNew
    WorkflowNodeEvent:
      type: object
      required:
        - eventId
        - eventType
      properties:
        eventId:
          type: string
        eventType:
          type: string
        eventTime:
          type: string
          description: ISO 8601 timestamp.
      additionalProperties: false
    WorkflowNodeAttempt:
      type: object
      required:
        - attempt
        - status
      properties:
        attempt:
          type: integer
        status:
          $ref: '#/components/schemas/WorkflowNodeStatus'
        startedTime:
          type: string
          description: ISO 8601 timestamp.
        failure:
          $ref: '#/components/schemas/WorkflowFailure'
      additionalProperties: false
    WorkflowDeadline:
      type: object
      required:
        - time
        - kind
      properties:
        time:
          type: string
          description: ISO 8601 timestamp.
        kind:
          type: string
          description: '`fires`: a plain timer; `timeout`: the time limit of a wait.'
          enum:
            - fires
            - timeout
      additionalProperties: false
    WorkflowRunChain:
      type: object
      properties:
        previousRunId:
          type: string
          description: The run this one continued from.
        nextRunId:
          type: string
          description: The run this one continued as.
        index:
          type: integer
          description: Position of the run among the runs of the workflow ID, from 1.
        total:
          type: integer
          description: Runs of the workflow ID.
      additionalProperties: false
    WorkflowGraphNode:
      type: object
      required:
        - id
        - kind
        - name
        - status
        - events
      properties:
        id:
          type: string
          description: Stable within the run, for example `activity-5`.
        kind:
          $ref: '#/components/schemas/WorkflowNodeKind'
        name:
          type: string
        summary:
          type: string
        status:
          $ref: '#/components/schemas/WorkflowNodeStatus'
        internal:
          type: boolean
        waitingFor:
          type: string
        deadline:
          $ref: '#/components/schemas/WorkflowDeadline'
        startTime:
          type: string
          description: ISO 8601 timestamp.
        endTime:
          type: string
          description: ISO 8601 timestamp.
        stepId:
          type: string
        attempt:
          type: integer
        maximumAttempts:
          type: integer
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowNodeAttempt'
        input:
          description: Decoded input; left out when the caller may not read payloads.
        result:
          description: Decoded result; left out when the caller may not read payloads.
        failure:
          $ref: '#/components/schemas/WorkflowFailure'
        workflow:
          type: object
          required:
            - namespace
            - workflowId
          properties:
            namespace:
              type: string
            workflowId:
              type: string
            runId:
              type: string
          additionalProperties: false
        details:
          type: object
          additionalProperties: {}
        llm:
          type: object
          additionalProperties: {}
          description: 'A model call, recognized by an LLM adapter: model, tokens and tool calls (names and numbers). Experimental: the shape changes before the first stable release.'
        tool:
          type: object
          additionalProperties: {}
          description: 'A tool call of a model call. Experimental: the shape changes before the first stable release.'
        groups:
          type: array
          items:
            type: string
          description: 'Keys of the Temporal event groups of the step (`label:<id>`, `event:<event ID>`, `update:<update ID>`), outer groups first. Experimental, like Event Groups in Temporal.'
        events:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowNodeEvent'
      additionalProperties: false
    WorkflowGraphEdge:
      type: object
      required:
        - id
        - source
        - target
      properties:
        id:
          type: string
        source:
          type: string
        target:
          type: string
      additionalProperties: false
    WorkflowGraphResponse:
      type: object
      required:
        - status
        - nodes
        - edges
        - completedSteps
        - totalSteps
        - truncated
      properties:
        status:
          $ref: '#/components/schemas/WorkflowStatus'
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowGraphNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowGraphEdge'
        current:
          type: string
        currentDeadline:
          $ref: '#/components/schemas/WorkflowDeadline'
        completedSteps:
          type: integer
          description: Steps that are done in the history events read.
        totalSteps:
          type: integer
          description: Steps seen so far in the history read; not a total for a running workflow, because later steps are unknown until they run. When truncated is true, covers only the first events read.
        truncated:
          type: boolean
          description: True when the history was longer than the backend reads for a graph (5000 events).
        runChain:
          $ref: '#/components/schemas/WorkflowRunChain'
        eventGroups:
          type: array
          items:
            type: object
            additionalProperties: {}
          description: 'Temporal event groups of the run (`WorkflowEventGroup`: key, kind, name, steps, inferred parent and children, status, times, tokens), in the order they started; left out when there are none. Experimental, like Event Groups in Temporal: the shape may change.'
        eventGroupsTruncated:
          type: boolean
          description: True when the run has more event groups than the backend reads (1000), or a step more than 32; the others are left out.
      additionalProperties: false
    WorkflowProgressResponse:
      type: object
      required:
        - status
        - completedSteps
        - totalSteps
        - truncated
      properties:
        status:
          $ref: '#/components/schemas/WorkflowStatus'
        completedSteps:
          type: integer
          description: Steps that are done in the history events read.
        totalSteps:
          type: integer
          description: Steps seen so far in the history read; not a total for a running workflow, because later steps are unknown until they run. When truncated is true, covers only the first events read.
        current:
          type: string
        currentDeadline:
          $ref: '#/components/schemas/WorkflowDeadline'
        truncated:
          type: boolean
          description: True when the history was longer than the backend reads for progress (1000 events).
      additionalProperties: false
    WorkflowMessageDefinition:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
        inputSchema:
          type: object
          description: JSON Schema of the one argument, from `spec.messages`.
          additionalProperties: {}
        example:
          description: 'Example arguments: an array of arguments, or the one argument.'
        userField:
          type: string
      additionalProperties: false
    WorkflowMessageDefinitionsResponse:
      type: object
      required:
        - signals
        - updates
        - queries
      properties:
        signals:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowMessageDefinition'
        updates:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowMessageDefinition'
        queries:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowMessageDefinition'
      additionalProperties: false
    WorkflowMessageRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '^.*\S.*$'
          description: The message name; it is trimmed, and cannot be blank.
        args:
          type:
            - array
            - 'null'
          description: The arguments of the message, sent as JSON payloads. `null` is treated as if `args` was omitted.
          items: {}
    WorkflowMessageResponse:
      type: object
      properties:
        result:
          description: 'The result; absent when there is none. A result the backend cannot decode is `{ encoding, size, undecodable: true }`, with `metadata` (the metadata other than `encoding`, as text) when the payload has any.'
      additionalProperties: false
    WorkflowIdReusePolicy:
      type: string
      description: Controls whether the workflow ID of an earlier closed execution may be reused. `TERMINATE_IF_RUNNING` is intentionally not accepted on start routes.
      enum:
        - ALLOW_DUPLICATE
        - ALLOW_DUPLICATE_FAILED_ONLY
        - REJECT_DUPLICATE
    WorkflowStartRequest:
      type: object
      properties:
        workflowType:
          type:
            - string
            - 'null'
          maxLength: 255
          pattern: '^[A-Za-z0-9_][A-Za-z0-9_.:/-]{0,254}$'
          description: '`null` is treated as if the field was omitted.'
        taskQueue:
          type:
            - string
            - 'null'
          maxLength: 255
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]{0,254}$'
          description: '`null` is treated as if the field was omitted.'
        namespace:
          type:
            - string
            - 'null'
          maxLength: 255
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,254}$'
          description: Only read by `POST /workflows`. `null` is treated as if the field was omitted.
        args:
          type:
            - array
            - 'null'
          items: {}
          description: '`null` is treated as if `args` was omitted.'
        workflowId:
          type:
            - string
            - 'null'
          maxLength: 1000
          description: Without it, one is made from the workflow type. `null` is treated as if the field was omitted.
        workflowIdReusePolicy:
          $ref: '#/components/schemas/WorkflowIdReusePolicy'
          description: Optional policy controlling whether an earlier closed execution with the same workflow ID prevents starting a new run.
    WorkflowStartResponse:
      type: object
      required:
        - namespace
        - workflowId
        - runId
      properties:
        namespace:
          type: string
        workflowId:
          type: string
        runId:
          type: string
      additionalProperties: false
    Empty:
      type: object
      description: An empty object.
      properties: {}
      additionalProperties: false
    TemporalScheduleAction:
      type: object
      required:
        - scheduledAt
        - takenAt
        - workflowId
        - runId
      properties:
        scheduledAt:
          type: string
          description: ISO 8601 timestamp.
        takenAt:
          type: string
          description: ISO 8601 timestamp.
        workflowId:
          type: string
        runId:
          type: string
          description: The first run of the workflow it started.
      additionalProperties: false
    TemporalSchedule:
      type: object
      required:
        - namespace
        - scheduleId
        - spec
        - paused
        - nextActionTimes
        - recentActions
      properties:
        namespace:
          type: string
        scheduleId:
          type: string
        workflowType:
          type: string
        spec:
          type: array
          description: When it runs, one line per interval or calendar, e.g. `every 1h`.
          items:
            type: string
        timezone:
          type: string
        paused:
          type: boolean
        note:
          type: string
        nextActionTimes:
          type: array
          items:
            type: string
            description: ISO 8601 timestamp.
        recentActions:
          type: array
          items:
            $ref: '#/components/schemas/TemporalScheduleAction'
      additionalProperties: false
    TemporalScheduleListResponse:
      type: object
      required:
        - items
        - truncated
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TemporalSchedule'
        truncated:
          type: boolean
          description: True when there were more schedules than the backend reads.
      additionalProperties: false
    WorkflowLlmCallResponse:
      type: object
      description: 'The full record of one model call. Experimental: the shape changes before the first stable release.'
      required:
        - nodeId
        - activityId
        - activityType
        - framework
        - status
      properties:
        nodeId:
          type: string
        activityId:
          type: string
        activityType:
          type: string
        call:
          type: string
          description: Name of the call, when the step records one.
        framework:
          type: string
          description: The LLM adapter that read the step, for example `vercel-ai-sdk`.
        index:
          type: integer
          minimum: 0
          description: Position of the call among the model calls of the step, when it made several.
        callCount:
          type: integer
          minimum: 2
          description: Model calls in the step, when it made several.
        status:
          $ref: '#/components/schemas/WorkflowNodeStatus'
        record:
          type: object
          additionalProperties: {}
        raw: {}
        unavailable:
          type: string
        external:
          $ref: '#/components/schemas/ExternalPayload'
        fromFailure:
          type: boolean
      additionalProperties: {}
    WorkflowDefinitionResponse:
      type: object
      required:
        - entityRef
        - format
        - target
        - maxBytes
        - tasks
      properties:
        entityRef:
          type: string
        format:
          type: string
          enum:
            - serverless-workflow
            - source
        language:
          type: string
          enum:
            - typescript
            - javascript
            - python
            - go
            - java
            - text
        symbol:
          type: string
        symbolLines:
          type: object
          required:
            - startLine
            - endLine
          properties:
            startLine:
              type: integer
            endLine:
              type: integer
          additionalProperties: false
        target:
          type: string
          description: '`spec.definition.target` as written.'
        url:
          type: string
          description: The URL the file was read from.
        content:
          type: string
          description: The text of the file; absent when it could not be read.
        size:
          type: integer
          description: Size of the file in bytes.
        maxBytes:
          type: integer
          description: Largest file the backend reads, in bytes.
        document:
          type: object
          description: The parsed file. Absent when it is not valid YAML.
          additionalProperties: {}
        tasks:
          type: array
          items:
            type: object
            required:
              - pointer
              - name
              - startLine
              - endLine
            properties:
              pointer:
                type: string
                description: JSON pointer of the task, for example `/do/1/checkStock`.
              name:
                type: string
              startLine:
                type: integer
              endLine:
                type: integer
            additionalProperties: false
        error:
          type: object
          required:
            - kind
            - message
          properties:
            kind:
              type: string
              enum:
                - read
                - tooLarge
                - parse
                - format
            message:
              type: string
            line:
              type: integer
            column:
              type: integer
          additionalProperties: false
      additionalProperties: false
paths:
  /workflows:
    get:
      operationId: listWorkflows
      summary: List the workflows of a namespace
      description: |-
        Every workflow of a namespace, for the Temporal page. Runs that match a `TemporalWorkflow` entity the caller can read in the catalog have `workflowTypeEntityRef`.

        Permission: `temporal.workflow.list`; a conditional decision limits the list to the workflows it allows.
      tags:
        - Workflows
      x-temporal-permissions:
        - temporal.workflow.list
      parameters:
        - $ref: '#/components/parameters/listNamespace'
        - $ref: '#/components/parameters/status'
        - $ref: '#/components/parameters/allRuns'
        - $ref: '#/components/parameters/workflowType'
        - $ref: '#/components/parameters/workflowIdPrefix'
        - $ref: '#/components/parameters/searchAttribute'
        - $ref: '#/components/parameters/listPageSize'
        - $ref: '#/components/parameters/pageToken'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: startWorkflow
      summary: Start a workflow from the Temporal page
      description: |-
        `workflowType` and `taskQueue` are required; `namespace` defaults to `temporal.connection.defaultNamespace`. 409 when the workflow ID is taken.

        Permission: `temporal.workflow.list` and `temporal.workflow.start`, both without conditions.

        Exists unless `temporal.control.enabled` is false (otherwise 404). Recorded with the auditor.
      tags:
        - Operations
      x-temporal-permissions:
        - temporal.workflow.list
        - temporal.workflow.start
      x-temporal-control: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowStartRequest'
      responses:
        '201':
          description: Started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowStartResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /entities/{kind}/{namespace}/{name}/workflows:
    get:
      operationId: listEntityWorkflows
      summary: List the workflows of an entity
      description: |-
        The runs of the entity's workflow sources: its annotations, or the spec of a `TemporalWorkflow` entity, and the `TemporalWorkflow` entities it depends on. The `TemporalWorkflow` entities it depends on count only when the caller has the same permission on them; the others are left out, without a 403.

        Permission: `temporal.workflow.read` on the entity.
      tags:
        - Workflows
      x-temporal-permissions:
        - temporal.workflow.read
      parameters:
        - $ref: '#/components/parameters/entityKind'
        - $ref: '#/components/parameters/entityNamespace'
        - $ref: '#/components/parameters/entityName'
        - $ref: '#/components/parameters/status'
        - $ref: '#/components/parameters/allRuns'
        - $ref: '#/components/parameters/searchAttribute'
        - $ref: '#/components/parameters/listPageSize'
        - $ref: '#/components/parameters/pageToken'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: startEntityWorkflow
      summary: Start a workflow of an entity
      description: |-
        The workflow type and task queue default to the entity's; they must be one of the entity's own workflow sources. `namespace` is not read: the workflow starts in the entity's namespace. 409 when the workflow ID is taken.

        Permission: `temporal.workflow.start` on the entity.

        Exists unless `temporal.control.enabled` is false (otherwise 404). Recorded with the auditor.
      tags:
        - Operations
      x-temporal-permissions:
        - temporal.workflow.start
      x-temporal-control: true
      parameters:
        - $ref: '#/components/parameters/entityKind'
        - $ref: '#/components/parameters/entityNamespace'
        - $ref: '#/components/parameters/entityName'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowStartRequest'
      responses:
        '201':
          description: Started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowStartResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /schedules:
    get:
      operationId: listSchedules
      summary: List the schedules of a namespace
      description: 'Permission: `temporal.workflow.list` without conditions.'
      tags:
        - Schedules
      x-temporal-permissions:
        - temporal.workflow.list
      parameters:
        - $ref: '#/components/parameters/listNamespace'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemporalScheduleListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /entities/{kind}/{namespace}/{name}/schedules:
    get:
      operationId: listEntitySchedules
      summary: List the schedules of an entity
      description: |-
        Schedules that start the workflow types of the entity's workflow sources. The `TemporalWorkflow` entities it depends on count only when the caller has the same permission on them; the others are left out, without a 403.

        Permission: `temporal.workflow.read` on the entity.
      tags:
        - Schedules
      x-temporal-permissions:
        - temporal.workflow.read
      parameters:
        - $ref: '#/components/parameters/entityKind'
        - $ref: '#/components/parameters/entityNamespace'
        - $ref: '#/components/parameters/entityName'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemporalScheduleListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /entities/{kind}/{namespace}/{name}/workflow-stats:
    get:
      operationId: getEntityWorkflowStats
      summary: Summarize an entity's most recent runs
      description: |-
        The runs of the entity's workflow sources, as in the default of the workflow list: runs that continued as new are left out. The `TemporalWorkflow` entities it depends on count only when the caller has the same permission on them; the others are left out, without a 403.

        Permission: `temporal.workflow.read` on the entity.
      tags:
        - Workflows
      x-temporal-permissions:
        - temporal.workflow.read
      parameters:
        - $ref: '#/components/parameters/entityKind'
        - $ref: '#/components/parameters/entityNamespace'
        - $ref: '#/components/parameters/entityName'
        - $ref: '#/components/parameters/statsLimit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowStatsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /workflow-types/overview:
    post:
      operationId: getWorkflowTypeOverview
      summary: Summarize several TemporalWorkflow entities
      description: |-
        The numbers of the Workflows tab of the Temporal page, for up to 25 `TemporalWorkflow` entities: the runs that are running now, the runs completed and failed (failed, timed out or terminated) in the last 7 days, the latest run and the mean duration of the 50 most recent runs (runs that continued as new are left out), and the last failure of the 7 days. The numbers of an entity come from at most three visibility calls to Temporal (one count grouped by status; a list of the most recent runs; a list of the last failure when it is not among them); a server that cannot group refuses the grouped count, and three counts without grouping follow, at most six calls, with at most 4 calls in flight in each namespace. They are kept for 60 seconds by namespace and visibility query. A call that fails, for example for Temporal's rate limit, gives an item with `error`; it is not retried.

        Permission: `temporal.workflow.read` on each entity, checked in one request on every call. Entities the caller may not read, and entities that do not exist, are left out of `items`, without a 403. A reference that is not of kind `TemporalWorkflow` is a 400.
      tags:
        - Workflows
      x-temporal-permissions:
        - temporal.workflow.read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowTypeOverviewRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowTypeOverviewResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /namespaces/{namespace}/workflows/{workflowId}:
    get:
      operationId: listWorkflowRuns
      summary: List the runs of a workflow ID
      description: |-
        The runs of one workflow ID, runs that continued as new included, in the order Temporal's visibility store returns them: the plugin asks for no order (an `ORDER BY` is refused by SQL visibility, which lists the running run first, then the closed runs, the last closed first). Runs past the retention period of the namespace are not listed. A workflow ID with a quote, a backslash or a control character cannot be listed: 400 (open its run by run ID instead).

        Permission: with `entityRef`, `temporal.workflow.read` on that entity, and only the runs that are the entity's workflows are listed (the entity must be in the namespace of the path, else 404; child workflows of the entity's workflows are not listed). Without it, `temporal.workflow.list`, with its conditions applied to every run, like `GET /workflows`.
      tags:
        - Workflows
      x-temporal-permissions:
        - temporal.workflow.read
        - temporal.workflow.list
      parameters:
        - $ref: '#/components/parameters/namespace'
        - $ref: '#/components/parameters/workflowId'
        - $ref: '#/components/parameters/entityRef'
        - $ref: '#/components/parameters/listPageSize'
        - $ref: '#/components/parameters/pageToken'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /namespaces/{namespace}/workflows/{workflowId}/runs/{runId}:
    get:
      operationId: getWorkflowRun
      summary: Get the details of a workflow (one run)
      description: "Permission: `temporal.workflow.read` on the entity (from `entityRef`, else from the workflow's entity reference search attribute), or `temporal.workflow.list` for a workflow it covers when no `entityRef` is given."
      tags:
        - Workflows
      x-temporal-permissions:
        - temporal.workflow.read
        - temporal.workflow.list
      parameters:
        - $ref: '#/components/parameters/namespace'
