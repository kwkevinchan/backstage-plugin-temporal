        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /namespaces/{namespace}/workflows/{workflowId}/runs/{runId}/cancel:
    post:
      operationId: cancelWorkflowRun
      summary: Request cancellation of the workflow's execution chain
      description: |-
        Operates on the execution chain of the opened run (passing `firstExecutionRunId` without `runId` to Temporal), targeting whichever run in the chain is currently running. 409 when the workflow ID now belongs to a different chain. When the chain has already ended Temporal does nothing and the answer is still 202. When the Temporal server does not report the chain ID, the request is locked to the opened run. The body is not read and is ignored, including unknown fields, an array, or a non-JSON body.

        Permission: `temporal.workflow.read` on the entity (from `entityRef`, else from the workflow's entity reference search attribute), or `temporal.workflow.list` for a workflow it covers when no `entityRef` is given. Then `temporal.workflow.cancel` on the opened run's entity (assuming runs in a chain belong to the same entity; for a workflow without one, the permission must be allowed without conditions).

        Exists unless `temporal.control.enabled` is false (otherwise 404). Recorded with the auditor (`firstRunId`, `scope: 'chain'`; `scope: 'run'` without `firstRunId` when the chain ID is not reported).
      tags:
        - Operations
      x-temporal-permissions:
        - temporal.workflow.read
        - temporal.workflow.list
        - temporal.workflow.cancel
      x-temporal-control: true
      parameters:
        - $ref: '#/components/parameters/namespace'
        - $ref: '#/components/parameters/workflowId'
        - $ref: '#/components/parameters/runId'
        - $ref: '#/components/parameters/entityRef'
      requestBody:
        required: false
        description: The body is not read and is ignored.
        content:
          application/json:
            schema: {}
      responses:
        '202':
          description: Requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empty'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /namespaces/{namespace}/workflows/{workflowId}/runs/{runId}/terminate:
    post:
      operationId: terminateWorkflowRun
      summary: Terminate the workflow's execution chain
      description: |-
        Operates on the execution chain of the opened run (passing `firstExecutionRunId` without `runId` to Temporal), stopping whichever run in the chain is currently running. 409 when the chain has ended or the workflow ID now belongs to a different chain. When the Temporal server does not report the chain ID, the request is locked to the opened run. The reason defaults to `Terminated from Backstage`.

        Permission: `temporal.workflow.read` on the entity (from `entityRef`, else from the workflow's entity reference search attribute), or `temporal.workflow.list` for a workflow it covers when no `entityRef` is given. Then `temporal.workflow.terminate` on the opened run's entity (assuming runs in a chain belong to the same entity; for a workflow without one, the permission must be allowed without conditions).

        Exists unless `temporal.control.enabled` is false (otherwise 404). Recorded with the auditor (`firstRunId`, `scope: 'chain'`; `scope: 'run'` without `firstRunId` when the chain ID is not reported).
      tags:
        - Operations
      x-temporal-permissions:
        - temporal.workflow.read
        - temporal.workflow.list
        - temporal.workflow.terminate
      x-temporal-control: true
      parameters:
        - $ref: '#/components/parameters/namespace'
        - $ref: '#/components/parameters/workflowId'
        - $ref: '#/components/parameters/runId'
        - $ref: '#/components/parameters/entityRef'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type:
                    - string
                    - 'null'
                  maxLength: 1000
                  description: '`null` is treated as if the field was omitted; the default reason is then used.'
      responses:
        '200':
          description: Terminated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empty'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /namespaces/{namespace}/workflows/{workflowId}/runs/{runId}/rerun:
    post:
      operationId: rerunWorkflowRun
      summary: Start a new workflow with the type, task queue and input of a run (one run)
      description: |-
        Only a closed run can be rerun: 409 while it is running. Keeps the entity of the run; the initiator is the caller. 409 when the workflow ID is taken.

        Permission: `temporal.workflow.read` on the entity (from `entityRef`, else from the workflow's entity reference search attribute), or `temporal.workflow.list` for a workflow it covers when no `entityRef` is given. Then `temporal.workflow.rerun` on the workflow's entity (for a workflow without one, the permission must be allowed without conditions).

        Exists unless `temporal.control.enabled` is false (otherwise 404). Recorded with the auditor.
      tags:
        - Operations
      x-temporal-permissions:
        - temporal.workflow.read
        - temporal.workflow.list
        - temporal.workflow.rerun
      x-temporal-control: true
      parameters:
        - $ref: '#/components/parameters/namespace'
        - $ref: '#/components/parameters/workflowId'
        - $ref: '#/components/parameters/runId'
        - $ref: '#/components/parameters/entityRef'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                workflowId:
                  type:
                    - string
                    - 'null'
                  maxLength: 1000
                  description: Without it, one is made from the run's workflow ID, `-rerun-` and a random suffix (a rerun of a rerun replaces the suffix). `null` is treated as if the field was omitted.
      responses:
        '201':
          description: Started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowStartResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
