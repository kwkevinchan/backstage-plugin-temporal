      x-temporal-control: true
      parameters:
        - $ref: '#/components/parameters/namespace'
        - $ref: '#/components/parameters/workflowId'
        - $ref: '#/components/parameters/runId'
        - $ref: '#/components/parameters/entityRef'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 1000
      responses:
        '200':
          description: Terminated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empty'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /namespaces/{namespace}/workflows/{workflowId}/runs/{runId}/rerun:
    post:
      operationId: rerunWorkflowRun
      summary: Start a new workflow with the type, task queue and input of a run (one run)
      description: |-
        Keeps the entity of the run; the initiator is the caller. 409 when the workflow ID is taken.

        Permission: `temporal.workflow.read` on the entity (from `entityRef`, else from the workflow's entity reference search attribute), or `temporal.workflow.list` for a workflow it covers when no `entityRef` is given. Then `temporal.workflow.rerun` on the workflow's entity (for a workflow without one, the permission must be allowed without conditions).

        Exists unless `temporal.control.enabled` is false (otherwise 404). Recorded with the auditor.
      tags:
        - Operations
      x-temporal-permissions:
        - temporal.workflow.read
        - temporal.workflow.list
        - temporal.workflow.rerun
      x-temporal-control: true
      parameters:
        - $ref: '#/components/parameters/namespace'
        - $ref: '#/components/parameters/workflowId'
        - $ref: '#/components/parameters/runId'
        - $ref: '#/components/parameters/entityRef'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                workflowId:
                  type: string
                  maxLength: 1000
                  description: Without it, one is made from the workflow type.
      responses:
        '201':
          description: Started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowStartResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /namespaces/{namespace}/workflows/{workflowId}/runs/{runId}/actions/{actionId}:
    post:
      operationId: runWorkflowRunAction
      summary: Run a custom action on a workflow (one run)
      description: |-
        Actions are registered by backend modules (`temporalControlExtensionPoint`). The body is passed to the action as it is. 404 for an unknown action; 409 when the action does not apply to the workflow.

        Permission: `temporal.workflow.read` on the entity (from `entityRef`, else from the workflow's entity reference search attribute), or `temporal.workflow.list` for a workflow it covers when no `entityRef` is given. Then the action's permission on the workflow's entity (for a workflow without one, the permission must be allowed without conditions).

        Exists unless `temporal.control.enabled` is false (otherwise 404). Recorded with the auditor.
      tags:
        - Operations
      x-temporal-permissions:
        - temporal.workflow.read
        - temporal.workflow.list
      x-temporal-control: true
      parameters:
        - $ref: '#/components/parameters/namespace'
        - $ref: '#/components/parameters/workflowId'
        - $ref: '#/components/parameters/runId'
        - $ref: '#/components/parameters/actionId'
        - $ref: '#/components/parameters/entityRef'
      requestBody:
        required: false
        description: Any JSON value; the action defines it.
        content:
          application/json:
            schema: {}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowMessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /namespaces/{namespace}/schedules/{scheduleId}/{operation}:
    post:
      operationId: operateSchedule
      summary: Pause, unpause or trigger a schedule
      description: |-
        With `entityRef`, the schedule must start one of the workflow types of the entity or the `TemporalWorkflow` entities it depends on (404 otherwise). `pause` and `unpause` keep an optional note; `trigger` takes none (400). 409 when Temporal refuses the operation in the state of the schedule.

        Permission: `temporal.workflow.start` on the entity of `entityRef`, or without conditions without it.

        Exists unless `temporal.control.enabled` is false (otherwise 404). Recorded with the auditor.
      tags:
        - Schedules
        - Operations
      x-temporal-permissions:
        - temporal.workflow.start
      x-temporal-control: true
      parameters:
        - $ref: '#/components/parameters/namespace'
        - $ref: '#/components/parameters/scheduleId'
        - $ref: '#/components/parameters/scheduleOperation'
        - $ref: '#/components/parameters/entityRef'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  maxLength: 1000
      responses:
        '202':
          description: Done
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empty'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /entities/{kind}/{namespace}/{name}/definition:
    get:
      operationId: getEntityWorkflowDefinition
      summary: Get the definition file of a TemporalWorkflow entity
      description: |-
        The file of `spec.definition`, read with the URL reader, with its parsed document and the lines of its tasks. A file that cannot be read or parsed is answered with `error`, not an error status. 404 when the entity is not a `TemporalWorkflow` entity or has no `spec.definition`; 400 for an invalid `spec.definition`.

        Permission: `temporal.workflow.read` on the entity.

        Served by the backend module `@kwkevinchan/backstage-plugin-temporal-backend-module-zigflow`, only when it is installed.
      tags:
        - Definitions
      x-temporal-permissions:
        - temporal.workflow.read
      x-temporal-module: '@kwkevinchan/backstage-plugin-temporal-backend-module-zigflow'
      parameters:
        - $ref: '#/components/parameters/entityKind'
        - $ref: '#/components/parameters/entityNamespace'
        - $ref: '#/components/parameters/entityName'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowDefinitionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
