    post:
      operationId: runWorkflowRunAction
      summary: Run a custom action on a workflow (one run)
      description: |-
        Actions are registered by backend modules (`temporalControlExtensionPoint`). The body is passed to the action as it is, and must be a JSON object or array. 404 for an unknown action, or for an action ID that does not match the pattern; 409 when the action does not apply to the workflow.

        Permission: `temporal.workflow.read` on the entity (from `entityRef`, else from the workflow's entity reference search attribute), or `temporal.workflow.list` for a workflow it covers when no `entityRef` is given. Then the action's permission on the workflow's entity (for a workflow without one, the permission must be allowed without conditions).

        Exists unless `temporal.control.enabled` is false (otherwise 404). Recorded with the auditor.
      tags:
        - Operations
      x-temporal-permissions:
        - temporal.workflow.read
        - temporal.workflow.list
      x-temporal-control: true
      parameters:
        - $ref: '#/components/parameters/namespace'
        - $ref: '#/components/parameters/workflowId'
        - $ref: '#/components/parameters/runId'
        - $ref: '#/components/parameters/actionId'
        - $ref: '#/components/parameters/entityRef'
      requestBody:
        required: false
        description: A JSON object or array; the action defines the contents. A string, number, or `null` is rejected.
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                - type: array
                  items: {}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowMessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
