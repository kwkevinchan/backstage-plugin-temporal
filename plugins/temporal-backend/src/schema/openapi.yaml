          $ref: '#/components/responses/ServiceUnavailable'
  /namespaces/{namespace}/workflows/{workflowId}/runs/{runId}/handlers:
    get:
      operationId: getWorkflowRunHandlers
      summary: List the signals, updates and queries of a workflow (one run)
      description: |-
        From the metadata query of the Temporal SDKs, with what the workflow's `TemporalWorkflow` entity describes in `spec.messages`. Names starting with `__` are left out.

        Permission: `temporal.workflow.read` on the entity (from `entityRef`, else from the workflow's entity reference search attribute), or `temporal.workflow.list` for a workflow it covers when no `entityRef` is given.
      tags:
        - Workflows
