app:
  title: Temporal plugin development
  baseUrl: http://localhost:3000
  extensions:
    # New frontend system app: show the catalog on the start page.
    - page:catalog:
        config:
          path: /

organization:
  name: Example

backend:
  baseUrl: http://localhost:7007
  listen:
    port: 7007
  csp:
    connect-src: ["'self'", 'http:', 'https:']
  cors:
    origin: http://localhost:3000
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  # Local development only; app-config.production.yaml uses PostgreSQL.
  database:
    client: better-sqlite3
    connection: ':memory:'

auth:
  providers:
    # Signs in as the catalog user in examples/org.yaml (member of guests).
    guest:
      userEntityRef: user:default/guest

catalog:
  rules:
    - allow: [Component, System, API, Resource, Location, TemporalWorkflow]
  locations:
    # File locations are relative to the backend process (packages/backend).
    - type: file
      target: ../../examples/entities.yaml
    - type: file
      target: ../../examples/org.yaml
      rules:
        - allow: [User, Group]

permission:
  enabled: true

# Local Temporal development server. Override in app-config.local.yaml.
temporal:
  connection:
    address: ${TEMPORAL_ADDRESS:-localhost:7233}
    namespaces: [default]
    defaultNamespace: default
  webUi:
    baseUrl: ${TEMPORAL_UI_URL:-http://localhost:8080}
  searchAttributes:
    entityRef: BackstageEntityRef
    initiator: BackstageInitiator
  # Start, signal, update, cancel, terminate and rerun from Backstage. Every
  # operation is checked with the permission framework (allow-all here).
  control:
    enabled: true
