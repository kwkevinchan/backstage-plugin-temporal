---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-system
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: examples
spec:
  owner: guests
---
# A component whose workflows run on the `backstage-example` task queue.
# Start the example workflows with `yarn workspace example-worker start`.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: example-orders
  title: Example orders service
  description: Example service with Temporal workflows (success, failure, running).
  annotations:
    temporal.io/namespace: default
    temporal.io/task-queue: backstage-example
    temporal.io/workflow-type: orderWorkflow,paymentWorkflow,deploymentWorkflow,fulfillmentWorkflow,notifyCustomerWorkflow,approvalWorkflow
spec:
  type: service
  lifecycle: experimental
  owner: guests
  system: examples
---
# TemporalWorkflow entities (kind from the catalog module). Their runs are
# the executions that match the workflow type and task queue.
apiVersion: temporal.io/v1alpha1
kind: TemporalWorkflow
metadata:
  name: example-order-workflow
  title: Example order workflow
  description: Reserves stock for an order. Completes successfully.
  annotations:
    # A workflow written in code: its Definition tab links to the source.
    backstage.io/source-location: url:https://github.com/kwkevinchan/backstage-plugin-temporal/tree/main/packages/example-worker/src/
    backstage.io/view-url: https://github.com/kwkevinchan/backstage-plugin-temporal/blob/main/packages/example-worker/src/workflows.js
spec:
  owner: guests
  workflowType: orderWorkflow
  taskQueue: backstage-example
  system: examples
  lifecycle: experimental
---
apiVersion: temporal.io/v1alpha1
kind: TemporalWorkflow
metadata:
  name: example-payment-workflow
  title: Example payment workflow
  description: Charges a card. Fails with a cause chain (card declined).
spec:
  owner: guests
  workflowType: paymentWorkflow
  taskQueue: backstage-example
  system: examples
  lifecycle: experimental
---
# Started from Backstage (Start workflow on its Temporal tab), with the
# example input below. Takes signals (addNote, close), an update with a
# validator (setPriority) and a query (state). Needs a running worker:
# `yarn workspace example-worker serve`.
apiVersion: temporal.io/v1alpha1
kind: TemporalWorkflow
metadata:
  name: example-ticket-workflow
  title: Example ticket workflow
  description: A support ticket that runs until it is closed or canceled.
spec:
  owner: guests
  workflowType: ticketWorkflow
  taskQueue: backstage-example
  system: examples
  lifecycle: experimental
  exampleInput:
    title: Printer is out of paper
    priority: normal
---
# Workflows written in YAML (CNCF Serverless Workflow DSL, as Zigflow runs
# them). The Definition tab shows the file next to its graph; the backend
# reads it next to this file (temporal.definitions.readFileLocations in
# app-config.yaml). Start runs with `yarn workspace example-worker zigflow`
# and a Zigflow worker (see packages/example-worker/README.md).
apiVersion: temporal.io/v1alpha1
kind: TemporalWorkflow
metadata:
  name: example-yaml-order-workflow
  title: Example YAML order workflow
  description: Validates, packs and checks an order, takes the payment and ships it. Written in YAML.
spec:
  owner: guests
  workflowType: order-fulfillment
  taskQueue: backstage-zigflow
  system: examples
  lifecycle: experimental
  exampleInput:
    orderId: order-1
    items: [BOOK-1, PEN-2]
    express: true
  definition:
    format: serverless-workflow
    target: ./workflows/order-fulfillment.yaml
---
apiVersion: temporal.io/v1alpha1
kind: TemporalWorkflow
metadata:
  name: example-yaml-notify-workflow
  title: Example YAML notify workflow
  description: Tells the customer that the order is on its way. A child of the YAML order workflow.
spec:
  owner: guests
  workflowType: notify-customer
  taskQueue: backstage-zigflow
  system: examples
  lifecycle: experimental
  definition:
    format: serverless-workflow
    target: ./workflows/notify-customer.yaml
---
# A component that uses the two workflows (spec.dependsOn) and also carries
# an annotation for its own deployment workflow. Its Temporal tab merges both.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: example-checkout
  title: Example checkout service
  description: Uses the order and payment workflows, and runs its own deployments.
  annotations:
    temporal.io/task-queue: backstage-example
    temporal.io/workflow-type: deploymentWorkflow
spec:
  type: service
  lifecycle: experimental
  owner: guests
  system: examples
  dependsOn:
    - temporalworkflow:default/example-order-workflow
    - temporalworkflow:default/example-payment-workflow
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: example-website
spec:
  type: website
  lifecycle: experimental
  owner: guests
  system: examples
---
# The Temporal tab does not depend on the kind: any entity with the
# annotations gets it.
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: example-order-jobs
  title: Example order jobs
  description: Example resource that shows only the order workflows.
  annotations:
    temporal.io/task-queue: backstage-example
    temporal.io/workflow-type: orderWorkflow
spec:
  type: workflow
  owner: guests
  system: examples
