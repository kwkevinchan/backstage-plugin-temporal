---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-system
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: examples
spec:
  owner: guests
---
# A component whose workflows run on the `backstage-example` task queue.
# Start the example workflows with `yarn workspace example-worker start`.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: example-orders
  title: Example orders service
  description: Example service with Temporal workflows (success, failure, running).
  annotations:
    temporal.io/namespace: default
    temporal.io/task-queue: backstage-example
    temporal.io/workflow-type: orderWorkflow,paymentWorkflow,deploymentWorkflow,fulfillmentWorkflow,notifyCustomerWorkflow,approvalWorkflow
spec:
  type: service
  lifecycle: experimental
  owner: guests
  system: examples
---
# TemporalWorkflow entities (kind from the catalog module). Their runs are
# the executions that match the workflow type and task queue.
apiVersion: temporal.io/v1alpha1
kind: TemporalWorkflow
metadata:
  name: example-order-workflow
  title: Example order workflow
  description: Reserves stock for an order. Completes successfully.
spec:
  owner: guests
  workflowType: orderWorkflow
  taskQueue: backstage-example
  system: examples
  lifecycle: experimental
---
apiVersion: temporal.io/v1alpha1
kind: TemporalWorkflow
metadata:
  name: example-payment-workflow
  title: Example payment workflow
  description: Charges a card. Fails with a cause chain (card declined).
spec:
  owner: guests
  workflowType: paymentWorkflow
  taskQueue: backstage-example
  system: examples
  lifecycle: experimental
---
# A component that uses the two workflows (spec.dependsOn) and also carries
# an annotation for its own deployment workflow. Its Temporal tab merges both.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: example-checkout
  title: Example checkout service
  description: Uses the order and payment workflows, and runs its own deployments.
  annotations:
    temporal.io/task-queue: backstage-example
    temporal.io/workflow-type: deploymentWorkflow
spec:
  type: service
  lifecycle: experimental
  owner: guests
  system: examples
  dependsOn:
    - temporalworkflow:default/example-order-workflow
    - temporalworkflow:default/example-payment-workflow
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: example-website
spec:
  type: website
  lifecycle: experimental
  owner: guests
  system: examples
---
# The Temporal tab does not depend on the kind: any entity with the
# annotations gets it.
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: example-order-jobs
  title: Example order jobs
  description: Example resource that shows only the order workflows.
  annotations:
    temporal.io/task-queue: backstage-example
    temporal.io/workflow-type: orderWorkflow
spec:
  type: workflow
  owner: guests
  system: examples
