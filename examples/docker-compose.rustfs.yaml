# RustFS, an S3-compatible object store, for local development of Temporal
# External Storage. The S3 API listens on localhost:9100 (not the default 9000).
#
#   PAYLOAD_S3_ACCESS_KEY=... PAYLOAD_S3_SECRET_KEY=... \
#     docker compose -f examples/docker-compose.rustfs.yaml up -d
#
# The example worker creates the bucket when it is missing.
services:
  rustfs:
    image: rustfs/rustfs:1.0.4
    ports:
      - 127.0.0.1:9100:9000
    environment:
      RUSTFS_ACCESS_KEY: ${PAYLOAD_S3_ACCESS_KEY:?set PAYLOAD_S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${PAYLOAD_S3_SECRET_KEY:?set PAYLOAD_S3_SECRET_KEY}
    volumes:
      - rustfs-data:/data
volumes:
  rustfs-data:
